[pytest]
# Modules under tasks/ import each other bare (``from qa_artifacts import ...``),
# so both the app root and tasks/ have to be importable.
pythonpath = . tasks tests
testpaths = tasks tests
python_files = test_*.py
markers =
    e2e: end-to-end deck generation against a recorded-LLM stub (slower)
filterwarnings =
    ignore::DeprecationWarning
