<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="presentation_core_master" data-pptx-master-name="Presentation Core"
  data-pptx-layout="two_content" data-pptx-layout-name="Two Content">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="two-content-left-panel" x="64" y="220" width="552" height="300" rx="12" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="two-content-right-panel" x="664" y="220" width="552" height="300" rx="12" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="two-content-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="64 40 1152 72">
    <text id="two-content-title-carrier" data-pptx-carrier="true"
      x="64" y="90" fill="#1E293B" font-family="Inter, Arial, sans-serif"
      font-size="36" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="two-content-left-slot" data-pptx-placeholder="object" data-pptx-idx="1"
    data-pptx-bounds="88 244 504 252">
    <text id="two-content-left-carrier" data-pptx-carrier="true"
      x="88" y="286" fill="#475569"
      font-family="Inter, Arial, sans-serif" font-size="24">{{LEFT_CONTENT}}</text>
  </g>
  <g id="two-content-right-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="688 244 504 252">
    <text id="two-content-right-carrier" data-pptx-carrier="true"
      x="688" y="286" fill="#475569"
      font-family="Inter, Arial, sans-serif" font-size="24">{{RIGHT_CONTENT}}</text>
  </g>
</svg>
