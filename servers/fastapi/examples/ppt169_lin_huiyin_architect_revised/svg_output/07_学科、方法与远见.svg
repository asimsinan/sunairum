<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F1E8" />
  <rect x="48" y="48" width="1184" height="624" fill="none" stroke="#D8CBB8" stroke-width="1.5" />

  <g id="header">
    <text x="72" y="92" font-family="Arial, Helvetica, sans-serif" font-size="23.80" fill="#1F1B16" font-weight="700" textLength="256.7" lengthAdjust="spacingAndGlyphs">Discipline, Method, and Vision</text>
    <text x="72" y="121" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">What she truly left behind was not merely individual works, but an entire methodology for research and teaching</text>
    <line x1="72" y1="136" x2="1208" y2="136" stroke="#D8CBB8" stroke-width="1.5" />
    <text x="1196" y="92" text-anchor="end" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#978C7E">07</text>
  </g>

  <g id="card-1">
    <rect x="72" y="182" width="340" height="310" rx="14" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="1.5" />
    <use data-icon="tabler-outline/compass" x="98" y="210" width="24" height="24" fill="#A44A3F" />
    <text x="134" y="228" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1F1B16" font-weight="600" textLength="88.0" lengthAdjust="spacingAndGlyphs">Research methodology</text>
    <text x="98" y="270" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1F1B16">Equal emphasis on surveying, fieldwork, historical materials, and typological analysis</text>
    <text x="98" y="304" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#6A6258">She advanced the study of Chinese architecture from scattered observations to a verifiable, comparative, and teachable methodological system.</text>
    <text x="98" y="372" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.02" fill="#978C7E">Keywords</text>
    <text x="98" y="399" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#1F1B16">Field measurements · Image documentation · Historical analysis</text>
  </g>

  <g id="card-2">
    <rect x="470" y="182" width="340" height="310" rx="14" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
    <use data-icon="tabler-outline/school" x="496" y="210" width="24" height="24" fill="#A44A3F" />
    <text x="532" y="228" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1F1B16" font-weight="600" textLength="88.0" lengthAdjust="spacingAndGlyphs">Building the Discipline</text>
    <text x="496" y="270" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1F1B16">Participated in building the architectural education systems at Northeastern University and Tsinghua University</text>
    <text x="496" y="304" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#6A6258">She is not merely “one of the participants,” but one of those who institutionalized modern architectural education in China.</text>
    <text x="496" y="372" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.02" fill="#978C7E">Keywords</text>
    <text x="496" y="399" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#1F1B16">Architecture Department · Courses · Introduction to Housing</text>
  </g>

  <g id="card-3">
    <rect x="868" y="182" width="340" height="310" rx="14" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="1.5" />
    <use data-icon="tabler-outline/flag" x="894" y="210" width="24" height="24" fill="#A44A3F" />
    <text x="930" y="228" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1F1B16" font-weight="600" textLength="88.0" lengthAdjust="spacingAndGlyphs">Theoretical Foresight</text>
    <text x="894" y="270" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1F1B16">Vernacular preservation, ordinary people's housing, and “architectural intent”</text>
    <text x="894" y="304" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#6A6258">Her foresight lay in recognizing that architecture belonged not only to grand monuments, but also to the everyday world of ordinary people.</text>
    <text x="894" y="372" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.02" fill="#978C7E">Keywords</text>
    <text x="894" y="399" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#1F1B16">Vernacular dwellings · housing · architectural intent</text>
  </g>

  <g id="bottom-band">
    <rect x="72" y="528" width="1136" height="98" rx="14" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
    <use data-icon="tabler-outline/book-2" x="98" y="558" width="24" height="24" fill="#A44A3F" />
    <text x="136" y="578" font-family="Arial, Helvetica, sans-serif" font-size="16.80" fill="#A44A3F" font-weight="700">What she left behind was a methodology for how Chinese architecture should be studied, taught, and understood.</text>
    <text x="136" y="608" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#1F1B16">That is also why her significance goes far beyond “a few works” or “a legendary life.”</text>
  </g>
</svg>
