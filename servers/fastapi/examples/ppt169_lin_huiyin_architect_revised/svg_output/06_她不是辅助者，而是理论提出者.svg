<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F1E8" />
  <rect x="48" y="48" width="1184" height="624" fill="none" stroke="#D8CBB8" stroke-width="1.5" />

  <g id="header">
    <text x="72" y="92" font-family="Arial, Helvetica, sans-serif" font-size="23.80" fill="#1F1B16" font-weight="700">She is not an assistant, but a theorist who formulated the ideas.</text>
    <text x="72" y="121" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">That 1932 paper had already begun defining the theoretical boundaries of “Chinese architecture”</text>
    <line x1="72" y1="136" x2="1208" y2="136" stroke="#D8CBB8" stroke-width="1.5" />
    <text x="1196" y="92" text-anchor="end" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#978C7E">06</text>
  </g>

  <g id="left-image">
    <rect x="72" y="174" width="374" height="444" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
    <image href="../images/first_paper.png" x="72" y="174" width="374" height="444" preserveAspectRatio="xMidYMid slice" />
    <rect x="72" y="582" width="374" height="36" fill="#F6F1E8" />
    <text x="92" y="605" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#6A6258">Related Images from 《On Several Characteristics of Chinese Architecture》</text>
  </g>

  <g id="vertical-list-axis">
    <line x1="526" y1="196" x2="526" y2="598" stroke="#D8CBB8" stroke-width="3" />
  </g>

  <g id="item-1">
    <circle cx="526" cy="224" r="18" fill="#A44A3F" />
    <text x="526" y="230" text-anchor="middle" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">01</text>
    <line x1="544" y1="224" x2="582" y2="224" stroke="#A44A3F" stroke-width="2" />
    <rect x="582" y="196" width="598" height="58" rx="10" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="1.2" />
    <text x="604" y="220" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1F1B16" font-weight="600">The first Chinese professional scholar to systematically discuss Chinese architecture</text>
    <text x="604" y="242" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">This is not an “additional note”; it is the establishment of disciplinary discourse.</text>
  </g>

  <g id="item-2">
    <circle cx="526" cy="314" r="18" fill="#6E7C80" />
    <text x="526" y="320" text-anchor="middle" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">02</text>
    <line x1="544" y1="314" x2="582" y2="314" stroke="#6E7C80" stroke-width="2" />
    <rect x="582" y="286" width="598" height="58" rx="10" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="1.2" />
    <text x="604" y="310" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1F1B16" font-weight="600">Refuting misreadings within Western knowledge frameworks</text>
    <text x="604" y="332" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">She was fighting for interpretive authority over Chinese architecture, not merely organizing materials.</text>
  </g>

  <g id="item-3">
    <circle cx="526" cy="404" r="18" fill="#B6915E" />
    <text x="526" y="410" text-anchor="middle" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">03</text>
    <line x1="544" y1="404" x2="582" y2="404" stroke="#B6915E" stroke-width="2" />
    <rect x="582" y="376" width="598" height="58" rx="10" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="1.2" />
    <text x="604" y="400" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1F1B16" font-weight="600" textLength="216.0" lengthAdjust="spacingAndGlyphs">Key features defining the timber-frame system</text>
    <text x="604" y="422" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">She moved from description to structural generalization—precisely the core of theoretical work.</text>
  </g>

  <g id="item-4">
    <circle cx="526" cy="494" r="18" fill="#A44A3F" />
    <text x="526" y="500" text-anchor="middle" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">04</text>
    <line x1="544" y1="494" x2="582" y2="494" stroke="#A44A3F" stroke-width="2" />
    <rect x="582" y="466" width="598" height="58" rx="10" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="1.2" />
    <text x="604" y="490" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1F1B16" font-weight="600">Providing a theoretical framework for subsequent narratives of Chinese architectural history</text>
    <text x="604" y="512" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">Her work influenced the language of later academic writing, teaching, and preservation practice.</text>
  </g>

  <g id="quote">
    <rect x="582" y="554" width="598" height="64" rx="12" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.2" />
    <use data-icon="tabler-outline/globe" x="606" y="575" width="20" height="20" fill="#A44A3F" />
    <text x="638" y="578" font-family="Arial, Helvetica, sans-serif" font-size="15.40" fill="#A44A3F" font-weight="700">She was not merely “assisting with the research.”</text>
    <text x="638" y="603" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#1F1B16">But rather, in helping shape how Chinese architecture is understood.</text>
  </g>
</svg>
