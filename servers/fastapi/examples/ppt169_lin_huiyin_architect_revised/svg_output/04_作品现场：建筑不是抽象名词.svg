<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F1E8" />
  <rect x="48" y="48" width="1184" height="624" fill="none" stroke="#D8CBB8" stroke-width="1.5" />

  <g id="header">
    <text x="72" y="92" font-family="Arial, Helvetica, sans-serif" font-size="23.80" fill="#1F1B16" font-weight="700">At the Site of the Work: Architecture Is Not an Abstract Noun</text>
    <text x="72" y="121" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">Four sites, corresponding to four distinct problem framings and architectural responses</text>
    <line x1="72" y1="136" x2="1208" y2="136" stroke="#D8CBB8" stroke-width="1.5" />
    <text x="1196" y="92" text-anchor="end" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#978C7E">04</text>
  </g>

  <g id="photo-grid">
    <g id="img-1">
      <rect x="72" y="170" width="252" height="182" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
      <image href="../images/jihai_station_new.png" x="72" y="170" width="252" height="182" preserveAspectRatio="xMidYMid slice" />
      <rect x="72" y="316" width="252" height="36" fill="#F6F1E8" />
      <text x="88" y="339" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#1F1B16" textLength="90.0" lengthAdjust="spacingAndGlyphs">Jihai Railway Terminal</text>
    </g>

    <g id="img-2">
      <rect x="348" y="170" width="252" height="182" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
      <image href="../images/pku_geology.png" x="348" y="170" width="252" height="182" preserveAspectRatio="xMidYMid slice" />
      <rect x="348" y="316" width="252" height="36" fill="#F6F1E8" />
      <text x="364" y="339" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#1F1B16">Former site of the Peking University Geology Hall</text>
    </g>

    <g id="img-3">
      <rect x="72" y="384" width="252" height="182" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
      <image href="../images/yingqiu_yuan.png" x="72" y="384" width="252" height="182" preserveAspectRatio="xMidYMid slice" />
      <rect x="72" y="530" width="252" height="36" fill="#F6F1E8" />
      <text x="88" y="553" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#1F1B16" textLength="45.0" lengthAdjust="spacingAndGlyphs">Yingqiu Courtyard</text>
    </g>

    <g id="img-4">
      <rect x="348" y="384" width="252" height="182" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
      <image href="../images/kunming_site.png" x="348" y="384" width="252" height="182" preserveAspectRatio="xMidYMid slice" />
      <rect x="348" y="530" width="252" height="36" fill="#F6F1E8" />
      <text x="364" y="553" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#1F1B16" textLength="135.0" lengthAdjust="spacingAndGlyphs">Kunming Residence and Wartime Site</text>
    </g>
  </g>

  <g id="annotation-column">
    <rect x="642" y="170" width="554" height="396" rx="14" fill="#FFFFFF" stroke="#D8CBB8" stroke-width="1.5" />

    <g id="note-1">
      <use data-icon="tabler-outline/train" x="670" y="198" width="20" height="20" fill="#A44A3F" />
      <text x="702" y="214" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#1F1B16" font-weight="600" textLength="180.0" lengthAdjust="spacingAndGlyphs">The symbolic expression of public buildings</text>
      <text x="702" y="244" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#6A6258">Jihai Railway Terminal is more than a station building; it inscribes a nation's imagination into architectural form.</text>
    </g>

    <g id="note-2">
      <use data-icon="tabler-outline/school" x="670" y="288" width="20" height="20" fill="#A44A3F" />
      <text x="702" y="304" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="17.51" fill="#1F1B16" font-weight="600">Modernism and user care</text>
      <text x="702" y="334" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#6A6258">The Peking University Geology Hall and women’s dormitory show that she cared about both form and the specifics of use.</text>
    </g>

    <g id="note-3">
      <use data-icon="tabler-outline/building" x="670" y="378" width="20" height="20" fill="#A44A3F" />
      <text x="702" y="394" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#1F1B16" font-weight="600">Local materials and vernacular living experience</text>
      <text x="702" y="424" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#6A6258">Yingqiu Courtyard responds to real-world conditions through local materials and courtyard organization; it is not “rudimentary,” but strategic.</text>
    </g>

    <g id="note-4">
      <use data-icon="tabler-outline/heart" x="670" y="468" width="20" height="20" fill="#A44A3F" />
      <text x="702" y="484" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#1F1B16" font-weight="600">Self-building in wartime: an epitome of a career choice</text>
      <text x="702" y="514" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#6A6258">The Kunming Residence appears simple on the surface, but behind it lies two architects’ commitment to building and maintaining an order of life under extreme conditions.</text>
    </g>
  </g>

  <g id="footer">
    <text x="72" y="652" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#978C7E">The purpose of placing the four images side by side is to turn “architect” from an abstract label back into a visible work site</text>
  </g>
</svg>
