<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A44A3F" />
      <stop offset="100%" stop-color="#B6915E" />
    </linearGradient>
    <linearGradient id="photoFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6F1E8" stop-opacity="1" />
      <stop offset="100%" stop-color="#F6F1E8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#F6F1E8" />
  <rect x="48" y="48" width="1184" height="624" fill="none" stroke="#D8CBB8" stroke-width="1.5" />
  <rect x="892" y="48" width="340" height="624" fill="#EFE7DA" />

  <g id="photo-panel">
    <image href="../images/lin_portrait.png" x="910" y="76" width="292" height="572" preserveAspectRatio="xMidYMid slice" />
    <rect x="892" y="48" width="110" height="624" fill="url(#photoFade)" />
    <rect x="892" y="48" width="340" height="624" fill="none" stroke="#D8CBB8" stroke-width="1" />
  </g>

  <g id="left-structure">
    <rect x="86" y="88" width="6" height="118" fill="#A44A3F" />
    <line x1="108" y1="149" x2="276" y2="149" stroke="#B6915E" stroke-width="2" />
    <text x="86" y="245" font-family="Arial, Helvetica, sans-serif" font-size="44.80" fill="#1F1B16" font-weight="700" textLength="192.0" lengthAdjust="spacingAndGlyphs">Lin Huiyin</text>
    <text x="86" y="304" font-family="Arial, Helvetica, sans-serif" font-size="21.00" fill="#A44A3F" font-weight="700" textLength="286.5" lengthAdjust="spacingAndGlyphs">Reconsidering the architect, not the legend</text>
    <text x="86" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#6A6258">Special presentation marking the 70th anniversary of her death</text>
    <text x="86" y="392" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#6A6258">From the three dimensions of work, theory, and action</text>
    <text x="86" y="424" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#6A6258">Reaffirm her place in the history of Chinese architecture</text>
  </g>

  <g id="identity-tags">
    <rect x="86" y="492" width="146" height="38" rx="19" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
    <text x="113" y="517" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#1F1B16">Architect</text>
    <use data-icon="tabler-outline/building" x="92" y="500" width="18" height="18" fill="#A44A3F" />

    <rect x="244" y="492" width="166" height="38" rx="19" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
    <text x="271" y="517" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#1F1B16" textLength="80.0" lengthAdjust="spacingAndGlyphs">Theoretical Founder</text>
    <use data-icon="tabler-outline/article" x="250" y="500" width="18" height="18" fill="#A44A3F" />

    <rect x="422" y="492" width="148" height="38" rx="19" fill="#EFE7DA" stroke="#D8CBB8" stroke-width="1.5" />
    <text x="449" y="517" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="16" fill="#1F1B16">Actor</text>
    <use data-icon="tabler-outline/compass" x="428" y="500" width="18" height="18" fill="#A44A3F" />
  </g>

  <g id="footer-bar">
    <rect x="48" y="634" width="1184" height="38" fill="#EFE7DA" />
    <text x="86" y="659" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#6A6258">Lin Huiyin: Rediscovering the Architect, Not the Legend</text>
    <text x="1096" y="659" font-family="&quot;Georgia SC&quot;, &quot;Georgia&quot;, Arial, sans-serif" font-size="14" fill="#978C7E">01</text>
  </g>
</svg>
