<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="dotP14" x="0" y="0" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="0.7" fill="#1A1A1A" fill-opacity="0.1" />
    </pattern>
  </defs>

  <rect id="bg" width="1280" height="720" fill="#F5EFE0" />
  <rect id="grain" width="1280" height="720" fill="url(#dotP14)" />

  <g id="header">
    <rect x="60" y="56" width="14" height="68" fill="#1E4DBC" />
    <rect x="63" y="59" width="14" height="68" fill="#FF5C8A" opacity="0.7" />
    <rect x="60" y="56" width="14" height="68" fill="#1E4DBC" />
    <text x="92" y="98" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="33.60" fill="#1A1A1A" letter-spacing="-1" textLength="298.1" lengthAdjust="spacingAndGlyphs">4 things before entering the store</text>
    <text x="92" y="128" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#5A5A5A" letter-spacing="3">HOW TO BROWSE INDIE BOOKSTORES · UNWRITTEN ETIQUETTE</text>
  </g>

  <line x1="60" y1="152" x2="1220" y2="152" stroke="#1A1A1A" stroke-width="3" />

  
  <rect x="120" y="200" width="6" height="430" fill="#1E4DBC" />
  <rect x="123" y="203" width="6" height="430" fill="#FF5C8A" opacity="0.6" />
  <rect x="120" y="200" width="6" height="430" fill="#1E4DBC" />
  <polygon points="123,640 110,624 136,624" fill="#1E4DBC" />

  
  <g id="item-01">
    <rect x="80" y="200" width="86" height="86" fill="#1E4DBC" />
    <rect x="83" y="203" width="86" height="86" fill="#FF5C8A" opacity="0.6" />
    <rect x="80" y="200" width="86" height="86" fill="#1E4DBC" />
    <text x="123" y="262" font-family="Impact, 'Arial Black', 'Georgia', sans-serif" font-size="46" fill="#F5EFE0" text-anchor="middle">01</text>
    <line x1="166" y1="243" x2="200" y2="243" stroke="#1E4DBC" stroke-width="2.5" stroke-dasharray="4,3" />
    <rect x="200" y="200" width="1020" height="86" fill="#F5EFE0" />
    <rect x="200" y="200" width="1020" height="86" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <rect x="200" y="200" width="8" height="86" fill="#1E4DBC" />
    <use data-icon="chunk-filled/star" x="224" y="218" width="48" height="48" fill="#1E4DBC" />
    <text x="288" y="240" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#1A1A1A">Look at the product selection = look at the shop owner</text>
    <text x="288" y="266" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#5A5A5A">The essence of an independent bookstore is “the spiritual bookshelf of one person / a group of people” · The selection is the owner talking to you</text>
  </g>

  
  <g id="item-02">
    <rect x="80" y="312" width="86" height="86" fill="#FF5C8A" />
    <rect x="83" y="315" width="86" height="86" fill="#1E4DBC" opacity="0.6" />
    <rect x="80" y="312" width="86" height="86" fill="#FF5C8A" />
    <text x="123" y="374" font-family="Impact, 'Arial Black', 'Georgia', sans-serif" font-size="46" fill="#F5EFE0" text-anchor="middle">02</text>
    <line x1="166" y1="355" x2="200" y2="355" stroke="#FF5C8A" stroke-width="2.5" stroke-dasharray="4,3" />
    <rect x="200" y="312" width="1020" height="86" fill="#F5EFE0" />
    <rect x="200" y="312" width="1020" height="86" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <rect x="200" y="312" width="8" height="86" fill="#FF5C8A" />
    <use data-icon="chunk-filled/clock" x="224" y="330" width="48" height="48" fill="#FF5C8A" />
    <text x="288" y="352" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#1A1A1A" textLength="136.6" lengthAdjust="spacingAndGlyphs">Allow at least 1 hour</text>
    <text x="288" y="378" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#5A5A5A">An independent bookstore is not a convenience store · Browsing is the product itself · Staring into the bookshelves is a legitimate form of consumption</text>
  </g>

  
  <g id="item-03">
    <rect x="80" y="424" width="86" height="86" fill="#E8A02E" />
    <rect x="83" y="427" width="86" height="86" fill="#1E4DBC" opacity="0.6" />
    <rect x="80" y="424" width="86" height="86" fill="#E8A02E" />
    <text x="123" y="486" font-family="Impact, 'Arial Black', 'Georgia', sans-serif" font-size="46" fill="#F5EFE0" text-anchor="middle">03</text>
    <line x1="166" y1="467" x2="200" y2="467" stroke="#E8A02E" stroke-width="2.5" stroke-dasharray="4,3" />
    <rect x="200" y="424" width="1020" height="86" fill="#F5EFE0" />
    <rect x="200" y="424" width="1020" height="86" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <rect x="200" y="424" width="8" height="86" fill="#E8A02E" />
    <use data-icon="chunk-filled/shopping-bag" x="224" y="442" width="48" height="48" fill="#E8A02E" />
    <text x="288" y="464" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#1A1A1A" textLength="66.0" lengthAdjust="spacingAndGlyphs">Carry cash</text>
    <text x="288" y="490" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#5A5A5A">Some small shops don't accept electronic payments · Cash can still reduce transaction fees · Leave the shopkeeper enough profit for one more cup of coffee</text>
  </g>

  
  <g id="item-04">
    <rect x="80" y="536" width="86" height="86" fill="#1A1A1A" />
    <rect x="83" y="539" width="86" height="86" fill="#FF5C8A" opacity="0.6" />
    <rect x="80" y="536" width="86" height="86" fill="#1A1A1A" />
    <text x="123" y="598" font-family="Impact, 'Arial Black', 'Georgia', sans-serif" font-size="46" fill="#FF5C8A" text-anchor="middle">04</text>
    <line x1="166" y1="579" x2="200" y2="579" stroke="#1A1A1A" stroke-width="2.5" stroke-dasharray="4,3" />
    <rect x="200" y="536" width="1020" height="86" fill="#F5EFE0" />
    <rect x="200" y="536" width="1020" height="86" fill="none" stroke="#1A1A1A" stroke-width="2" />
    <rect x="200" y="536" width="8" height="86" fill="#1A1A1A" />
    <use data-icon="chunk-filled/hand" x="224" y="554" width="48" height="48" fill="#1A1A1A" />
    <text x="288" y="576" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#1A1A1A" textLength="110.0" lengthAdjust="spacingAndGlyphs">Ask before taking photos</text>
    <text x="288" y="602" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#5A5A5A">Most independent bookstores are sensitive about photography · Curation reflects the owner’s knowledge · Respect + a greeting = a pass</text>
  </g>

  
  <g id="callout">
    <rect x="60" y="654" width="1160" height="34" fill="#1E4DBC" />
    <rect x="63" y="657" width="1160" height="34" fill="#FF5C8A" opacity="0.6" />
    <rect x="60" y="654" width="1160" height="34" fill="#1E4DBC" />
    <text x="80" y="677" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#F5EFE0">Additional reminder ＞ Books from major publishers can be bought anywhere · Buy independent publications / artist-funded books at independent bookstores · That is the core goal</text>
  </g>

  <g id="footer">
    <text x="60" y="710" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#5A5A5A" letter-spacing="2">P14 · 4 RULES BEFORE YOU ENTER</text>
    <text x="1220" y="710" font-family="Consolas, 'Courier New', monospace" font-size="7.70" fill="#5A5A5A" text-anchor="end" letter-spacing="2">Shopkeeper / Time / Cash / Greetings</text>
  </g>
</svg>
