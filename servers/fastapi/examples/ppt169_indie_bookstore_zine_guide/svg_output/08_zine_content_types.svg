    <text x="866" y="664" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1E4DBC" textLength="128.9" lengthAdjust="spacingAndGlyphs">No information = a kind of information</text>
