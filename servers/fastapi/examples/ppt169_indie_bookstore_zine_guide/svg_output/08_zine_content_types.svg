    <text x="476" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.82" fill="#1A1A1A">A 100-word manifesto, a slogan, a poem</text>
    <text x="476" y="382" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.58" fill="#1A1A1A">The Riot Grrrl Manifesto Is the Paradigm</text>
    <text x="476" y="404" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1E4DBC" textLength="100.9" lengthAdjust="spacingAndGlyphs">Short and precise ＞ long and hollow</text>
  </g>

  
