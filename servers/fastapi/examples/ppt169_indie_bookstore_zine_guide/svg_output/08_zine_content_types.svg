    <text x="92" y="98" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="33.60" fill="#1A1A1A" letter-spacing="-1" textLength="532.3" lengthAdjust="spacingAndGlyphs">More than 6 types of content you can fill in</text>
    <text x="92" y="128" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#5A5A5A" letter-spacing="3">SIX CONTENT TYPES · THERE ARE NO MISTAKES · JUST WHIMS</text>
  </g>

