    <rect x="60" y="180" width="380" height="240" fill="#1E4DBC" />
    <text x="408" y="226" font-family="Impact, 'Arial Black', 'Georgia', sans-serif" font-size="44" fill="#FF5C8A" text-anchor="end">01</text>
    <use data-icon="chunk-filled/pencil" x="86" y="200" width="56" height="56" fill="#F5EFE0" />
    <text x="86" y="294" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#F5EFE0">Sketches / Comics</text>
    <text x="86" y="320" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#FF5C8A" letter-spacing="2">SKETCHES &amp; MINI-COMICS</text>
    <line x1="86" y1="332" x2="200" y2="332" stroke="#F5EFE0" stroke-width="2" />
    <text x="86" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#F5EFE0" textLength="153.7" lengthAdjust="spacingAndGlyphs">Graffiti, four-panel comics, hand-drawn diaries</text>
    <text x="86" y="382" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#F5EFE0">The lettering can be ugly; the composition can be weak</text>
    <text x="86" y="404" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#FF5C8A" textLength="100.9" lengthAdjust="spacingAndGlyphs">Not looking like the subject = style</text>
  </g>

  
