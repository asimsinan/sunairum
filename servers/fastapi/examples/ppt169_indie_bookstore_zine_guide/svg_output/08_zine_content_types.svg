    <text x="86" y="664" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#FF5C8A" textLength="72.9" lengthAdjust="spacingAndGlyphs">Sovereignty ＞ Privacy</text>
  </g>

  
