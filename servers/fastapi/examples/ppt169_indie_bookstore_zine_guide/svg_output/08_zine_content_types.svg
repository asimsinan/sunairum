    <text x="866" y="382" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#1A1A1A" textLength="127.4" lengthAdjust="spacingAndGlyphs">"How to Repair a Bicycle" tutorial</text>
    <text x="866" y="404" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1E4DBC" textLength="147.7" lengthAdjust="spacingAndGlyphs">Everyday practicality = the most prevalent form</text>
  </g>

  
