<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="2" />
      <feComponentTransfer><feFuncA type="linear" slope="0.25" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8B6F47" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  
  <rect width="1280" height="720" fill="#1A1A2E" />
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  
  <text x="60" y="42" font-family="'Georgia', Arial, sans-serif" font-size="12" fill="#C9A96E" letter-spacing="3">
    <tspan>PART 03 · Strength and spirit</tspan>
  </text>

  
  <rect x="60" y="55" width="4" height="32" fill="#C9A96E" />
  <text x="80" y="82" font-family="'Georgia', Georgia, serif" font-size="32" font-weight="bold" fill="#E8E8E8">
    <tspan>A Truly Deserving Architect</tspan>
  </text>

  
  <rect x="60" y="115" width="1160" height="130" rx="12" fill="url(#quoteGrad)" stroke="#C9A96E" stroke-width="1" filter="url(#cardShadow)" />
  <rect x="60" y="115" width="4" height="130" rx="2" fill="#E8D5B7" />
  
  <text x="90" y="160" font-family="Georgia, serif" font-size="48" fill="#C9A96E" fill-opacity="0.3">
    <tspan>"</tspan>
  </text>
  <text x="120" y="165" font-family="'Georgia', Georgia, serif" font-size="18" fill="#E8E8E8">
    <tspan>I, too, have reached a fairly advanced age, yet have achieved little; I can see opportunities growing scarcer...</tspan>
  </text>
  <text x="120" y="192" font-family="'Georgia', Georgia, serif" font-size="18" fill="#E8E8E8">
    <tspan>Now my health is poor and the burdens of domestic life are heavy. I suppose I’ll spend the rest of my life living an ordinary life, becoming a wife and raising children!</tspan>
  </text>
  <text x="120" y="219" font-family="'Georgia', Georgia, serif" font-size="18" fill="#C9A96E">
    <tspan>I couldn’t help but feel sad.</tspan>
  </text>
  <rect x="120" y="228" width="40" height="1" fill="#C9A96E" fill-opacity="0.3" />
  <text x="170" y="228" font-family="'Georgia', Arial, sans-serif" font-size="13" fill="#8B6F47">
    <tspan>—— A Letter to Hu Shi Written at Age 28</tspan>
  </text>

  
  
  <rect x="60" y="270" width="560" height="130" rx="10" fill="#16213E" stroke="#2A2A4A" stroke-width="1" />
  <rect x="60" y="270" width="4" height="130" rx="2" fill="#C9A96E" />
  <use data-icon="chunk/building" x="84" y="290" width="32" height="32" fill="#C9A96E" />
  <text x="130" y="306" font-family="'Georgia', Georgia, serif" font-size="22" font-weight="bold" fill="#E8D5B7">
    <tspan>Co-created architectural education</tspan>
  </text>
  <text x="84" y="340" font-family="'Georgia', Arial, sans-serif" font-size="16" fill="#E8E8E8">
    <tspan>Co-founded the architecture departments at Northeastern University and Tsinghua University with Liang Sicheng</tspan>
  </text>
  <text x="84" y="365" font-family="'Georgia', Arial, sans-serif" font-size="14" fill="#A0A0B0">
    <tspan>Laying the foundation for modern architectural education in China</tspan>
  </text>

  
  <rect x="640" y="270" width="580" height="130" rx="10" fill="#16213E" stroke="#2A2A4A" stroke-width="1" />
  <rect x="640" y="270" width="4" height="130" rx="2" fill="#C9A96E" />
  <use data-icon="chunk/map" x="664" y="290" width="32" height="32" fill="#C9A96E" />
  <text x="710" y="306" font-family="'Georgia', Georgia, serif" font-size="22" font-weight="bold" fill="#E8D5B7">
    <tspan>Measuring ancient architecture inch by inch</tspan>
  </text>
  <text x="664" y="340" font-family="'Georgia', Arial, sans-serif" font-size="16" fill="#E8E8E8">
    <tspan>Venturing deep into desolate places, measuring ancient Chinese architecture with his own hands</tspan>
  </text>
  <text x="664" y="365" font-family="'Georgia', Arial, sans-serif" font-size="14" fill="#A0A0B0">
    <tspan>Leaving behind valuable firsthand materials for the history of Chinese architecture</tspan>
  </text>

  
  <rect x="60" y="420" width="560" height="130" rx="10" fill="#16213E" stroke="#2A2A4A" stroke-width="1" />
  <rect x="60" y="420" width="4" height="130" rx="2" fill="#8B6F47" />
  <use data-icon="chunk/pen-nib" x="84" y="440" width="32" height="32" fill="#8B6F47" />
  <text x="130" y="456" font-family="'Georgia', Georgia, serif" font-size="22" font-weight="bold" fill="#E8D5B7">
    <tspan>Writing architectural history in wartime</tspan>
  </text>
  <text x="84" y="490" font-family="'Georgia', Arial, sans-serif" font-size="16" fill="#E8E8E8">
    <tspan>Writing Chinese architectural history stroke by stroke in a remote town despite her failing health</tspan>
  </text>
  <text x="84" y="515" font-family="'Georgia', Arial, sans-serif" font-size="14" fill="#A0A0B0">
    <tspan>Founder of the Discipline, Intellectual Pioneer</tspan>
  </text>

  
  <rect x="640" y="420" width="580" height="130" rx="10" fill="#16213E" stroke="#C9A96E" stroke-width="1.5" />
  <rect x="640" y="420" width="4" height="130" rx="2" fill="#E8D5B7" />
  <use data-icon="chunk/crown" x="664" y="440" width="32" height="32" fill="#E8D5B7" />
  <text x="710" y="456" font-family="'Georgia', Georgia, serif" font-size="22" font-weight="bold" fill="#E8D5B7">
    <tspan>Her Final Labor on a Major National Project</tspan>
  </text>
  <text x="664" y="490" font-family="'Georgia', Arial, sans-serif" font-size="16" fill="#E8E8E8">
    <tspan>Devoted the last of her strength to the national emblem and the Monument to the People’s Heroes</tspan>
  </text>
  <text x="664" y="515" font-family="'Georgia', Arial, sans-serif" font-size="14" fill="#C9A96E">
    <tspan>She proved through a lifetime that she was unquestionably an architect</tspan>
  </text>

  
  <rect x="300" y="580" width="680" height="60" rx="8" fill="#16213E" stroke="#8B6F47" stroke-width="1" />
  <text x="640" y="605" font-family="'Georgia', Georgia, serif" font-size="18" fill="#C9A96E" text-anchor="middle">
    <tspan>What Lin Huiyin truly wanted to devote her life to</tspan>
  </text>
  <text x="640" y="630" font-family="'Georgia', Georgia, serif" font-size="18" fill="#E8D5B7" text-anchor="middle">
    <tspan>It is China’s architectural academic endeavor</tspan>
  </text>

  
  <text x="1200" y="700" font-family="'Georgia', Arial, sans-serif" font-size="12" fill="#6B6B80" text-anchor="end">
    <tspan>09 / 10</tspan>
  </text>
</svg>
