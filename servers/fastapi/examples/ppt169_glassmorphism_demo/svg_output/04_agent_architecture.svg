<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF" />
      <stop offset="50%" stop-color="#A26BFA" />
      <stop offset="100%" stop-color="#3DDDFC" />
    </linearGradient>
    <linearGradient id="bgOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0A0E27" stop-opacity="0.78" />
    </linearGradient>
    <linearGradient id="moduleGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2150" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#1A2150" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="badgePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A26BFA" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#A26BFA" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="badgeCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDDFC" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3DDDFC" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#0A0E27" />
    <image href="../images/04_agent_topology.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgOverlay)" />
  </g>

  <g id="header">
    <rect x="60" y="50" width="6" height="32" rx="3" fill="url(#titleGradient)" />
    <text x="80" y="76" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="23.80" font-weight="900" fill="#E8ECFF" textLength="274.7" lengthAdjust="spacingAndGlyphs">The Four-Layer Agent Framework</text>
    <text x="80" y="108" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="14" font-weight="600" fill="#A8B0D0" letter-spacing="3">PERCEPTION · REASONING · ACTION · MEMORY</text>
  </g>

  <g id="layer-perception">
    <rect x="60" y="140" width="170" height="120" rx="14" fill="url(#badgeBlue)" stroke="#5B8DEF" stroke-opacity="0.55" stroke-width="1" />
    <use data-icon="phosphor-duotone/eye" x="80" y="158" width="40" height="40" fill="#3DDDFC" />
    <text x="80" y="220" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#3DDDFC" letter-spacing="2">L1 · PERCEPTION</text>
    <text x="80" y="246" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#E8ECFF" textLength="66.0" lengthAdjust="spacingAndGlyphs">Perception layer</text>
    <g id="mod-p1">
      <rect x="246" y="140" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="264" y="141" width="284" height="1" fill="url(#glassEdge)" />
      <text x="266" y="178" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="72.0" lengthAdjust="spacingAndGlyphs">Input parsing</text>
      <text x="266" y="206" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="147.7" lengthAdjust="spacingAndGlyphs">User Intent Classification, Slot Extraction</text>
      <text x="266" y="228" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">Language identification and sensitive-word filtering</text>
    </g>
    <g id="mod-p2">
      <rect x="578" y="140" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="596" y="141" width="284" height="1" fill="url(#glassEdge)" />
      <text x="598" y="178" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="90.0" lengthAdjust="spacingAndGlyphs">Multimodal fusion</text>
      <text x="598" y="206" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.26" font-weight="400" fill="#A8B0D0">Text · Images · Tables · Audio</text>
      <text x="598" y="228" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="168.0" lengthAdjust="spacingAndGlyphs">Unify into Structured Inputs for Inference</text>
    </g>
    <g id="mod-p3">
      <rect x="910" y="140" width="310" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="928" y="141" width="274" height="1" fill="url(#glassEdge)" />
      <text x="930" y="178" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="126.0" lengthAdjust="spacingAndGlyphs">Context window management</text>
      <text x="930" y="206" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">Dynamic truncation, with key information front-loaded</text>
      <text x="930" y="228" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="125.4" lengthAdjust="spacingAndGlyphs">Addressing long-prompt degradation</text>
    </g>
  </g>

  <g id="layer-reasoning">
    <rect x="60" y="272" width="170" height="120" rx="14" fill="url(#badgePurple)" stroke="#A26BFA" stroke-opacity="0.55" stroke-width="1" />
    <use data-icon="phosphor-duotone/brain" x="80" y="290" width="40" height="40" fill="#A26BFA" />
    <text x="80" y="352" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#A26BFA" letter-spacing="2">L2 · REASONING</text>
    <text x="80" y="378" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#E8ECFF" textLength="66.0" lengthAdjust="spacingAndGlyphs">Inference layer</text>
    <g id="mod-r1">
      <rect x="246" y="272" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="264" y="273" width="284" height="1" fill="url(#glassEdge)" />
      <text x="266" y="310" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="18" font-weight="800" fill="#E8ECFF">Plan / ReAct</text>
      <text x="266" y="338" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="136.6" lengthAdjust="spacingAndGlyphs">Decompose First, Then Reason → Act</text>
      <text x="266" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="140.0" lengthAdjust="spacingAndGlyphs">Decide the next step based on the observations</text>
    </g>
    <g id="mod-r2">
      <rect x="578" y="272" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="596" y="273" width="284" height="1" fill="url(#glassEdge)" />
      <text x="598" y="310" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="18" font-weight="800" fill="#E8ECFF">Tree-of-Thought</text>
      <text x="598" y="338" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">Expansion along multiple paths · Evaluation-based pruning</text>
      <text x="598" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">Suitable for search · planning · reasoning tasks</text>
    </g>
    <g id="mod-r3">
      <rect x="910" y="272" width="310" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="928" y="273" width="274" height="1" fill="url(#glassEdge)" />
      <text x="930" y="310" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="18" font-weight="800" fill="#E8ECFF">Reflection</text>
      <text x="930" y="338" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="145.9" lengthAdjust="spacingAndGlyphs">Self-check · Self-correction · Self-rating</text>
      <text x="930" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">Use with a termination condition to prevent infinite loops</text>
    </g>
  </g>

  <g id="layer-action">
    <rect x="60" y="404" width="170" height="120" rx="14" fill="url(#badgeCyan)" stroke="#3DDDFC" stroke-opacity="0.55" stroke-width="1" />
    <use data-icon="phosphor-duotone/lightning" x="80" y="422" width="40" height="40" fill="#3DDDFC" />
    <text x="80" y="484" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#3DDDFC" letter-spacing="2">L3 · ACTION</text>
    <text x="80" y="510" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#E8ECFF" textLength="66.0" lengthAdjust="spacingAndGlyphs">Action Layer</text>
    <g id="mod-a1">
      <rect x="246" y="404" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="264" y="405" width="284" height="1" fill="url(#glassEdge)" />
      <text x="266" y="442" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.98" font-weight="800" fill="#E8ECFF">Tool Call</text>
      <text x="266" y="470" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">JSON schema parameter generation</text>
      <text x="266" y="492" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="145.9" lengthAdjust="spacingAndGlyphs">Timeouts · Retries · Authentication governance</text>
    </g>
    <g id="mod-a2">
      <rect x="578" y="404" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="596" y="405" width="284" height="1" fill="url(#glassEdge)" />
      <text x="598" y="442" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="72.0" lengthAdjust="spacingAndGlyphs">Function execution</text>
      <text x="598" y="470" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.12" font-weight="400" fill="#A8B0D0">Sandbox / subprocess / WASM</text>
      <text x="598" y="492" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">Code generation must use an isolated environment</text>
    </g>
    <g id="mod-a3">
      <rect x="910" y="404" width="310" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="928" y="405" width="274" height="1" fill="url(#glassEdge)" />
      <text x="930" y="442" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="71.6" lengthAdjust="spacingAndGlyphs">API Orchestration</text>
      <text x="930" y="470" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="145.9" lengthAdjust="spacingAndGlyphs">Idempotency · Ordering · Transaction boundaries</text>
      <text x="930" y="492" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="130.3" lengthAdjust="spacingAndGlyphs">Idempotency key to prevent duplicate execution</text>
    </g>
  </g>

  <g id="layer-memory">
    <rect x="60" y="536" width="170" height="120" rx="14" fill="url(#badgeGreen)" stroke="#4ADE80" stroke-opacity="0.5" stroke-width="1" />
    <use data-icon="phosphor-duotone/database" x="80" y="554" width="40" height="40" fill="#4ADE80" />
    <text x="80" y="616" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4ADE80" letter-spacing="2">L4 · MEMORY</text>
    <text x="80" y="642" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="900" fill="#E8ECFF" textLength="66.0" lengthAdjust="spacingAndGlyphs">Memory layer</text>
    <g id="mod-m1">
      <rect x="246" y="536" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="264" y="537" width="284" height="1" fill="url(#glassEdge)" />
      <text x="266" y="574" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="90.0" lengthAdjust="spacingAndGlyphs">Short-term context</text>
      <text x="266" y="602" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="156.9" lengthAdjust="spacingAndGlyphs">Current Conversation / Current Task Window</text>
      <text x="266" y="624" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="98.0" lengthAdjust="spacingAndGlyphs">Scrollable summary prevents overflow</text>
    </g>
    <g id="mod-m2">
      <rect x="578" y="536" width="320" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="596" y="537" width="284" height="1" fill="url(#glassEdge)" />
      <text x="598" y="574" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="90.0" lengthAdjust="spacingAndGlyphs">Long-term vector database</text>
      <text x="598" y="602" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="169.0" lengthAdjust="spacingAndGlyphs">User Preferences / Historical Knowledge / FAQ</text>
      <text x="598" y="624" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="128.9" lengthAdjust="spacingAndGlyphs">Dual indexing with semantics + metadata</text>
    </g>
    <g id="mod-m3">
      <rect x="910" y="536" width="310" height="120" rx="14" fill="url(#moduleGlass)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" />
      <rect x="928" y="537" width="274" height="1" fill="url(#glassEdge)" />
      <text x="930" y="574" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="800" fill="#E8ECFF" textLength="90.0" lengthAdjust="spacingAndGlyphs">Task-level caching</text>
      <text x="930" y="602" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0" textLength="156.9" lengthAdjust="spacingAndGlyphs">Intermediate retrieval / tool-calling results</text>
      <text x="930" y="624" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="400" fill="#A8B0D0">Avoid duplicate calculations · A powerful cost-cutting tool</text>
    </g>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" font-weight="600" fill="#6B7299" textLength="92.0" lengthAdjust="spacingAndGlyphs">Four-Layer Agent Framework</text>
    <text x="1220" y="694" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, sans-serif" font-size="13" font-weight="600" fill="#6B7299" text-anchor="end">04 / 12</text>
  </g>
</svg>
