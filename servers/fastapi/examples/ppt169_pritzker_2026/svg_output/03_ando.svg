<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="leftScrim03" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.78" />
      <stop offset="48%" stop-color="#0A0A0A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </linearGradient>
    <clipPath id="ando-thumb-clip">
      <rect x="940" y="430" width="280" height="240" rx="4" />
    </clipPath>
  </defs>

  <g id="bg-image">
    <image href="../images/ando_h_exterior.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#leftScrim03)" />
  </g>

  <g id="p03-header">
    <text x="60" y="80" font-family="Georgia, serif" font-size="14" fill="#E8C788" letter-spacing="3">01 · MASTERWORK</text>
    <text x="60" y="180" font-family="Georgia, serif" font-size="88" fill="#B8935A" font-style="italic" fill-opacity="0.85">01</text>
  </g>

  <g id="p03-title">
    <text x="60" y="240" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="29.87" font-weight="bold" fill="#F5F2EC">Tadao Ando · Suzhou H+ Art Museum</text>
    <text x="60" y="282" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="18.20" fill="#E8C788" font-style="italic" textLength="338.0" lengthAdjust="spacingAndGlyphs">Writing a concrete poem in a Jiangnan garden</text>
    <line x1="60" y1="306" x2="180" y2="306" stroke="#B8935A" stroke-width="2" />
    <text x="60" y="334" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#D4CFC4">1995 Pritzker Prize Laureate · Opening January 2026 · Along the Shangtang River in Gusu District, Suzhou</text>
  </g>

  <g id="card-concept">
    <rect x="60" y="370" width="395" height="270" fill="#F5F2EC" fill-opacity="0.95" />
    <line x1="60" y1="370" x2="60" y2="640" stroke="#B8935A" stroke-width="3" />
    <text x="80" y="406" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="bold" fill="#1C1C1C" textLength="164.2" lengthAdjust="spacingAndGlyphs">Three-Dimensional Garden · Promenade</text>
    <text x="80" y="430" font-family="&quot;Georgia&quot;, sans-serif" font-size="13" fill="#B8935A" letter-spacing="2">CORE CONCEPT</text>
    <text x="80" y="468" font-family="&quot;Georgia&quot;, sans-serif" font-size="15" fill="#1C1C1C">
      <tspan x="80" dy="0">Drawing on the memory of Suzhou’s land to distill the essence of its gardens</tspan>
      <tspan x="80" dy="26">· Create depth within a limited space</tspan>
      <tspan x="80" dy="26">· Designed sightlines and pedestrian experience</tspan>
      <tspan x="80" dy="26">· Conveying the passage of time through water and light</tspan>
      <tspan x="80" dy="40" font-style="italic" fill="#5C5852">Not mere formalism · but a way of constructing design.</tspan>
    </text>
  </g>

  <g id="card-philosophy">
    <rect x="480" y="370" width="395" height="270" fill="#1C1C1C" fill-opacity="0.82" />
    <text x="500" y="406" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="bold" fill="#E8C788" textLength="184.2" lengthAdjust="spacingAndGlyphs">Spatial Narrative · Three Dialogues</text>
    <text x="500" y="430" font-family="&quot;Georgia&quot;, sans-serif" font-size="13" fill="#B8935A" letter-spacing="2">SPATIAL NARRATIVE</text>
    <text x="500" y="468" font-family="&quot;Georgia&quot;, sans-serif" font-size="15" fill="#F5F2EC">
      <tspan x="500" dy="0">The austerity of concrete ↔ the gentleness of light</tspan>
      <tspan x="500" dy="32">Geometric order ↔ garden freedom</tspan>
      <tspan x="500" dy="32">Eastern Aesthetics ↔ Western Modernism</tspan>
    </text>
    <line x1="500" y1="586" x2="540" y2="586" stroke="#B8935A" stroke-width="2" />
    <text x="500" y="618" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#E8C788" font-style="italic">Let architecture return to nature · Let art heal the human spirit</text>
  </g>

  <g id="thumb-interior">
    <rect x="936" y="426" width="288" height="248" fill="#F5F2EC" fill-opacity="0.95" />
    <image href="../images/ando_h_interior.png" x="940" y="430" width="280" height="240" preserveAspectRatio="xMidYMid slice" clip-path="url(#ando-thumb-clip)" />
    <text x="940" y="395" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#D4CFC4" textLength="91.0" lengthAdjust="spacingAndGlyphs">Interior space of an art museum</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D4CFC4">Image source · H+ Museum</text>
    <text x="1220" y="690" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#D4CFC4">03 / 11</text>
  </g>
</svg>
