<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="kereScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#0A0A0A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.62" />
    </linearGradient>
  </defs>

  <g id="bg-image">
    <image href="../images/kere_senegal_exterior.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#kereScrim)" />
  </g>

  <g id="p10-header">
    <text x="60" y="78" font-family="Georgia, serif" font-size="14" fill="#E8C788" letter-spacing="3">08 · ROOTED IN EARTH</text>
    <text x="60" y="148" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="29.40" font-weight="bold" fill="#F5F2EC">Rammed-earth brick screen · warm architecture rooted in local soil</text>
    <line x1="60" y1="176" x2="180" y2="176" stroke="#B8935A" stroke-width="3" />
    <text x="60" y="210" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.05" fill="#F5F2EC">Diébédo Kéré · Goethe-Institut Senegal</text>
    <text x="60" y="234" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.42" fill="#D4CFC4">2022 Pritzker Prize · Opening in Dakar in April 2026</text>
  </g>

  <g id="card-philosophy">
    <rect x="60" y="290" width="380" height="370" fill="#F5F2EC" fill-opacity="0.94" />
    <line x1="60" y1="290" x2="60" y2="660" stroke="#B8935A" stroke-width="3" />
    <text x="80" y="324" font-family="Georgia, serif" font-size="13" fill="#B8935A" letter-spacing="2">DESIGN PHILOSOPHY</text>
    <text x="80" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="bold" fill="#1C1C1C" textLength="246.6" lengthAdjust="spacingAndGlyphs">In harmony with nature · Rather than against it</text>
    <line x1="80" y1="378" x2="120" y2="378" stroke="#B8935A" stroke-width="2" />
    <text x="80" y="416" font-family="&quot;Georgia&quot;, sans-serif" font-size="14" fill="#1C1C1C">
      <tspan x="80" dy="0">· Locally compressed earth blocks form the main structure</tspan>
      <tspan x="80" dy="28">· Natural ventilation system · Reducing reliance on air conditioning</tspan>
      <tspan x="80" dy="28">· Adapted to the local climate · Energy efficiency + daylighting</tspan>
      <tspan x="80" dy="28">· Open, inclusive space · Serving the community</tspan>
    </text>
    <text x="80" y="568" font-family="Georgia, Georgia, serif" font-size="15" fill="#5C5852" font-style="italic">
      <tspan x="80" dy="0">Born in Africa · Always committed to using local materials</tspan>
      <tspan x="80" dy="24">With sustainable construction to serve communities</tspan>
    </text>
    <line x1="80" y1="618" x2="120" y2="618" stroke="#B8935A" stroke-width="1" />
    <text x="80" y="644" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13" font-weight="bold" fill="#B8935A">Diébédo Francis Kéré</text>
  </g>

  <g id="card-courtyard">
    <rect x="470" y="290" width="240" height="370" fill="#F5F2EC" fill-opacity="0.94" />
    <image href="../images/kere_senegal_courtyard.png" x="478" y="298" width="224" height="280" preserveAspectRatio="xMidYMid slice" />
    <text x="478" y="606" font-family="Georgia, serif" font-size="13" fill="#B8935A" letter-spacing="2">CORE</text>
    <text x="478" y="630" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.32" font-weight="bold" fill="#1C1C1C">Baobab · Symbol of life</text>
    <text x="478" y="650" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#5C5852" textLength="96.0" lengthAdjust="spacingAndGlyphs">Set within the building's central courtyard</text>
  </g>

  <g id="card-interior">
    <rect x="740" y="290" width="480" height="370" fill="#1C1C1C" fill-opacity="0.86" />
    <image href="../images/kere_senegal_interior.png" x="752" y="302" width="456" height="280" preserveAspectRatio="xMidYMid slice" />
    <text x="752" y="610" font-family="Georgia, serif" font-size="13" fill="#E8C788" letter-spacing="2">INTERIOR</text>
    <text x="752" y="636" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" font-weight="bold" fill="#F5F2EC">Support cultural exchange · Educational outreach · Artistic performances and exhibitions</text>
    <text x="752" y="654" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D4CFC4">A warm, welcoming spatial character · Connecting with the community · Serving the public</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#E8C788" font-style="italic">In an era of global homogenization · top-tier architecture rooted in place · warming hearts</text>
    <text x="1220" y="700" text-anchor="end" font-family="Georgia, serif" font-size="7.84" fill="#D4CFC4">10 / 11 · Image source: Archdaily / Photography: Iwan Baan</text>
  </g>
</svg>
