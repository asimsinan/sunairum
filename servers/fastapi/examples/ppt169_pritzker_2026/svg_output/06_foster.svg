<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#F5F2EC" />
  </g>

  <g id="bg-faded">
    <image href="../images/foster_shanghai_exterior.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="720" fill="#F5F2EC" fill-opacity="0.72" />
  </g>

  <g id="p06-number">
    <text x="60" y="320" font-family="Georgia, serif" font-size="280" fill="#B8935A" font-style="italic" fill-opacity="0.85">04</text>
  </g>

  <g id="p06-title">
    <text x="60" y="400" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="39.20" font-weight="bold" fill="#1C1C1C" textLength="392.0" lengthAdjust="spacingAndGlyphs">Blooming Along Suzhou Creek</text>
    <text x="60" y="460" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="39.20" font-weight="bold" fill="#1C1C1C">Steel petals</text>
    <line x1="60" y1="490" x2="200" y2="490" stroke="#B8935A" stroke-width="3" />
    <text x="60" y="528" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#5C5852">Norman Foster · Shanghai JIA Art · Putuo New Landmark</text>
    <text x="60" y="556" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#8B8680">1999 Pritzker Prize · Opening April 2026 · Personally unveiled by the master</text>
  </g>

  <g id="thumb-petal">
    <rect x="900" y="180" width="280" height="420" fill="#F5F2EC" />
    <image href="../images/foster_shanghai_petal.png" x="906" y="186" width="268" height="408" preserveAspectRatio="xMidYMid slice" />
    <line x1="900" y1="180" x2="900" y2="240" stroke="#B8935A" stroke-width="3" />
    <text x="916" y="210" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#F5F2EC" textLength="78.0" lengthAdjust="spacingAndGlyphs">Petal Façade Details</text>
  </g>

  <g id="manifesto">
    <text x="60" y="608" font-family="Georgia, &quot;Georgia&quot;, serif" font-size="20" fill="#B8935A" font-style="italic">
      <tspan x="60" dy="0">Not a white cube · but a living organism slowly growing within the city.</tspan>
      <tspan x="60" dy="34">Experience the exhibition · take in the view · explore the city — classical humanistic spirit reborn through modern materials</tspan>
    </text>
  </g>

  <g id="footer">
    <line x1="60" y1="685" x2="1220" y2="685" stroke="#D4CFC4" stroke-width="1" />
    <text x="60" y="708" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.48" fill="#8B8680">Image source · Foster + Partners</text>
    <text x="1220" y="708" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#8B8680">06 / 11</text>
  </g>
</svg>
