  <g id="takeaway">
    <rect x="64" y="566" width="1152" height="56" rx="10" fill="#F4F7FA" />
    <use data-icon="tabler-outline/circle-check" x="84" y="578" width="32" height="32" fill="#2E7D32" stroke-width="2" />
    <text x="128" y="600" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#1D2733" textLength="154.4" lengthAdjust="spacingAndGlyphs">Across three model types, LoRA uses<tspan font-weight="800" fill="#E8743B"> 1/300 ~ 1/400 </tspan>trainable parameters, average GLUE score<tspan font-weight="800" fill="#2E7D32">On par with, or even slightly better than</tspan>Full fine-tuning</text>
