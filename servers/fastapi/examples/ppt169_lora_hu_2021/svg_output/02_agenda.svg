<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="agendaRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3A5C" />
      <stop offset="100%" stop-color="#3E7CB1" />
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>

  <g id="header">
    <rect x="64" y="58" width="6" height="56" rx="3" fill="#E8743B" />
    <text x="86" y="92" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="800" fill="#1B3A5C">What we'll cover</text>
    <text x="88" y="122" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="700" fill="#8A94A1" letter-spacing="1">WHAT WE'LL COVER · From problem to method to validation</text>
  </g>

  <g id="rail-decor">
    <line x1="110" y1="172" x2="110" y2="628" stroke="url(#agendaRail)" stroke-width="3" stroke-linecap="round" />
  </g>

  <g id="item-01">
    <circle cx="110" cy="178" r="22" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="3" />
    <text x="110" y="185" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="15" font-weight="800" fill="#1B3A5C">01</text>
    <text x="160" y="172" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="800" fill="#1D2733">Question: Why is fine-tuning becoming increasingly expensive?</text>
    <text x="160" y="198" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="500" fill="#5B6776">In the era of large models, the storage and deployment costs of full fine-tuning are out of control</text>
  </g>

  <g id="item-02">
    <circle cx="110" cy="266" r="22" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="3" />
    <text x="110" y="273" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="15" font-weight="800" fill="#1B3A5C">02</text>
    <text x="160" y="260" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="800" fill="#1D2733" textLength="154.0" lengthAdjust="spacingAndGlyphs">Limitations of existing methods</text>
    <text x="160" y="286" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="500" fill="#5B6776">Adapters add latency, Prefix occupies sequence length, and both often fail to reach the full fine-tuning baseline</text>
  </g>

  <g id="item-03">
    <circle cx="110" cy="354" r="22" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="3" />
    <text x="110" y="361" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="15" font-weight="800" fill="#1B3A5C">03</text>
    <text x="160" y="348" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="800" fill="#1D2733" textLength="188.1" lengthAdjust="spacingAndGlyphs">Core insight: the low-rank hypothesis</text>
    <text x="160" y="374" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="500" fill="#5B6776">The weight update ΔW has a low "intrinsic rank," so an extremely small r is sufficient</text>
  </g>

  <g id="item-04">
    <circle cx="110" cy="442" r="24" fill="#E8743B" />
    <text x="110" y="449" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">04</text>
    <text x="160" y="436" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="800" fill="#1D2733" textLength="165.7" lengthAdjust="spacingAndGlyphs">LoRA methods and implementation<tspan dx="10" font-size="12" font-weight="800" fill="#E8743B" letter-spacing="1">· Core</tspan></text>
    <text x="160" y="462" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="500" fill="#5B6776">Freeze W₀, inject low-rank BA; train only A and B, merge for deployment</text>
  </g>

  <g id="item-05">
    <circle cx="110" cy="530" r="22" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="3" />
    <text x="110" y="537" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="15" font-weight="800" fill="#1B3A5C">05</text>
    <text x="160" y="524" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="800" fill="#1D2733" textLength="88.0" lengthAdjust="spacingAndGlyphs">Experimental results</text>
    <text x="160" y="550" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="500" fill="#5B6776">RoBERTa / DeBERTa / GPT-2 / GPT-3: Fewer Parameters, Equal or Better Performance</text>
  </g>

  <g id="item-06">
    <circle cx="110" cy="618" r="22" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="3" />
    <text x="110" y="625" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="15" font-weight="800" fill="#1B3A5C">06</text>
    <text x="160" y="612" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="800" fill="#1D2733" textLength="154.0" lengthAdjust="spacingAndGlyphs">Low-Rank Understanding and Conclusions</text>
    <text x="160" y="638" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="500" fill="#5B6776">Which weights to adapt, how large the rank should be, and what that means for engineering implementation</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#8A94A1">LoRA · Hu et al. 2021 · arXiv:2106.09685</text>
    <text x="1216" y="700" text-anchor="end" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#8A94A1">02 / 15</text>
  </g>
</svg>
