    <text x="224" y="508" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="800" fill="#1D2733" textLength="80.0" lengthAdjust="spacingAndGlyphs">Industry Impact</text>
    <text x="224" y="540" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#1D2733">Open-sourced, becoming a foundation for fine-tuning large models<tspan font-weight="800" fill="#E8743B">One of the de facto standards</tspan>(Cornerstone of the PEFT ecosystem)</text>
