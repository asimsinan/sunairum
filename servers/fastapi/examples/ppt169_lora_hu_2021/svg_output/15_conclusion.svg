    <text x="224" y="208" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="800" fill="#1D2733" textLength="80.0" lengthAdjust="spacingAndGlyphs">The method itself</text>
    <text x="224" y="240" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#1D2733" textLength="88.6" lengthAdjust="spacingAndGlyphs">Low-Rank Adaptation = <tspan font-weight="800" fill="#1B3A5C">Parameter-efficient</tspan> + <tspan font-weight="800" fill="#2E7D32">Zero additional inference latency</tspan> + equal or better quality</text>
  </g>

  <g id="take-02">
    <circle cx="120" cy="360" r="24" fill="#3E7CB1" />
    <text x="120" y="367" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">02</text>
    <rect x="190" y="320" width="1026" height="96" rx="12" fill="#F4F7FA" stroke="#D8DEE6" stroke-width="1" />
    <rect x="190" y="320" width="6" height="96" rx="3" fill="#3E7CB1" />
    <text x="224" y="358" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="800" fill="#1D2733" textLength="80.0" lengthAdjust="spacingAndGlyphs">Engineering Significance</text>
    <text x="224" y="390" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#1D2733" textLength="119.0" lengthAdjust="spacingAndGlyphs">One pretrained foundation model<tspan font-weight="800" fill="#1B3A5C">Handle multiple tasks</tspan>,Hot-swap LoRA modules on demand, dramatically reducing deployment costs</text>
  </g>

  <g id="take-03">
    <circle cx="120" cy="510" r="24" fill="#E8743B" />
    <text x="120" y="517" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">03</text>
    <rect x="190" y="470" width="1026" height="96" rx="12" fill="#F4F7FA" stroke="#D8DEE6" stroke-width="1" />
