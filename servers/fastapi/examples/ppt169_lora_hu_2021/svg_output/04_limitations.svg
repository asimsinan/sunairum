<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="limRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3A5C" />
      <stop offset="100%" stop-color="#3E7CB1" />
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>

  <g id="header">
    <rect x="64" y="56" width="6" height="56" rx="3" fill="#E8743B" />
    <text x="86" y="90" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="800" fill="#1B3A5C">Why existing efficient adaptation methods are not good enough</text>
    <text x="88" y="120" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A94A1" letter-spacing="1">LIMITS OF EXISTING EFFICIENT-ADAPTATION METHODS</text>
  </g>

  <g id="rail-decor">
    <line x1="120" y1="222" x2="120" y2="610" stroke="url(#limRail)" stroke-width="3" stroke-linecap="round" />
  </g>

  <g id="lim-01">
    <circle cx="120" cy="232" r="24" fill="#1B3A5C" />
    <text x="120" y="239" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">01</text>
    <rect x="190" y="170" width="1026" height="128" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" />
    <rect x="190" y="170" width="6" height="128" rx="3" fill="#1B3A5C" />
    <rect x="222" y="198" width="52" height="52" rx="12" fill="#F4F7FA" />
    <use data-icon="tabler-outline/alert-triangle" x="234" y="210" width="28" height="28" fill="#1B3A5C" stroke-width="2" />
    <text x="300" y="216" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="800" fill="#1D2733" textLength="167.8" lengthAdjust="spacingAndGlyphs">Adapter Layer → Introduction<tspan fill="#C62828">Inference latency</tspan></text>
    <text x="300" y="248" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5B6776">Insert extra layers after self-attention/MLP to deepen the model; for online, short-sequence, small-batch scenarios</text>
    <text x="300" y="274" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5B6776">The latency increase is especially pronounced (quantified in Table 1 below).</text>
  </g>

  <g id="lim-02">
    <circle cx="120" cy="392" r="24" fill="#1B3A5C" />
    <text x="120" y="399" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">02</text>
    <rect x="190" y="330" width="1026" height="128" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" />
    <rect x="190" y="330" width="6" height="128" rx="3" fill="#3E7CB1" />
    <rect x="222" y="358" width="52" height="52" rx="12" fill="#F4F7FA" />
    <use data-icon="tabler-outline/alert-triangle" x="234" y="370" width="28" height="28" fill="#3E7CB1" stroke-width="2" />
    <text x="300" y="376" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="20" font-weight="800" fill="#1D2733">Prefix / Prompt tuning → <tspan fill="#C62828">Input length consumed</tspan></text>
    <text x="300" y="408" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5B6776">Using trainable prefix tokens to adapt to tasks occupies available sequence length; also, the prefix position/number</text>
    <text x="300" y="434" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5B6776" textLength="113.6" lengthAdjust="spacingAndGlyphs">Sensitive, difficult to optimize.</text>
  </g>

  <g id="lim-03">
    <circle cx="120" cy="552" r="24" fill="#1B3A5C" />
    <text x="120" y="559" text-anchor="middle" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">03</text>
    <rect x="190" y="490" width="1026" height="128" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" />
    <rect x="190" y="490" width="6" height="128" rx="3" fill="#E8743B" />
    <rect x="222" y="518" width="52" height="52" rx="12" fill="#FBF0E9" />
    <use data-icon="tabler-outline/alert-triangle" x="234" y="530" width="28" height="28" fill="#E8743B" stroke-width="2" />
    <text x="300" y="536" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="800" fill="#1D2733" textLength="64.2" lengthAdjust="spacingAndGlyphs">Universal → <tspan fill="#C62828">Cannot match the full-data fine-tuning baseline</tspan></text>
    <text x="300" y="568" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5B6776">Most efficient methods lag behind full fine-tuning in quality, forcing people to choose between "efficiency" and "quality"</text>
    <text x="300" y="594" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5B6776">Choose one of the two — this is precisely the trade-off LoRA aims to break.</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11" fill="#8A94A1">Source: LoRA §1–3 · Hu et al. 2021</text>
    <text x="1216" y="700" text-anchor="end" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#8A94A1">04 / 15</text>
  </g>
</svg>
