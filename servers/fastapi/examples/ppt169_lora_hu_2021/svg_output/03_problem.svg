<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="costFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
    <image href="../images/cost_explosion.png" x="640" y="0" width="640" height="720" preserveAspectRatio="xMidYMid slice" id="_edit_4" />
    <rect x="620" y="0" width="220" height="720" fill="url(#costFade)" />
  </g>

  <g id="header">
    <rect x="64" y="60" width="6" height="56" rx="3" fill="#E8743B" />
    <text x="86" y="92" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="800" fill="#1B3A5C">The larger the model, the less feasible full-parameter fine-tuning becomes</text>
    <text x="88" y="122" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#8A94A1" letter-spacing="1">THE COST OF FULL FINE-TUNING</text>
  </g>

  <g id="hero-number">
    <text x="64" y="320" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="88" font-weight="800" fill="#E8743B">175B</text>
    <text x="68" y="362" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="700" fill="#1B3A5C">Every downstream task requires a full-parameter copy to be stored</text>
  </g>

  <g id="points">
    <rect x="64" y="408" width="36" height="3" fill="#D8DEE6" />
    <text x="64" y="452" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.01" fill="#1D2733">Full fine-tuning will update<tspan font-weight="800" fill="#1B3A5C">All parameters</tspan>,The new model is the same size as the original model</text>
    <text x="64" y="492" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="18" fill="#1D2733">Deploy N tasks = <tspan font-weight="800" fill="#C62828">N × 175B</tspan>,Extremely high storage and switching costs</text>
    <text x="64" y="532" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#1D2733">Taking GPT-3 175B as an example, it has evolved from "inconvenience" into<tspan font-weight="800" fill="#1B3A5C">Deployment challenges</tspan></text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11" fill="#8A94A1">Source: LoRA §1 Introduction · Hu et al. 2021</text>
    <text x="1216" y="700" text-anchor="end" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#8A94A1">03 / 15</text>
  </g>
</svg>
