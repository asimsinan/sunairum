<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="imgOverlay02" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#1A1714" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#1A1714" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1A1714" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentLine02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4A882" />
      <stop offset="100%" stop-color="#D4956A" />
    </linearGradient>
  </defs>

  
  <rect width="1280" height="720" fill="#1A1714" />

  
  <image href="../images/space_overview.png" x="480" y="0" width="800" height="720" preserveAspectRatio="xMidYMid slice" />
  <rect x="480" y="0" width="800" height="720" fill="url(#imgOverlay02)" />

  
  <rect x="80" y="180" width="3" height="100" fill="url(#accentLine02)" rx="1.5" />

  
  <text x="80" y="170" font-family="Georgia, Georgia, serif" font-size="14" fill="#8B7355" letter-spacing="4">
    CHAPTER 01
  </text>

  
  <g id="p02-title">
    <text x="100" y="240" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26.60" font-weight="bold" fill="#E8E0D4" textLength="361.0" lengthAdjust="spacingAndGlyphs">
      From "influencer style"
    </text>
    <text x="100" y="290" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="28.42" font-weight="bold" fill="#C4A882">
      To the "human scale"
    </text>
  </g>

  
  <rect x="100" y="315" width="60" height="2" fill="#3D362E" />

  
  <g id="p02-content">
    <text x="100" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#E8E0D4">
      Over the past few years, we've grown accustomed to the rapid turnover of all kinds of home decor "trends."
    </text>
    <text x="100" y="410" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.52" fill="#B0A08E">
      By 2026, home design is quietly undergoing a profound transformation—
    </text>
    <text x="100" y="450" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#B0A08E">
      From piling up visual symbols to caring for people themselves.
    </text>
  </g>

  
  <rect x="100" y="490" width="4" height="60" fill="#D4956A" rx="2" />
  <text x="120" y="515" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#C4A882" font-style="italic">
    "A space with a sense of sophistication is about color, materials, and textures
  </text>
  <text x="120" y="545" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.55" fill="#C4A882" font-style="italic">
    created by an ingenious combination."
  </text>

  
  <text x="100" y="620" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A6E60">
    Good looks, with even more warmth and feeling
  </text>

  
  <text x="1210" y="690" text-anchor="end" font-family="Georgia, Georgia, serif" font-size="12" fill="#7A6E60">
    02 / 12
  </text>
</svg>
