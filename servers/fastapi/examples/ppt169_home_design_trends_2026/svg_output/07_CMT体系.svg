<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="ringGlow07" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feFlood flood-color="#C4A882" flood-opacity="0.25" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cardShadow07" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.15" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="accentGrad07" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4A882" />
      <stop offset="100%" stop-color="#D4956A" />
    </linearGradient>
    <radialGradient id="bgGlow07" cx="35%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0" />
    </radialGradient>
  </defs>

  
  <rect width="1280" height="720" fill="#1A1714" />
  <rect width="1280" height="720" fill="url(#bgGlow07)" />

  
  <g id="p07-header">
    <use data-icon="tabler-filled/sparkles" x="60" y="25" width="28" height="28" fill="#D4956A" />
    <text x="98" y="47" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.65" fill="#8B7355" letter-spacing="3">
      Core methodology
    </text>
    <text x="60" y="85" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="29.09" font-weight="bold" fill="#E8E0D4">
      CMT System
    </text>
    <text x="240" y="85" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#C4A882">
      Weaving an all-encompassing sensory experience
    </text>
  </g>

  
  
  <circle cx="340" cy="410" r="230" fill="#D4956A" fill-opacity="0.06" stroke="#D4956A" stroke-width="1.5" stroke-opacity="0.2" />
  <text x="340" y="200" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.25" font-weight="bold" fill="#D4956A" fill-opacity="0.7">
    Texture Texture
  </text>

  
  <circle cx="340" cy="410" r="155" fill="#C4A882" fill-opacity="0.08" stroke="#C4A882" stroke-width="1.5" stroke-opacity="0.25" />
  <text x="340" y="272" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14" font-weight="bold" fill="#C4A882" fill-opacity="0.8">
    Material
  </text>

  
  <circle cx="340" cy="410" r="75" fill="#C4A882" filter="url(#ringGlow07)" />
  <text x="340" y="402" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="20" font-weight="bold" fill="#1A1714">
    Color
  </text>
  <text x="340" y="425" text-anchor="middle" font-family="Georgia, Georgia, serif" font-size="14" fill="#2A2520">
    Colour
  </text>

  
  <g id="p07-card-physical" filter="url(#cardShadow07)">
    <rect x="650" y="120" width="580" height="105" rx="12" fill="#2A2520" />
    <rect x="650" y="120" width="5" height="105" rx="2" fill="#C4A882" />
    <text x="675" y="152" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#C4A882" textLength="169.2" lengthAdjust="spacingAndGlyphs">
      Physical-layer perception
    </text>
    <text x="675" y="180" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.58" fill="#B0A08E">
      Smooth / Rough · Transparent / Opaque · Glossy / Matte
    </text>
    <text x="675" y="206" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15" fill="#B0A08E">
      Soft / Hard · Warm / Cold · Light / Heavy
    </text>
  </g>

  <g id="p07-card-psychological" filter="url(#cardShadow07)">
    <rect x="650" y="245" width="580" height="105" rx="12" fill="#2A2520" />
    <rect x="650" y="245" width="5" height="105" rx="2" fill="#D4956A" />
    <text x="675" y="277" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#D4956A" textLength="169.2" lengthAdjust="spacingAndGlyphs">
      Psychological Associations
    </text>
    <text x="675" y="305" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#B0A08E">
      Handcrafted / Industrial · Simple / Luxurious · Intimate / Distant
    </text>
    <text x="675" y="331" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#B0A08E">
      Comfort / Stimulation · Relaxation / Excitement · Traditional / Modern
    </text>
  </g>

  
  <g id="p07-case-images">
    <image href="../images/cmt_neutral_mix.png" x="650" y="375" width="280" height="155" preserveAspectRatio="xMidYMid slice" />
    <rect x="650" y="375" width="280" height="155" fill="#1A1714" fill-opacity="0.15" />
    <text x="660" y="520" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#7A6E60">
      Neutral colors + layered materiality
    </text>

    <image href="../images/dark_tone_luxury.png" x="950" y="375" width="280" height="155" preserveAspectRatio="xMidYMid slice" />
    <rect x="950" y="375" width="280" height="155" fill="#1A1714" fill-opacity="0.15" />
    <text x="960" y="520" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#7A6E60">
      Dark tones + contrasting mirrored surfaces
    </text>
  </g>

  
  <g id="p07-quote">
    <rect x="650" y="555" width="580" height="80" rx="10" fill="#2A2520" />
    <rect x="650" y="555" width="580" height="3" rx="1" fill="url(#accentGrad07)" />
    <text x="670" y="585" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#C4A882" font-style="italic">
      "CMT is not a simple addition of the three,
    </text>
    <text x="670" y="612" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#C4A882" font-style="italic">
      But rather, "a conductor who allows colors, materials, and textures to resonate harmoniously in space"
    </text>
  </g>

  
  <text x="1210" y="690" text-anchor="end" font-family="Georgia, Georgia, serif" font-size="12" fill="#7A6E60">
    07 / 12
  </text>
</svg>
