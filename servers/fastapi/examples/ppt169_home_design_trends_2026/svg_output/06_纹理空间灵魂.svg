<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow06" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="5" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.18" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="leftImgClip06">
      <rect x="60" y="190" width="540" height="310" rx="12" />
    </clipPath>
    <clipPath id="rightImgClip06">
      <rect x="640" y="190" width="580" height="310" rx="12" />
    </clipPath>
  </defs>

  
  <rect width="1280" height="720" fill="#1A1714" />

  
  <g id="p06-header">
    <use data-icon="tabler-filled/paint" x="60" y="30" width="28" height="28" fill="#D4956A" />
    <text x="98" y="52" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#8B7355" letter-spacing="3" textLength="176.5" lengthAdjust="spacingAndGlyphs">
      Three foundational elements · III
    </text>
  </g>

  
  <g id="p06-title">
    <text x="60" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="25.20" font-weight="bold" fill="#E8E0D4">
      Texture: The Detail That Breathes Soul into a Space
    </text>
    <text x="60" y="155" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#B0A08E">
      Texture is like the “fingerprint” of a space—giving it a unique identity
    </text>
  </g>

  
  
  <g id="p06-left-image" filter="url(#cardShadow06)">
    <image href="../images/texture_tactile.png" x="60" y="190" width="540" height="310" preserveAspectRatio="xMidYMid slice" clip-path="url(#leftImgClip06)" />
    
    <rect x="60" y="440" width="540" height="60" fill="#1A1714" fill-opacity="0.75" rx="0" />
    <use data-icon="tabler-filled/eye" x="80" y="455" width="24" height="24" fill="#C4A882" />
    <text x="114" y="475" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.77" font-weight="bold" fill="#E8E0D4">
      Tactile Texture
    </text>
    <text x="240" y="475" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#B0A08E">
      Surface characteristics perceived directly by the fingers, feet, or body
    </text>
  </g>

  
  <g id="p06-right-image" filter="url(#cardShadow06)">
    <image href="../images/texture_visual.png" x="640" y="190" width="580" height="310" preserveAspectRatio="xMidYMid slice" clip-path="url(#rightImgClip06)" />
    
    <rect x="640" y="440" width="580" height="60" fill="#1A1714" fill-opacity="0.75" rx="0" />
    <use data-icon="tabler-filled/eye" x="660" y="455" width="24" height="24" fill="#D4956A" />
    <text x="694" y="475" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.36" font-weight="bold" fill="#E8E0D4">
      Visual Texture
    </text>
    <text x="820" y="475" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#B0A08E">
      Imaginations and feelings evoked by visuals
    </text>
  </g>

  
  <g id="p06-examples">
    <rect x="60" y="530" width="560" height="110" rx="10" fill="#2A2520" />
    <rect x="60" y="530" width="4" height="110" rx="2" fill="#C4A882" />
    <text x="84" y="560" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" font-weight="bold" fill="#C4A882">
      Tactile Perception
    </text>
    <text x="84" y="590" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.49" fill="#B0A08E">
      Bare feet on a wool carpet → Soft and warm
    </text>
    <text x="84" y="618" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#B0A08E">
      Fingers gently brushing a rough ceramic vase → an uneven texture
    </text>

    <rect x="660" y="530" width="560" height="110" rx="10" fill="#2A2520" />
    <rect x="660" y="530" width="4" height="110" rx="2" fill="#D4956A" />
    <text x="684" y="560" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" font-weight="bold" fill="#D4956A">
      Visual Perception
    </text>
    <text x="684" y="590" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#B0A08E">
      Wallpaper with delicate patterns → the eyes “feel” the texture
    </text>
    <text x="684" y="618" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#B0A08E">
      Without touch, the visual presentation has already conveyed a sense of texture
    </text>
  </g>

  
  <text x="1210" y="690" text-anchor="end" font-family="Georgia, Georgia, serif" font-size="12" fill="#7A6E60">
    06 / 12
  </text>
</svg>
