<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="endGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4A882" />
      <stop offset="100%" stop-color="#D4956A" />
    </linearGradient>
    <filter id="endGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feFlood flood-color="#C4A882" flood-opacity="0.25" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGlow12" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0" />
    </radialGradient>
    <clipPath id="bookDispClip1">
      <rect x="730" y="180" width="230" height="320" rx="10" />
    </clipPath>
    <clipPath id="bookDispClip2">
      <rect x="980" y="180" width="230" height="320" rx="10" />
    </clipPath>
  </defs>

  
  <rect width="1280" height="720" fill="#1A1714" />
  <rect width="1280" height="720" fill="url(#bgGlow12)" />

  
  <rect x="80" y="160" width="3" height="120" fill="#C4A882" fill-opacity="0.3" />
  <circle cx="81" cy="155" r="4" fill="#C4A882" fill-opacity="0.4" />

  
  <g id="p12-title">
    <text x="110" y="220" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34.67" font-weight="bold" fill="#E8E0D4" filter="url(#endGlow)">
      Bring home back
    </text>
    <text x="110" y="280" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="35.97" font-weight="bold" fill="url(#endGrad)">
      "The human scale"
    </text>
  </g>

  
  <rect x="110" y="305" width="80" height="3" fill="url(#endGrad)" rx="1.5" />

  
  <g id="p12-message">
    <text x="110" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#E8E0D4" textLength="208.0" lengthAdjust="spacingAndGlyphs">
      The essence of sophistication
    </text>
    <text x="110" y="400" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#B0A08E">
      The subtle resonance of color, materials, and textures
    </text>
  </g>

  
  <g id="p12-keywords">
    <use data-icon="tabler-filled/palette" x="110" y="440" width="24" height="24" fill="#C4A882" />
    <text x="142" y="458" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.22" fill="#C4A882">Color</text>
    <text x="192" y="458" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.07" fill="#7A6E60">· Mood magician</text>

    <use data-icon="tabler-filled/diamond" x="110" y="476" width="24" height="24" fill="#D4956A" />
    <text x="142" y="494" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#D4956A" textLength="32.0" lengthAdjust="spacingAndGlyphs">Material</text>
    <text x="192" y="494" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7A6E60">· Language within reach</text>

    <use data-icon="tabler-filled/paint" x="110" y="512" width="24" height="24" fill="#8B7355" />
    <text x="142" y="530" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#8B7355" textLength="32.0" lengthAdjust="spacingAndGlyphs">Texture</text>
    <text x="192" y="530" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7A6E60" textLength="110.3" lengthAdjust="spacingAndGlyphs">· Details of the soul of space</text>
  </g>

  
  <g id="p12-closing">
    <use data-icon="tabler-filled/heart" x="110" y="570" width="20" height="20" fill="#C06048" />
    <text x="138" y="586" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#E8E0D4" font-style="italic">
      Good looks, with even more warmth and feeling
    </text>
  </g>

  
  <g id="p12-book-images">
    <image href="../images/book_display1.png" x="730" y="180" width="230" height="320" preserveAspectRatio="xMidYMid slice" clip-path="url(#bookDispClip1)" />
    <image href="../images/book_display2.png" x="980" y="180" width="230" height="320" preserveAspectRatio="xMidYMid slice" clip-path="url(#bookDispClip2)" />
  </g>

  
  <text x="730" y="530" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.26" fill="#7A6E60">
    References
  </text>
  <text x="730" y="555" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#B0A08E">
    《The Sophistication of Space—A Designer’s Color,
  </text>
  <text x="730" y="575" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#B0A08E" textLength="158.3" lengthAdjust="spacingAndGlyphs">
    Material and Texture Pairing Guide》
  </text>
  <text x="730" y="600" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#7A6E60">
    Author: Song Wenwen · Jiangsu Phoenix Science and Technology Press
  </text>

  
  <rect x="60" y="660" width="1160" height="1" fill="#3D362E" />
  <text x="640" y="690" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.34" fill="#7A6E60">
    Thanks for Watching · Thank You
  </text>

  
  <text x="1210" y="690" text-anchor="end" font-family="Georgia, Georgia, serif" font-size="12" fill="#7A6E60">
    12 / 12
  </text>
</svg>
