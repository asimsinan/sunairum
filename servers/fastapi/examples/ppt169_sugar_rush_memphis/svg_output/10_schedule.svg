    <text x="180" y="328" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#FFF8EE">1</text>
    <rect x="105" y="170" width="150" height="110" rx="12" fill="#FFF8EE" stroke="#1A1A2E" stroke-width="3" />
