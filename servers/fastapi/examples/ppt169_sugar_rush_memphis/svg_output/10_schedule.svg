    <text x="880" y="392" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#1A1A2E">CROSSOVER</text>
    <text x="880" y="414" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" font-weight="700" fill="#FF6B4A" textLength="52.0" lengthAdjust="spacingAndGlyphs">A Night of Crossover</text>
    <text x="880" y="432" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="7.70" font-weight="600" fill="#5C5C7A" textLength="64.7" lengthAdjust="spacingAndGlyphs">4 headliners on one stage</text>
