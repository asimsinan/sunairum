    <text x="740" y="226" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#1A1A2E">HIPHOP</text>
    <text x="740" y="248" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" font-weight="700" fill="#FF6B4A" textLength="52.0" lengthAdjust="spacingAndGlyphs">Hip-Hop Midnight</text>
