<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="duotoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C0" />
      <stop offset="100%" stop-color="#EDD8A0" />
    </linearGradient>
    <linearGradient id="posterAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A1F6B" />
      <stop offset="100%" stop-color="#2A1050" />
    </linearGradient>
    <clipPath id="narrowLeftClip">
      <rect x="0" y="0" width="280" height="720" />
    </clipPath>
  </defs>

  
  <rect width="1280" height="720" fill="url(#duotoneBg)" />

  
  <line x1="300" y1="0" x2="1280" y2="980" stroke="#3A1F6B" stroke-opacity="0.03" stroke-width="3" />
  <line x1="380" y1="0" x2="1280" y2="900" stroke="#3A1F6B" stroke-opacity="0.03" stroke-width="3" />
  <line x1="460" y1="0" x2="1280" y2="820" stroke="#3A1F6B" stroke-opacity="0.03" stroke-width="3" />
  <line x1="540" y1="0" x2="1280" y2="740" stroke="#3A1F6B" stroke-opacity="0.03" stroke-width="3" />
  <line x1="620" y1="0" x2="1280" y2="660" stroke="#3A1F6B" stroke-opacity="0.03" stroke-width="3" />
  <line x1="700" y1="0" x2="1280" y2="580" stroke="#3A1F6B" stroke-opacity="0.03" stroke-width="3" />

  
  <image href="../images/p12_poster_img.png" x="0" y="0" width="280" height="720" clip-path="url(#narrowLeftClip)" preserveAspectRatio="xMidYMid slice" />

  
  <rect x="280" y="0" width="8" height="720" fill="url(#posterAccent)" />

  
  
  <text x="316" y="52" font-family="Consolas, monospace" font-size="13" fill="#3A1F6B" fill-opacity="0.6" letter-spacing="3">P12  ·  vintage-poster × duotone</text>
  <line x1="316" y1="62" x2="1220" y2="62" stroke="#3A1F6B" stroke-opacity="0.15" stroke-width="1" />

  
  <text x="316" y="160" font-family="Georgia, serif" font-size="61.09" font-weight="bold" fill="#3A1F6B" letter-spacing="-2">Retro</text>
  <text x="316" y="250" font-family="Georgia, serif" font-size="56.00" font-weight="bold" fill="#3A1F6B" letter-spacing="-2">Poster</text>

  
  <rect x="316" y="270" width="700" height="3" fill="#3A1F6B" fill-opacity="0.3" />
  <text x="316" y="302" font-family="Arial, sans-serif" font-size="20" fill="#3A1F6B" letter-spacing="6">VINTAGE POSTER  ×  DUOTONE</text>

  
  <text x="316" y="352" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#3A1F6B" fill-opacity="0.8">A Narrow Vertical Image Occupies Just 22% of the Left Side of the Frame, Like a Book Spine</text>
  <text x="316" y="378" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#3A1F6B" fill-opacity="0.8">Or a decorative side strip for a magazine cover, with large text on the right</text>
  <text x="316" y="404" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#3A1F6B" fill-opacity="0.8">Spreading horizontally to create a minimalist magazine aesthetic.</text>

  
  <line x1="316" y1="440" x2="460" y2="440" stroke="#3A1F6B" stroke-opacity="0.2" stroke-width="1" />
  <text x="316" y="468" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A1F6B" fill-opacity="0.7">·  Two-tone only: deep purple ink blue × warm beige gold</text>
  <text x="316" y="496" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A1F6B" fill-opacity="0.7">· Halftone dot texture overlay adds a printed feel</text>
  <text x="316" y="524" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A1F6B" fill-opacity="0.7">· Rough rule lines divide the image and text areas</text>
  <text x="316" y="552" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="17" fill="#3A1F6B" fill-opacity="0.7">·  1950s Knoll / 1960s Olivetti style</text>

  
  <rect x="316" y="610" width="700" height="80" fill="#3A1F6B" fill-opacity="0.08" />
  <text x="336" y="648" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#3A1F6B">Narrow Images Like Spines · Wide Type Like Outstretched Wings</text>
  <text x="336" y="672" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#3A1F6B" fill-opacity="0.7">The smaller the image, the greater the power of the text</text>

  
  <text x="1240" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#3A1F6B" fill-opacity="0.5">12</text>
</svg>
