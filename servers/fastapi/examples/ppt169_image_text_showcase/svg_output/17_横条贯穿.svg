<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="vividBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A14" />
      <stop offset="100%" stop-color="#14060A" />
    </linearGradient>
    <linearGradient id="vividAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6FF7" />
      <stop offset="50%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#7C6FF7" />
    </linearGradient>
    <linearGradient id="stripFadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0A14" stop-opacity="1" />
      <stop offset="10%" stop-color="#0A0A14" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="stripFadeR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0A0A14" stop-opacity="1" />
      <stop offset="10%" stop-color="#0A0A14" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <rect width="1280" height="720" fill="url(#vividBg)" />

  
  <text x="640" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.10" fill="#9090A0" letter-spacing="3">P17  ·  screen-print × vivid-launch  ·  horizontal strip running across</text>

  <text x="640" y="110" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="36.40" font-weight="bold" fill="#E8E8F0" textLength="208.0" lengthAdjust="spacingAndGlyphs">Horizontal bars spanning across</text>

  <text x="640" y="150" text-anchor="middle" font-family="Arial, 'Georgia', sans-serif" font-size="20" fill="#9090A0">Horizontal Strip Divides the Page</text>

  
  <rect x="440" y="168" width="400" height="2" rx="1" fill="url(#vividAccent)" />

  <text x="640" y="202" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#E8E8F0">A screen-print-style horizontal narrow image strip runs across the middle of the page,</text>
  <text x="640" y="228" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#9090A0">Dividing the Text Above and Below into Independent Narrative Nodes.</text>

  
  
  <rect x="0" y="248" width="1280" height="3" fill="url(#vividAccent)" />
  <image href="../images/p17_strip_img.png" x="0" y="251" width="1280" height="234" preserveAspectRatio="xMidYMid slice" />
  
  <rect x="0" y="251" width="100" height="234" fill="url(#stripFadeL)" />
  <rect x="1180" y="251" width="100" height="234" fill="url(#stripFadeR)" />
  
  <rect x="0" y="485" width="1280" height="3" fill="url(#vividAccent)" />

  
  <text x="640" y="540" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#9090A0">The image is a flash of light—cutting through the context and creating a rhythmic pause,</text>
  <text x="640" y="566" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#9090A0">The text below resumes the narrative after a rhythmic pause.</text>

  
  <rect x="254" y="598" width="200" height="32" rx="4" fill="#7C6FF7" fill-opacity="0.15" stroke="#7C6FF7" stroke-opacity="0.3" stroke-width="1" />
  <text x="354" y="618" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7C6FF7" textLength="84.0" lengthAdjust="spacingAndGlyphs">Screen-print texture</text>

  <rect x="474" y="598" width="200" height="32" rx="4" fill="#F5A623" fill-opacity="0.15" stroke="#F5A623" stroke-opacity="0.3" stroke-width="1" />
  <text x="574" y="618" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#F5A623" textLength="84.0" lengthAdjust="spacingAndGlyphs">Vitality Launch Color Palette</text>

  <rect x="694" y="598" width="200" height="32" rx="4" fill="#4ECDC4" fill-opacity="0.15" stroke="#4ECDC4" stroke-opacity="0.3" stroke-width="1" />
  <text x="794" y="618" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#4ECDC4" textLength="98.0" lengthAdjust="spacingAndGlyphs">The image cuts through the rhythm of the text</text>

  <rect x="914" y="598" width="200" height="32" rx="4" fill="#E8E8F0" fill-opacity="0.08" stroke="#E8E8F0" stroke-opacity="0.1" stroke-width="1" />
  <text x="1014" y="618" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9090A0" textLength="84.0" lengthAdjust="spacingAndGlyphs">Strong contrast in layout</text>

  
  <text x="640" y="680" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#7C6FF7" fill-opacity="0.7">The image is a beam of light cutting across the page</text>

  <text x="1240" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5A5A72">17</text>
</svg>
