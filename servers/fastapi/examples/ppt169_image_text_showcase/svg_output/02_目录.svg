  <text x="40" y="200" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#9090A0" textLength="68.0" lengthAdjust="spacingAndGlyphs">This issue showcases</text>
  <text x="40" y="224" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#9090A0">20 Text-and-Image Formats</text>
  <text x="40" y="248" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#7C6FF7">18 rendering styles</text>
  <text x="40" y="272" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#9090A0" textLength="86.7" lengthAdjust="spacingAndGlyphs">14 color palettes</text>

  
  <use data-icon="tabler-outline/photo" x="40" y="320" width="28" height="28" fill="#7C6FF7" stroke-width="2" />
  <use data-icon="tabler-outline/layout-collage" x="80" y="320" width="28" height="28" fill="#4ECDC4" stroke-width="2" />
