    <text x="600" y="672" font-family="Arial, sans-serif" font-size="13" fill="#5A5A72">editorial × dark-cinematic</text>

    <text x="780" y="672" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#5A5A72">20</text>
