    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6FF7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7C6FF7" stop-opacity="0" />
