  <rect x="40" y="60" width="260" height="4" rx="2" fill="url(#leftBarGrad)" />
  <text x="40" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26.60" font-weight="bold" fill="#E8E8F0" textLength="76.0" lengthAdjust="spacingAndGlyphs">Contents</text>
