  <line x1="390" y1="425" x2="1220" y2="425" stroke="#2A2D3E" stroke-width="1" />

  
  <text x="390" y="455" font-family="Arial, 'Georgia', sans-serif" font-size="13" fill="#5A5A72" letter-spacing="2">11 — 20</text>

