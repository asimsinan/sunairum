  <text x="390" y="80" font-family="Arial, 'Georgia', sans-serif" font-size="13" fill="#5A5A72" letter-spacing="2">01 — 10</text>

  
  <g>
    
    <text x="390" y="116" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7C6FF7">01</text>
    <text x="418" y="116" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.98" fill="#E8E8F0">Cover</text>
    <text x="600" y="116" font-family="Arial, sans-serif" font-size="13" fill="#5A5A72">glassmorphism × dark-cinematic</text>

    
    <text x="390" y="148" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#5A5A72">02</text>
    <text x="418" y="148" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#9090A0" textLength="34.0" lengthAdjust="spacingAndGlyphs">Contents</text>
    <text x="600" y="148" font-family="Arial, sans-serif" font-size="9.10" fill="#5A5A72" textLength="52.0" lengthAdjust="spacingAndGlyphs">Structural Navigation</text>

    
