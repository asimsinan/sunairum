<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
    <image href="../images/negative_space.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
  </g>

  <g id="page-header">
    <text x="64" y="60" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" letter-spacing="2">P · 10</text>
  </g>

  <g id="floating-headline">
    <line x1="760" y1="120" x2="760" y2="164" stroke="#D9251D" stroke-width="3" />
    <text x="784" y="148" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#1A1A1A" letter-spacing="2">ARGUMENT · 07</text>

    <text x="760" y="220" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="39.20" font-weight="900" fill="#1A1A1A" textLength="280.0" lengthAdjust="spacingAndGlyphs">Whitespace is structure</text>
    <text x="760" y="260" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="22" font-weight="900" fill="#1A1A1A">Negative space is structure, not absence.</text>
  </g>

  <g id="floating-aphorism">
    <text x="760" y="640" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="18" fill="#1A1A1A">
      <tspan x="760" dy="0">Whitespace is not leftover space</tspan>
      <tspan x="760" dy="28">It is a carrier of information</tspan>
    </text>
    <text x="760" y="708" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">THE SPACE BETWEEN IS THE MESSAGE</text>
  </g>

  <g id="page-footer">
    <text x="1216" y="688" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="end" letter-spacing="1">10 / 14</text>
  </g>
