<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <text x="64" y="60" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" letter-spacing="2">P · 13</text>
    <text x="64" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="900" fill="#1A1A1A" textLength="288.0" lengthAdjust="spacingAndGlyphs">The Swiss Heritage of Contemporary Brands</text>
    <text x="64" y="148" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="14" fill="#666666" letter-spacing="2">SIX BRANDS WHERE THE SWISS GRID STILL LIVES</text>
    <line x1="64" y1="172" x2="120" y2="172" stroke="#D9251D" stroke-width="3" />
  </g>

  
  

  <g id="brand-apple">
    <line x1="96" y1="240" x2="384" y2="240" stroke="#1A1A1A" stroke-width="1" />
    <use data-icon="simple-icons/apple" x="96" y="266" width="56" height="56" fill="#1A1A1A" />
    <text x="168" y="296" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="22" font-weight="900" fill="#1A1A1A">Apple</text>
    <text x="168" y="318" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">CUPERTINO · 1976</text>
    <text x="96" y="370" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="96" dy="0">An extremely minimalist, rational product language</tspan>
      <tspan x="96" dy="20">From early Keynote to HIG</tspan>
      <tspan x="96" dy="20">The Most Visible Heir to the Swiss Lineage</tspan>
    </text>
  </g>

  <g id="brand-google">
    <line x1="528" y1="240" x2="816" y2="240" stroke="#1A1A1A" stroke-width="1" />
    <use data-icon="simple-icons/google" x="528" y="266" width="56" height="56" fill="#1A1A1A" />
    <text x="600" y="296" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="22" font-weight="900" fill="#1A1A1A">Google</text>
    <text x="600" y="318" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">MOUNTAIN VIEW · 1998</text>
    <text x="528" y="370" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="528" dy="0">Material Design system</tspan>
      <tspan x="528" dy="20">8dp grid + geometric type</tspan>
      <tspan x="528" dy="20">Swiss engineering on mobile</tspan>
    </text>
  </g>

  <g id="brand-spotify">
    <line x1="960" y1="240" x2="1216" y2="240" stroke="#1A1A1A" stroke-width="1" />
    <use data-icon="simple-icons/spotify" x="960" y="266" width="56" height="56" fill="#1A1A1A" />
    <text x="1032" y="296" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="22" font-weight="900" fill="#1A1A1A">Spotify</text>
    <text x="1032" y="318" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">STOCKHOLM · 2006</text>
    <text x="960" y="370" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="960" dy="0">Magazine-style layout language</tspan>
      <tspan x="960" dy="20">Large type · grid blocks</tspan>
      <tspan x="960" dy="20">Turn music into a visual story</tspan>
    </text>
  </g>

  <g id="brand-airbnb">
    <line x1="96" y1="480" x2="384" y2="480" stroke="#1A1A1A" stroke-width="1" />
    <use data-icon="simple-icons/airbnb" x="96" y="506" width="56" height="56" fill="#1A1A1A" />
    <text x="168" y="536" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="22" font-weight="900" fill="#1A1A1A">Airbnb</text>
    <text x="168" y="558" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">SAN FRANCISCO · 2008</text>
    <text x="96" y="610" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="96" dy="0">DLS Design Language System</tspan>
      <tspan x="96" dy="20">Modular grid + minimalist identity</tspan>
      <tspan x="96" dy="20">The photography also follows an objective documentary approach</tspan>
    </text>
  </g>

  <g id="brand-ibm">
    <line x1="528" y1="480" x2="816" y2="480" stroke="#D9251D" stroke-width="2" />
    <use data-icon="simple-icons/ibm" x="528" y="506" width="56" height="56" fill="#D9251D" />
    <text x="600" y="536" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="22" font-weight="900" fill="#D9251D">IBM</text>
    <text x="600" y="558" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">ARMONK · 1911</text>
    <text x="528" y="610" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="528" dy="0">JMB served as an IBM consultant starting in 1967</tspan>
      <tspan x="528" dy="20">Paul Rand took over the visual identity around the same time</tspan>
      <tspan x="528" dy="20">A case of direct Swiss lineage</tspan>
    </text>
  </g>

  <g id="brand-lufthansa">
    <line x1="960" y1="480" x2="1216" y2="480" stroke="#1A1A1A" stroke-width="1" />
    <use data-icon="simple-icons/lufthansa" x="960" y="506" width="56" height="56" fill="#1A1A1A" />
    <text x="1032" y="536" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="22" font-weight="900" fill="#1A1A1A">Lufthansa</text>
    <text x="1032" y="558" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">COLOGNE · 1955</text>
    <text x="960" y="610" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="960" dy="0">Otl Aicher 1962 VI</tspan>
      <tspan x="960" dy="20">A benchmark for systematic design from Ulm</tspan>
      <tspan x="960" dy="20">Largely in use for more than 60 years</tspan>
    </text>
  </g>

  <g id="page-footer">
    <text x="1216" y="688" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" text-anchor="end" letter-spacing="1">13 / 14</text>
  </g>
</svg>
