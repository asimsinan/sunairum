<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <text x="64" y="60" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" letter-spacing="2">P · 04</text>
    <text x="64" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="900" fill="#1A1A1A" textLength="192.0" lengthAdjust="spacingAndGlyphs">Eight core principles</text>
    <text x="64" y="148" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="14" fill="#666666" letter-spacing="2">EIGHT PRINCIPLES OF SWISS DESIGN</text>
    <line x1="64" y1="172" x2="120" y2="172" stroke="#D9251D" stroke-width="3" />
  </g>

  
  

  <g id="principle-1">
    <text x="64" y="244" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">01</text>
    <line x1="64" y1="276" x2="280" y2="276" stroke="#1A1A1A" stroke-width="1" />
    <text x="64" y="302" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#1A1A1A" textLength="108.0" lengthAdjust="spacingAndGlyphs">Objectivity before expression</text>
    <text x="64" y="324" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">OBJECTIVITY OVER EXPRESSION</text>
    <text x="64" y="354" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="64" dy="0">Information communication takes precedence over</tspan>
      <tspan x="64" dy="18">The designer’s personal emotions.</tspan>
    </text>
  </g>

  <g id="principle-2">
    <text x="368" y="244" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">02</text>
    <line x1="368" y1="276" x2="584" y2="276" stroke="#1A1A1A" stroke-width="1" />
    <text x="368" y="302" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#1A1A1A" textLength="126.0" lengthAdjust="spacingAndGlyphs">A mathematical grid as the framework</text>
    <text x="368" y="324" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">MATHEMATICAL GRID</text>
    <text x="368" y="354" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="368" dy="0">Columns, rows, spacing, modules</tspan>
      <tspan x="368" dy="18">All are derived from basic units.</tspan>
    </text>
  </g>

  <g id="principle-3">
    <text x="672" y="244" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">03</text>
    <line x1="672" y1="276" x2="888" y2="276" stroke="#1A1A1A" stroke-width="1" />
    <text x="672" y="302" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#1A1A1A" textLength="90.0" lengthAdjust="spacingAndGlyphs">Asymmetrical composition</text>
    <text x="672" y="324" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">ASYMMETRIC LAYOUT</text>
    <text x="672" y="354" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="672" dy="0">Reject classical symmetry</tspan>
      <tspan x="672" dy="18">The central authority it brought.</tspan>
    </text>
  </g>

  <g id="principle-4">
    <text x="976" y="244" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">04</text>
    <line x1="976" y1="276" x2="1192" y2="276" stroke="#1A1A1A" stroke-width="1" />
    <text x="976" y="302" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#1A1A1A">Sans-serif font</text>
    <text x="976" y="324" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">SANS-SERIF TYPOGRAPHY</text>
    <text x="976" y="354" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="976" dy="0">Akzidenz · Helvetica</tspan>
      <tspan x="976" dy="18">Univers forms a three-way balance.</tspan>
    </text>
  </g>

  <g id="principle-5">
    <text x="64" y="484" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">05</text>
    <line x1="64" y1="516" x2="280" y2="516" stroke="#1A1A1A" stroke-width="1" />
    <text x="64" y="542" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#1A1A1A" textLength="90.0" lengthAdjust="spacingAndGlyphs">Aligned left, uneven right</text>
    <text x="64" y="564" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">FLUSH-LEFT RAGGED-RIGHT</text>
    <text x="64" y="594" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="64" dy="0">Even Letterspacing</tspan>
      <tspan x="64" dy="18">The reading pace is steady.</tspan>
    </text>
  </g>

  <g id="principle-6">
    <text x="368" y="484" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">06</text>
    <line x1="368" y1="516" x2="584" y2="516" stroke="#1A1A1A" stroke-width="1" />
    <text x="368" y="542" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#1A1A1A" textLength="72.0" lengthAdjust="spacingAndGlyphs">Objective photography</text>
    <text x="368" y="564" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">OBJECTIVE PHOTOGRAPHY</text>
    <text x="368" y="594" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="368" dy="0">Replacing decorative illustrations</tspan>
      <tspan x="368" dy="18">Modern photography makes its debut.</tspan>
    </text>
  </g>

  <g id="principle-7">
    <text x="672" y="484" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">07</text>
    <line x1="672" y1="516" x2="888" y2="516" stroke="#D9251D" stroke-width="2" />
    <text x="672" y="542" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#D9251D" textLength="90.0" lengthAdjust="spacingAndGlyphs">Whitespace is structure</text>
    <text x="672" y="564" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">NEGATIVE SPACE AS STRUCTURE</text>
    <text x="672" y="594" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="672" dy="0">Blank Space Is the Carrier of Information</tspan>
      <tspan x="672" dy="18">Rather than what was left over.</tspan>
    </text>
  </g>

  <g id="principle-8">
    <text x="976" y="484" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="48" font-weight="900" fill="#E8E8E8">08</text>
    <line x1="976" y1="516" x2="1192" y2="516" stroke="#1A1A1A" stroke-width="1" />
    <text x="976" y="542" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="900" fill="#1A1A1A" textLength="126.0" lengthAdjust="spacingAndGlyphs">Repeatable and scalable</text>
    <text x="976" y="564" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="1">REPRODUCIBLE AT SCALE</text>
    <text x="976" y="594" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">
      <tspan x="976" dy="0">Cross-language, cross-media</tspan>
      <tspan x="976" dy="18">Reuse across scales.</tspan>
    </text>
  </g>

  <g id="page-footer">
    <text x="1216" y="688" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" text-anchor="end" letter-spacing="1">04 / 14</text>
  </g>
</svg>
