<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <text x="64" y="60" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" letter-spacing="2">P · 07</text>
    <text x="64" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="900" fill="#1A1A1A" textLength="224.0" lengthAdjust="spacingAndGlyphs">Three Defining Typefaces</text>
    <text x="64" y="148" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="14" fill="#666666" letter-spacing="2">THREE TYPEFACES THAT WROTE THE SWISS STYLE</text>
    <line x1="64" y1="172" x2="120" y2="172" stroke="#D9251D" stroke-width="3" />
  </g>

  <g id="type-akzidenz">
    <line x1="64" y1="220" x2="404" y2="220" stroke="#1A1A1A" stroke-width="3" />
    <text x="64" y="252" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">CARD · 01</text>
    <text x="64" y="280" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Akzidenz-Grotesk</text>
    <text x="64" y="304" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="14" fill="#666666">1896 · Berthold Type Foundry</text>
    <text x="64" y="480" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="168" font-weight="900" fill="#1A1A1A" letter-spacing="-2">Aa</text>
    <text x="64" y="500" font-family="Arial, sans-serif" font-size="10" fill="#999999" letter-spacing="2">EXTRA BOLD · 900</text>
    <line x1="64" y1="528" x2="120" y2="528" stroke="#1A1A1A" stroke-width="1" />
    <text x="64" y="556" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1A1A1A" textLength="112.0" lengthAdjust="spacingAndGlyphs">The first of its kind in the modern sense</text>
    <text x="64" y="578" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1A1A1A" textLength="98.0" lengthAdjust="spacingAndGlyphs">Commercial sans-serif typeface</text>
    <text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="64" y="608" textLength="96.0" lengthAdjust="spacingAndGlyphs">The Early Choice of the Swiss School</text><text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="64" y="626">Introduced 61 years before Helvetica</text><text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="64" y="644">Setting the entire tone for sans-serif aesthetics</text></g>

  <g id="type-helvetica">
    <line x1="470" y1="220" x2="810" y2="220" stroke="#D9251D" stroke-width="3" />
    <text x="470" y="252" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">CARD · 02</text>
    <text x="470" y="280" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Helvetica</text>
    <text x="470" y="304" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="14" fill="#666666">1957 · Miedinger + Hoffmann</text>
    <text x="470" y="480" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="168" font-weight="700" fill="#D9251D" letter-spacing="-1">Aa</text>
    <text x="470" y="500" font-family="Arial, sans-serif" font-size="10" fill="#999999" letter-spacing="2">BOLD · 700 · NEUTRAL</text>
    <line x1="470" y1="528" x2="526" y2="528" stroke="#D9251D" stroke-width="2" />
    <text x="470" y="556" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#D9251D" textLength="127.4" lengthAdjust="spacingAndGlyphs">It literally means “Switzerland.”</text>
    <text x="470" y="578" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1A1A1A" textLength="145.9" lengthAdjust="spacingAndGlyphs">Neutral · Objective · Highly legible</text>
    <text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="470" y="608">Originally named Neue Haas Grotesk</text><text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="470" y="626" textLength="154.0" lengthAdjust="spacingAndGlyphs">Derived from the Latin Helvetia (Switzerland)</text><text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="470" y="644">The most widely disseminated typeface of the 20th century</text></g>

  <g id="type-univers">
    <line x1="876" y1="220" x2="1216" y2="220" stroke="#1A1A1A" stroke-width="3" />
    <text x="876" y="252" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#666666" letter-spacing="2">CARD · 03</text>
    <text x="876" y="280" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Univers</text>
    <text x="876" y="304" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="14" fill="#666666">1957 · Adrian Frutiger</text>
    <text x="876" y="480" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="168" font-weight="400" fill="#1A1A1A" letter-spacing="1">Aa</text>
    <text x="876" y="500" font-family="Arial, sans-serif" font-size="10" fill="#999999" letter-spacing="2">REGULAR · 400 · LIGHT</text>
    <line x1="876" y1="528" x2="932" y2="528" stroke="#1A1A1A" stroke-width="1" />
    <text x="876" y="556" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1A1A1A">A Two-Dimensional Coordinate System of 21 Font Weights</text>
    <text x="876" y="578" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-weight="900" fill="#1A1A1A" textLength="98.0" lengthAdjust="spacingAndGlyphs">The Beginning of Type Engineering</text>
    <text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="876" y="608" textLength="143.0" lengthAdjust="spacingAndGlyphs">Univers 39—83 two-dimensional numbering</text><text font-size="8.73" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="876" y="626">Engineer “family + weight + width”</text><text font-size="8.40" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#666666" x="876" y="644">The ancestor of the modern type family structure</text></g>

  <g id="page-footer">
    <text x="1216" y="688" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" text-anchor="end" letter-spacing="1">07 / 14</text>
  </g>
</svg>
