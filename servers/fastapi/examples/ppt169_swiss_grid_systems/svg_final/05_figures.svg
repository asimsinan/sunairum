<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <text x="64" y="60" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" letter-spacing="2">P · 05</text>
    <text x="64" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="24.24" font-weight="900" fill="#1A1A1A">Eight shapers</text>
    <text x="64" y="148" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="14" fill="#666666" letter-spacing="2">EIGHT DESIGNERS WHO MADE THE SWISS STYLE</text>
    <line x1="64" y1="172" x2="120" y2="172" stroke="#D9251D" stroke-width="3" />
  </g>

  

  <g id="figure-keller">
    <text x="64" y="236" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">01</text>
    <text x="64" y="270" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Ernst Keller</text>
    <text x="64" y="290" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1891 — 1968</text>
    <line x1="64" y1="306" x2="120" y2="306" stroke="#1A1A1A" stroke-width="1" />
    <text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="336">Zurich School of Applied Arts</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="356">Taught from 1918</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="376" textLength="78.0" lengthAdjust="spacingAndGlyphs">Establishing the Swiss School</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="396" textLength="118.3" lengthAdjust="spacingAndGlyphs">"The principle that form follows content"</text></g>

  <g id="figure-ballmer">
    <text x="368" y="236" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">02</text>
    <text x="368" y="270" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Théo Ballmer</text>
    <text x="368" y="290" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1902 — 1965</text>
    <line x1="368" y1="306" x2="424" y2="306" stroke="#1A1A1A" stroke-width="1" />
    <text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="368" y="336" textLength="91.0" lengthAdjust="spacingAndGlyphs">Early experimenters with the grid</text><text font-size="9.35" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="368" y="356">Turn De Stijl geometry</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="368" y="376" textLength="78.0" lengthAdjust="spacingAndGlyphs">Introducing poster layout design</text><text font-size="9.85" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="368" y="396">Bridge figure</text></g>

  <g id="figure-bill">
    <text x="672" y="236" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">03</text>
    <text x="672" y="270" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Max Bill</text>
    <text x="672" y="290" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1908 — 1994</text>
    <line x1="672" y1="306" x2="728" y2="306" stroke="#1A1A1A" stroke-width="1" />
    <text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="336">Bauhaus student</text><text font-size="9.24" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="356">Ulm School of Design</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="376" textLength="52.0" lengthAdjust="spacingAndGlyphs">Founding president</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="396" textLength="91.0" lengthAdjust="spacingAndGlyphs">Rationality Extended to Products</text></g>

  <g id="figure-ruder">
    <text x="976" y="236" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">04</text>
    <text x="976" y="270" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Emil Ruder</text>
    <text x="976" y="290" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1914 — 1970</text>
    <line x1="976" y1="306" x2="1032" y2="306" stroke="#1A1A1A" stroke-width="1" />
    <text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="336" textLength="91.0" lengthAdjust="spacingAndGlyphs">Core of the Basel School</text><text font-size="9.11" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="356">Author of “Typographie”</text><text font-size="9.67" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="376">1967 to present</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="396" textLength="78.0" lengthAdjust="spacingAndGlyphs">The Bible of Type Design</text></g>

  <g id="figure-hofmann">
    <text x="64" y="476" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">05</text>
    <text x="64" y="510" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Armin Hofmann</text>
    <text x="64" y="530" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1920 — 2020</text>
    <line x1="64" y1="546" x2="120" y2="546" stroke="#1A1A1A" stroke-width="1" />
    <text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="576" textLength="91.0" lengthAdjust="spacingAndGlyphs">Core of the Basel School</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="596" textLength="65.0" lengthAdjust="spacingAndGlyphs">Posters and teaching</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="616" textLength="78.0" lengthAdjust="spacingAndGlyphs">the iconic figure of</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="64" y="636" textLength="91.0" lengthAdjust="spacingAndGlyphs">Its influence extended to Yale</text></g>

  <g id="figure-brockmann">
    <text x="368" y="476" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">06</text>
    <text x="368" y="510" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#D9251D">Müller-Brockmann</text>
    <text x="368" y="530" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1914 — 1996</text>
    <line x1="368" y1="546" x2="424" y2="546" stroke="#D9251D" stroke-width="2" />
    <text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="368" y="576" textLength="91.0" lengthAdjust="spacingAndGlyphs">Core of the Zurich School</text><text font-size="13" font-family="Arial, &quot;Georgia&quot;, sans-serif" fill="#1A1A1A" x="368" y="596">《Grid Systems in</text><text font-size="10.46" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="368" y="616">Author of Graphic Design》</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="368" y="636" textLength="78.0" lengthAdjust="spacingAndGlyphs">Detailed on the next page</text></g>

  <g id="figure-miedinger">
    <text x="672" y="476" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">07</text>
    <text x="672" y="510" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Max Miedinger</text>
    <text x="672" y="530" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1910 — 1980</text>
    <line x1="672" y1="546" x2="728" y2="546" stroke="#1A1A1A" stroke-width="1" />
    <text font-size="13" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="576">1957</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="596" textLength="104.8" lengthAdjust="spacingAndGlyphs">In collaboration with Hoffmann</text><text font-size="10.27" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="616">Designed Helvetica</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="672" y="636" textLength="78.0" lengthAdjust="spacingAndGlyphs">Named after Switzerland</text></g>

  <g id="figure-frutiger">
    <text x="976" y="476" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#D9251D" letter-spacing="2">08</text>
    <text x="976" y="510" font-family="&quot;Arial Black&quot;, &quot;Georgia&quot;, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">Adrian Frutiger</text>
    <text x="976" y="530" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="13" fill="#666666">1928 — 2015</text>
    <line x1="976" y1="546" x2="1032" y2="546" stroke="#1A1A1A" stroke-width="1" />
    <text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="576" textLength="58.9" lengthAdjust="spacingAndGlyphs">Same year, 1957</text><text font-size="9.83" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="596">Designed Univers</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="616" textLength="44.6" lengthAdjust="spacingAndGlyphs">21 Font Weights</text><text font-size="9.10" font-family="Georgia, &quot;Times New Roman&quot;, serif" fill="#1A1A1A" x="976" y="636" textLength="91.0" lengthAdjust="spacingAndGlyphs">The first systematic coordinate system</text></g>

  <g id="page-footer">
    <text x="1216" y="688" font-family="Arial, &quot;Georgia&quot;, sans-serif" font-size="11" fill="#999999" text-anchor="end" letter-spacing="1">05 / 14</text>
  </g>
</svg>
