<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect width="1280" height="720" fill="#0E1116" />
  </g>

  <g id="page-header">
    <text x="60" y="56" font-family="Cambria, serif" font-size="11" fill="#8A857E" letter-spacing="3">CLOSING · 20</text>
    <line x1="60" y1="72" x2="200" y2="72" stroke="#E63946" stroke-width="1" />
    <text x="60" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="bold" fill="#E8E6E1" textLength="229.2" lengthAdjust="spacingAndGlyphs">Six key judgments / <tspan fill="#E63946">Six Takeaways</tspan></text>
    <text x="60" y="152" font-family="Cambria, serif" font-size="14" font-style="italic" fill="#8A857E">Closing notes on 2026's global AI capital landscape</text>
  </g>

  <g id="take-1">
    <text x="60" y="220" font-family="Cambria, serif" font-size="40" font-weight="bold" fill="#E63946">①</text>
    <text x="120" y="216" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#E8E6E1">Capital concentration is the defining theme of 2026</text>
    <text x="120" y="240" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#8A857E">65% of global VC in a single quarter went to four companies—"The money didn’t grow; it just became more concentrated"</text>
    <line x1="60" y1="262" x2="620" y2="262" stroke="#2A2F36" stroke-width="1" />
  </g>

  <g id="take-2">
    <text x="60" y="312" font-family="Cambria, serif" font-size="40" font-weight="bold" fill="#E63946">②</text>
    <text x="120" y="308" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#E8E6E1" textLength="177.5" lengthAdjust="spacingAndGlyphs">Computing power is the hard currency of 2026</text>
    <text x="120" y="332" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#8A857E">Nvidia is both an infrastructure supplier and a major shareholder, creating a closed-loop structure across the industry</text>
    <line x1="60" y1="354" x2="620" y2="354" stroke="#2A2F36" stroke-width="1" />
  </g>

  <g id="take-3">
    <text x="60" y="404" font-family="Cambria, serif" font-size="40" font-weight="bold" fill="#E63946">③</text>
    <text x="120" y="400" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.72" font-weight="bold" fill="#E8E6E1">The next moat is electricity, not chips</text>
    <text x="120" y="424" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#8A857E">Of the $725B in Capex, 60%+ flows to power / cooling / civil infrastructure—the resource constraint has shifted</text>
    <line x1="60" y1="446" x2="620" y2="446" stroke="#2A2F36" stroke-width="1" />
  </g>

  <g id="take-4">
    <text x="660" y="220" font-family="Cambria, serif" font-size="40" font-weight="bold" fill="#F4A261">④</text>
    <text x="720" y="216" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#E8E6E1">The U.S.–China dual-track structure has taken shape</text>
    <text x="720" y="240" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#8A857E">The US delays IPOs to feed mega private equity firms; China's secondary market opens fully, and the divergence in paths is no longer reversible</text>
    <line x1="660" y1="262" x2="1220" y2="262" stroke="#2A2F36" stroke-width="1" />
  </g>

  <g id="take-5">
    <text x="660" y="312" font-family="Cambria, serif" font-size="40" font-weight="bold" fill="#F4A261">⑤</text>
    <text x="720" y="308" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#E8E6E1">Real ROI lags, but the giants haven't stopped the bleeding</text>
    <text x="720" y="332" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#8A857E">95% pilot failure vs. $725B capex continuing to rise—this is a bet on "future payoff"</text>
    <line x1="660" y1="354" x2="1220" y2="354" stroke="#2A2F36" stroke-width="1" />
  </g>

  <g id="take-6">
    <text x="660" y="404" font-family="Cambria, serif" font-size="40" font-weight="bold" fill="#F4A261">⑥</text>
    <text x="720" y="400" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.88" font-weight="bold" fill="#E8E6E1">Anthropic Overtakes OpenAI</text>
    <text x="720" y="424" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.24" fill="#8A857E">In talks: valuation $900B vs. $852B; Anthropic has surpassed OpenAI in ARR growth</text>
    <line x1="660" y1="446" x2="1220" y2="446" stroke="#2A2F36" stroke-width="1" />
  </g>

  <g id="bottom-callout">
    <rect x="60" y="490" width="1160" height="110" fill="#1A1F26" />
    <rect x="60" y="490" width="6" height="110" fill="#E63946" />
    <text x="100" y="525" font-family="Cambria, serif" font-size="11" fill="#E63946" letter-spacing="3">EDITORIAL CLOSE</text>
    <text x="100" y="565" font-family="Cambria, &quot;Georgia&quot;, serif" font-size="22" font-style="italic" fill="#E8E6E1">"This is not yet the bubble bursting.</text>
    <text x="100" y="590" font-family="Cambria, &quot;Georgia&quot;, serif" font-size="22" font-style="italic" fill="#E63946">It is the bubble compounding."</text>
  </g>

  <g id="sources-strip">
    <line x1="60" y1="630" x2="1220" y2="630" stroke="#2A2F36" stroke-width="1" />
    <text x="60" y="654" font-family="Cambria, serif" font-size="11" fill="#5C5852" letter-spacing="2">PRIMARY SOURCES</text>
    <text x="60" y="678" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#8A857E">Crunchbase · PitchBook · CNBC · Bloomberg · TechCrunch · OpenAI / Anthropic / xAI press · Tom's Hardware</text>
    <text x="60" y="696" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="11" fill="#8A857E">Goldman Sachs · Allianz · Statista · MIT GenAI Pilot Study · BigGo Finance · TechFundingNews · DataCenterDynamics</text>
    <text x="1220" y="696" text-anchor="end" font-family="Cambria, serif" font-size="10" fill="#5C5852">20 / 20 · End of briefing</text>
  </g>
</svg>
