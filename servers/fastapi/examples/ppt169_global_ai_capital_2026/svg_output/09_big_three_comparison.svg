<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect width="1280" height="720" fill="#0E1116" />
  </g>

  <g id="page-header">
    <text x="60" y="56" font-family="Cambria, serif" font-size="11" fill="#8A857E" letter-spacing="3">PART II · THE BIG THREE · 09</text>
    <line x1="60" y1="72" x2="200" y2="72" stroke="#E63946" stroke-width="1" />
    <text x="60" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="19.60" font-weight="bold" fill="#E8E6E1">Three growth curves / <tspan fill="#E63946">Three Growth Curves</tspan></text>
    <text x="60" y="152" font-family="Cambria, serif" font-size="14" font-style="italic" fill="#8A857E">OpenAI is the consumer machine. Anthropic is the enterprise machine. xAI is the merger machine.</text>
  </g>

  <g id="col-openai">
    <rect x="60" y="200" width="380" height="430" fill="#1A1F26" stroke="#2A2F36" stroke-width="1" />
    <rect x="60" y="200" width="380" height="6" fill="#E63946" />

    <use data-icon="simple-icons/openai" x="80" y="220" width="26" height="26" fill="#E8E6E1" />
    <text x="80" y="278" font-family="Cambria, &quot;Georgia&quot;, serif" font-size="26" font-weight="bold" fill="#E8E6E1">OpenAI</text>
    <text x="80" y="302" font-family="Cambria, serif" font-size="8.40" fill="#8A857E" letter-spacing="1" textLength="110.3" lengthAdjust="spacingAndGlyphs">Consumption-driven · IPO imminent</text>

    <line x1="80" y1="324" x2="420" y2="324" stroke="#2A2F36" stroke-width="1" />

    <text x="80" y="362" font-family="Cambria, serif" font-size="48" font-weight="bold" fill="#E63946">$852B</text>
    <text x="80" y="384" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="13" fill="#8A857E">Valuation @ 2026-03</text>

    <text x="80" y="430" font-family="Cambria, serif" font-size="24" font-weight="bold" fill="#E8E6E1">~$24B</text>
    <text x="80" y="450" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.78" fill="#8A857E">ARR · $2B/month</text>

    <text x="80" y="490" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="14" fill="#C9C5BE">
      <tspan x="80" dy="0">• <tspan fill="#E8E6E1" font-weight="bold">900 million</tspan> Weekly active users</tspan>
      <tspan x="80" dy="24">• Share of enterprise revenue <tspan fill="#E8E6E1" font-weight="bold">40%+</tspan></tspan>
      <tspan x="80" dy="24">• Q4 IPO target <tspan fill="#E63946" font-weight="bold">$1T</tspan></tspan>
    </text>

    <line x1="80" y1="595" x2="420" y2="595" stroke="#E63946" stroke-width="1" />
    <text x="80" y="618" font-family="Cambria, serif" font-size="12" font-style="italic" fill="#8A857E">"The consumer giant turning enterprise."</text>
  </g>

  <g id="col-anthropic">
    <rect x="450" y="200" width="380" height="430" fill="#1A1F26" stroke="#2A2F36" stroke-width="1" />
    <rect x="450" y="200" width="380" height="6" fill="#F4A261" />

    <use data-icon="simple-icons/anthropic" x="470" y="220" width="26" height="26" fill="#E8E6E1" />
    <text x="470" y="278" font-family="Cambria, &quot;Georgia&quot;, serif" font-size="26" font-weight="bold" fill="#E8E6E1">Anthropic</text>
    <text x="470" y="302" font-family="Cambria, serif" font-size="8.40" fill="#8A857E" letter-spacing="1" textLength="110.5" lengthAdjust="spacingAndGlyphs">Enterprise-driven · Valuation overtakes</text>

    <line x1="470" y1="324" x2="810" y2="324" stroke="#2A2F36" stroke-width="1" />

    <text x="470" y="362" font-family="Cambria, serif" font-size="48" font-weight="bold" fill="#F4A261">$380B</text>
    <text x="470" y="384" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#8A857E">Series G · $900B in Negotiations</text>

    <text x="470" y="430" font-family="Cambria, serif" font-size="24" font-weight="bold" fill="#E8E6E1">$30B+</text>
    <text x="470" y="450" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#8A857E">ARR · Fastest Historical Ramp</text>

    <text x="470" y="490" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="14" fill="#C9C5BE">
      <tspan x="470" dy="0">• 2025 → early 2026: $9B → $30B</tspan>
      <tspan x="470" dy="24">• Google's cumulative commitments <tspan fill="#E8E6E1" font-weight="bold">$40B</tspan></tspan>
      <tspan x="470" dy="24">• <tspan fill="#E63946" font-weight="bold">Valuation in talks has surpassed OpenAI’s</tspan></tspan>
    </text>

    <line x1="470" y1="595" x2="810" y2="595" stroke="#F4A261" stroke-width="1" />
    <text x="470" y="618" font-family="Cambria, serif" font-size="12" font-style="italic" fill="#8A857E">"The enterprise stack ascending."</text>
  </g>

  <g id="col-xai">
    <rect x="840" y="200" width="380" height="430" fill="#1A1F26" stroke="#2A2F36" stroke-width="1" />
    <rect x="840" y="200" width="380" height="6" fill="#C9C5BE" />

    <text x="860" y="244" font-family="Cambria, &quot;Georgia&quot;, serif" font-size="22" font-weight="bold" fill="#E8E6E1">xAI</text>
    <text x="860" y="278" font-family="Cambria, &quot;Georgia&quot;, serif" font-size="26" font-weight="bold" fill="#E8E6E1">+ SpaceX</text>
    <text x="860" y="302" font-family="Cambria, serif" font-size="8.40" fill="#8A857E" letter-spacing="1">Merged narrative · synergies</text>

    <line x1="860" y1="324" x2="1200" y2="324" stroke="#2A2F36" stroke-width="1" />

    <text x="860" y="362" font-family="Cambria, serif" font-size="48" font-weight="bold" fill="#C9C5BE">$1.25T</text>
    <text x="860" y="384" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#8A857E" textLength="165.2" lengthAdjust="spacingAndGlyphs">Valuation of the combined entity (xAI: $230B)</text>

    <text x="860" y="430" font-family="Cambria, serif" font-size="24" font-weight="bold" fill="#E8E6E1">~$5B</text>
    <text x="860" y="450" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.58" fill="#8A857E">ARR Estimates (X / Grok)</text>

    <text x="860" y="490" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="14" fill="#C9C5BE">
      <tspan x="860" dy="0">• Jan 2026: $15B → oversubscribed at $20B</tspan>
      <tspan x="860" dy="24">• Tesla investment <tspan fill="#E8E6E1" font-weight="bold">$2B</tspan></tspan>
      <tspan x="860" dy="24">• Merged with SpaceX in Feb <tspan fill="#E63946" font-weight="bold">IPO groundwork</tspan></tspan>
    </text>

    <line x1="860" y1="595" x2="1200" y2="595" stroke="#C9C5BE" stroke-width="1" />
    <text x="860" y="618" font-family="Cambria, serif" font-size="12" font-style="italic" fill="#8A857E">"Musk's vertically-integrated bet."</text>
  </g>

  <g id="bottom-summary">
    <line x1="60" y1="650" x2="1220" y2="650" stroke="#2A2F36" stroke-width="1" />
    <text x="640" y="680" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" font-style="italic" fill="#E8E6E1" textLength="101.3" lengthAdjust="spacingAndGlyphs">Combined valuation of the three companies <tspan fill="#E63946" font-weight="bold">$2.48T</tspan> — Exceeding Apple’s Market Capitalization During the Same Period <tspan font-weight="bold">2/3</tspan>。</text>
  </g>

  <g id="page-footer">
    <text x="60" y="710" font-family="&quot;Georgia&quot;, Arial, sans-serif" font-size="10" fill="#5C5852">Sources: company press releases · Bloomberg · CNBC · TechCrunch · Fortune Q1 2026</text>
    <text x="1220" y="710" text-anchor="end" font-family="Cambria, serif" font-size="10" fill="#5C5852">09 / 20</text>
  </g>
</svg>
