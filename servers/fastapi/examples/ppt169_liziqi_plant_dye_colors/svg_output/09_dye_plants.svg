    <rect x="0" y="90" width="270" height="10" fill="#C99E62" />
    <circle cx="40" cy="50" r="26" fill="#FFFFFF" fill-opacity="0.2" />
    <use data-icon="tabler-filled/sparkles" x="24" y="34" width="32" height="32" fill="#FFFFFF" />
    <text x="88" y="44" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" font-weight="bold" fill="#FFFFFF" letter-spacing="6" textLength="30.0" lengthAdjust="spacingAndGlyphs">Yellow</text>
    <text x="88" y="72" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.15" fill="#FFFFFF" letter-spacing="3">A noble color · YELLOW</text>

    <g transform="translate(24,140)">
      <circle cx="6" cy="10" r="4" fill="#C99E62" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="93.8" lengthAdjust="spacingAndGlyphs">Sophora japonica · Flower buds</text>
    </g>
    <text x="44" y="188" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Gentleman's Yellow · Elegant and Soft</text>

    <g transform="translate(24,220)">
      <circle cx="6" cy="10" r="4" fill="#C99E62" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold">Gardenia · Fruit</text>
    </g>
    <text x="44" y="268" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">Dyeing golden yellow · Used for both food and textiles in ancient times</text>

    <g transform="translate(24,300)">
      <circle cx="6" cy="10" r="4" fill="#C99E62" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="93.8" lengthAdjust="spacingAndGlyphs">Turmeric · Rhizome</text>
    </g>
    <text x="44" y="348" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">Rich, deep tones · A commonly used color in Hanfu</text>
  </g>

