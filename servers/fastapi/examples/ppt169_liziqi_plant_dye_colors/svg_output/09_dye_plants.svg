    <text x="44" y="348" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Dyeing silver red · Paired with cinnabar</text>
  </g>

