<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topOverlay09" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F2E8" stop-opacity="0" />
      <stop offset="100%" stop-color="#F7F2E8" stop-opacity="0.95" />
    </linearGradient>
    <filter id="cardShadow09" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope="0.15" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F7F2E8" />

  <g id="top-banner">
    <image href="../images/640_14.png" x="0" y="0" width="1280" height="200" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="200" fill="url(#topOverlay09)" />
  </g>

  <g id="header">
    <text x="60" y="45" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.01" fill="#EDE5D3" letter-spacing="3">CHAPTER 04 · Botanicals as Dye</text>
    <line x1="60" y1="57" x2="220" y2="57" stroke="#C99E62" stroke-width="2" />
  </g>

  <g id="title-overlay">
    <text x="60" y="148" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26.60" font-weight="bold" fill="#3A3530" letter-spacing="3">Dye plants · All four colors derived from vegetation</text>
    <text x="60" y="178" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#7A7068" letter-spacing="2">Flowers, fruits, leaves, and stems can all be used for dyeing · Festive · Noble · Elegant · Mysterious</text>
  </g>

  <g id="card-red" transform="translate(60,240)" filter="url(#cardShadow09)">
    <rect x="0" y="0" width="270" height="380" rx="10" fill="#FFFFFF" />
    <rect x="0" y="0" width="270" height="100" rx="10" fill="#B04A5C" />
    <rect x="0" y="90" width="270" height="10" fill="#B04A5C" />
    <circle cx="40" cy="50" r="26" fill="#FFFFFF" fill-opacity="0.2" />
    <use data-icon="tabler-filled/flower" x="24" y="34" width="32" height="32" fill="#FFFFFF" />
    <text x="88" y="44" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" font-weight="bold" fill="#FFFFFF" letter-spacing="6">Red</text>
    <text x="88" y="72" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.54" fill="#FFFFFF" letter-spacing="3">A Festive Hue · RED</text>

    <g transform="translate(24,140)">
      <circle cx="6" cy="10" r="4" fill="#B04A5C" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.56" fill="#3A3530" font-weight="bold">Madder · Roots</text>
    </g>
    <text x="44" y="188" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Traditional red dyeing · the classic</text>

    <g transform="translate(24,220)">
      <circle cx="6" cy="10" r="4" fill="#B04A5C" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="93.8" lengthAdjust="spacingAndGlyphs">Sappanwood · Stems</text>
    </g>
    <text x="44" y="268" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Rich hues · Red to reddish purple</text>

    <g transform="translate(24,300)">
      <circle cx="6" cy="10" r="4" fill="#B04A5C" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="93.8" lengthAdjust="spacingAndGlyphs">Safflower · petals</text>
