    <rect x="0" y="0" width="290" height="380" rx="10" fill="#FFFFFF" />
    <rect x="0" y="0" width="290" height="100" rx="10" fill="#3A3530" />
    <rect x="0" y="90" width="290" height="10" fill="#3A3530" />
    <circle cx="40" cy="50" r="26" fill="#FFFFFF" fill-opacity="0.2" />
    <use data-icon="tabler-filled/leaf" x="24" y="34" width="32" height="32" fill="#FFFFFF" />
    <text x="88" y="44" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" font-weight="bold" fill="#FFFFFF" letter-spacing="6" textLength="30.0" lengthAdjust="spacingAndGlyphs">Black</text>
    <text x="88" y="72" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#FFFFFF" letter-spacing="3" textLength="111.4" lengthAdjust="spacingAndGlyphs">The Color of Mystery · BLACK</text>

    <g transform="translate(24,140)">
      <circle cx="6" cy="10" r="4" fill="#3A3530" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.56" fill="#3A3530" font-weight="bold">Walnut · Shell</text>
    </g>
    <text x="44" y="188" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Deep ink black · Durable and fade-resistant</text>

    <g transform="translate(24,220)">
      <circle cx="6" cy="10" r="4" fill="#3A3530" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold">Chestnut · Shell</text>
    </g>
    <text x="44" y="268" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">Black with brown undertones · simple and weighty</text>

    <g transform="translate(24,300)">
      <circle cx="6" cy="10" r="4" fill="#3A3530" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="72.0" lengthAdjust="spacingAndGlyphs">Iron-vitriol mordant dyeing</text>
    </g>
    <text x="44" y="348" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="168.2" lengthAdjust="spacingAndGlyphs">Use together · For darker, more durable dyeing</text>
  </g>

  <g id="bottom-strip" transform="translate(60,660)">
    <rect x="0" y="0" width="1160" height="32" rx="16" fill="#EDE5D3" />
    <text x="30" y="21" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">Madder · Sappanwood · Safflower · Sophora Flowers · Gardenia · Turmeric · Indigo · Walnut · Chestnut …… All Used by the Ancients</text>
    <text x="1130" y="21" text-anchor="end" font-family="Georgia, Georgia, Georgia, serif" font-size="13" fill="#9B948B">09 / 12</text>
  </g>
