    <rect x="0" y="0" width="270" height="380" rx="10" fill="#FFFFFF" />
    <rect x="0" y="0" width="270" height="100" rx="10" fill="#6B9AAE" />
    <rect x="0" y="90" width="270" height="10" fill="#6B9AAE" />
    <circle cx="40" cy="50" r="26" fill="#FFFFFF" fill-opacity="0.2" />
    <use data-icon="tabler-filled/droplet" x="24" y="34" width="32" height="32" fill="#FFFFFF" />
    <text x="88" y="44" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" font-weight="bold" fill="#FFFFFF" letter-spacing="6" textLength="30.0" lengthAdjust="spacingAndGlyphs">Blue</text>
    <text x="88" y="72" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#FFFFFF" letter-spacing="3">An elegant color · BLUE</text>

    <g transform="translate(24,140)">
      <circle cx="6" cy="10" r="4" fill="#6B9AAE" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="93.8" lengthAdjust="spacingAndGlyphs">Indigo Plants · Whole Plant</text>
    </g>
    <text x="44" y="188" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Blue from indigo · Source: natural indigo</text>

    <g transform="translate(24,220)">
      <circle cx="6" cy="10" r="4" fill="#6B9AAE" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="93.8" lengthAdjust="spacingAndGlyphs">Buckthorn · Leaf stems</text>
    </g>
    <text x="44" y="268" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Quiet tones · Pale blue and pale cyan</text>

    <g transform="translate(24,300)">
      <circle cx="6" cy="10" r="4" fill="#6B9AAE" />
      <text x="20" y="15" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="90.0" lengthAdjust="spacingAndGlyphs">Ming–Qing Indigo Workshop</text>
    </g>
    <text x="44" y="348" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">Dedicated to indigo dyeing · State-operated at industrial scale</text>
  </g>

