<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="stepGrad10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99E62" />
      <stop offset="50%" stop-color="#6B9AAE" />
      <stop offset="100%" stop-color="#6F8F75" />
    </linearGradient>
    <filter id="imgShadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope="0.2" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F7F2E8" />

  <g id="header">
    <text x="60" y="50" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9B948B" letter-spacing="3">CHAPTER 04 · Hands-On Plant Dyeing</text>
    <line x1="60" y1="62" x2="290" y2="62" stroke="#C99E62" stroke-width="2" />
    <text x="60" y="108" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26.60" font-weight="bold" fill="#3A3530" letter-spacing="3" textLength="388.0" lengthAdjust="spacingAndGlyphs">Self-healing · Dialogues with nature</text>
    <text x="60" y="140" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.50" fill="#7A7068" letter-spacing="2">Basic plant dyeing is not complicated · Try dyeing at home</text>
  </g>

  <g id="left-image" transform="translate(60,180)">
    <rect x="-6" y="-6" width="372" height="372" fill="#EDE5D3" stroke="#C99E62" stroke-width="1" />
    <image href="../images/640_15.png" x="0" y="0" width="360" height="360" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow10)" />
    <rect x="-6" y="360" width="372" height="36" fill="#3A3530" />
    <text x="180" y="384" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#F7F2E8" letter-spacing="2" textLength="154.0" lengthAdjust="spacingAndGlyphs">Time has distilled a natural, unadorned beauty</text>
  </g>

  <g id="right-steps" transform="translate(480,190)">

    <g transform="translate(0,0)">
      <circle cx="30" cy="30" r="26" fill="#FFFFFF" stroke="#C99E62" stroke-width="3" />
      <text x="30" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#C99E62">01</text>
      <text x="76" y="28" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#3A3530" font-weight="bold" textLength="88.0" lengthAdjust="spacingAndGlyphs">Boil a pot of water</text>
      <text x="76" y="52" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068">Add fresh water to the pot · Bring to a boil and set aside</text>
    </g>
    <line x1="30" y1="62" x2="30" y2="88" stroke="#D7CEB9" stroke-width="2" stroke-dasharray="3,3" />

    <g transform="translate(0,90)">
      <circle cx="30" cy="30" r="26" fill="#FFFFFF" stroke="#6B9AAE" stroke-width="3" />
      <text x="30" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#6B9AAE">02</text>
      <text x="76" y="28" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22" fill="#3A3530" font-weight="bold">Add dye</text>
      <text x="76" y="52" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068">Plant dyes added to the pot · Blending with water</text>
    </g>
    <line x1="30" y1="152" x2="30" y2="178" stroke="#D7CEB9" stroke-width="2" stroke-dasharray="3,3" />

    <g transform="translate(0,180)">
      <circle cx="30" cy="30" r="26" fill="#FFFFFF" stroke="#6F8F75" stroke-width="3" />
      <text x="30" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#6F8F75">03</text>
      <text x="76" y="28" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#3A3530" font-weight="bold" textLength="88.0" lengthAdjust="spacingAndGlyphs">Brew the dye bath</text>
      <text x="76" y="52" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068" textLength="179.0" lengthAdjust="spacingAndGlyphs">1–2 hours · filter out a clear dye solution</text>
    </g>
    <line x1="30" y1="242" x2="30" y2="268" stroke="#D7CEB9" stroke-width="2" stroke-dasharray="3,3" />

    <g transform="translate(0,270)">
      <circle cx="30" cy="30" r="26" fill="#FFFFFF" stroke="#B04A5C" stroke-width="3" />
      <text x="30" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#B04A5C">04</text>
      <text x="76" y="28" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#3A3530" font-weight="bold" textLength="88.0" lengthAdjust="spacingAndGlyphs">Fabric immersed</text>
      <text x="76" y="52" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068">Fabric enters the dye bath · absorbing the color</text>
    </g>
    <line x1="30" y1="332" x2="30" y2="358" stroke="#D7CEB9" stroke-width="2" stroke-dasharray="3,3" />

    <g transform="translate(0,360)">
      <circle cx="30" cy="30" r="26" fill="#FFFFFF" stroke="#C99E62" stroke-width="3" />
      <text x="30" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#C99E62">05</text>
      <text x="76" y="28" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#3A3530" font-weight="bold" textLength="88.0" lengthAdjust="spacingAndGlyphs">Sunlight color setting</text>
      <text x="76" y="52" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068">Sun-warmth sets the color · Let time settle simplicity</text>
    </g>
  </g>

  <g id="side-technique" transform="translate(880,190)">
    <rect x="0" y="0" width="340" height="440" rx="12" fill="#EDE5D3" />
    <text x="170" y="40" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="bold" fill="#3A3530" textLength="136.6" lengthAdjust="spacingAndGlyphs">Advanced · Layering colors</text>
    <line x1="50" y1="60" x2="290" y2="60" stroke="#C99E62" stroke-width="1" />

    <g transform="translate(30,90)">
      <use data-icon="tabler-filled/paint" x="0" y="0" width="24" height="24" fill="#6B9AAE" />
      <text x="36" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="36.0" lengthAdjust="spacingAndGlyphs">Mordant</text>
      <text x="36" y="42" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="126.3" lengthAdjust="spacingAndGlyphs">Alum / Green Vitriol / Blue Vitriol</text>
    </g>

    <g transform="translate(30,160)">
      <use data-icon="tabler-filled/sparkles" x="0" y="0" width="24" height="24" fill="#C99E62" />
      <text x="36" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="36.0" lengthAdjust="spacingAndGlyphs">Repeated dyeing</text>
      <text x="36" y="42" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Multiple dye baths · Deeper color</text>
    </g>

    <g transform="translate(30,230)">
      <use data-icon="tabler-filled/droplet" x="0" y="0" width="24" height="24" fill="#6F8F75" />
      <text x="36" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="72.0" lengthAdjust="spacingAndGlyphs">Oxidation–reduction</text>
      <text x="36" y="42" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="105.0" lengthAdjust="spacingAndGlyphs">The Key to Indigo Dyeing</text>
    </g>

    <g transform="translate(30,300)">
      <use data-icon="tabler-filled/palette" x="0" y="0" width="24" height="24" fill="#B04A5C" />
      <text x="36" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" font-weight="bold" textLength="36.0" lengthAdjust="spacingAndGlyphs">Overdyeing</text>
      <text x="36" y="42" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="138.2" lengthAdjust="spacingAndGlyphs">Two-color overlays · Endless variations</text>
    </g>

    <rect x="30" y="360" width="280" height="60" rx="6" fill="#FFFFFF" />
    <text x="170" y="385" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.66" fill="#7A7068">Every dyeing · one of a kind</text>
    <text x="170" y="407" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9B948B" font-style="italic">Imperfect “flaws” · all expressions of authenticity</text>
  </g>

  <g id="bottom-quote" transform="translate(60,650)">
    <use data-icon="tabler-filled/heart" x="0" y="0" width="26" height="26" fill="#B04A5C" />
    <text x="38" y="20" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.78" fill="#3A3530" font-style="italic">Tension and anxiety · gradually fading away — in the process, you can see a quiet, carefree self.</text>
    <text x="1160" y="20" text-anchor="end" font-family="Georgia, Georgia, Georgia, serif" font-size="13" fill="#9B948B">10 / 12</text>
  </g>
</svg>
