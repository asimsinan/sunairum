<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="imgShadow08" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope="0.2" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F7F2E8" />

  <g id="header">
    <text x="60" y="50" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.00" fill="#9B948B" letter-spacing="3">CHAPTER 03 · Poetic Hues (Part 2)</text>
    <line x1="60" y1="62" x2="290" y2="62" stroke="#C99E62" stroke-width="2" />
    <text x="60" y="108" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26.60" font-weight="bold" fill="#3A3530" letter-spacing="3">Brows painted deep blue · Longing reduced to ashes</text>
    <text x="60" y="140" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#7A7068" letter-spacing="2">An inch of longing, an inch of ash · A stroke of indigo reflecting the spring mountains</text>
  </g>

  <line x1="640" y1="180" x2="640" y2="660" stroke="#D7CEB9" stroke-width="1" stroke-dasharray="4,4" />

  <g id="color-daiqing" transform="translate(60,180)">
    <g transform="translate(0,0)">
      <rect x="-4" y="-4" width="288" height="208" fill="#EDE5D3" stroke="#3D4A5A" stroke-width="1" />
      <image href="../images/640_12.png" x="0" y="0" width="280" height="200" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow08)" />
      <text x="140" y="220" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" textLength="93.7" lengthAdjust="spacingAndGlyphs">Dark indigo · Deep eyebrow color</text>
    </g>

    <g transform="translate(310,0)">
      <rect x="0" y="0" width="260" height="200" rx="4" fill="#3D4A5A" />
      <rect x="10" y="10" width="240" height="180" fill="none" stroke="#F7F2E8" stroke-width="1" stroke-opacity="0.6" />
      <text x="130" y="80" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="39.20" font-weight="bold" fill="#F7F2E8" letter-spacing="4" textLength="112.0" lengthAdjust="spacingAndGlyphs">Dark indigo</text>
      <text x="130" y="130" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#F7F2E8" letter-spacing="2" textLength="64.0" lengthAdjust="spacingAndGlyphs">Indigo Plant Extract</text>
      <text x="130" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#F7F2E8" letter-spacing="3">#3D4A5A</text>
    </g>

    <g transform="translate(0,260)">
      <use data-icon="tabler-filled/quote" x="0" y="0" width="24" height="24" fill="#3D4A5A" />
      <text x="34" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">Browns darkened with jade-black pigment · a lotus-like face blooming with spring</text>
      <text x="34" y="46" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">Beauty That Could Topple a Kingdom and Captivate a City · Cui Yingying’s Beauty</text>
      <text x="34" y="74" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#9B948B" font-style="italic">— Yuan · Wang Shifu’s Romance of the Western Chamber</text>
    </g>

    <g transform="translate(0,370)">
      <rect x="0" y="0" width="570" height="78" rx="6" fill="#EDE5D3" />
      <g transform="translate(20,20)">
        <use data-icon="tabler-filled/leaf" x="0" y="0" width="20" height="20" fill="#3D4A5A" />
        <text x="30" y="16" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A3530" font-weight="bold">Dyes · Blue from indigo</text>
      </g>
      <text x="20" y="64" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068" letter-spacing="1">Extracted from indigo plants, qingdai was a color commonly used by women in ancient China to paint their eyebrows.</text>
    </g>
  </g>

  <g id="color-xiangsi" transform="translate(670,180)">
    <g transform="translate(0,0)">
      <rect x="-4" y="-4" width="288" height="208" fill="#EDE5D3" stroke="#A69E98" stroke-width="1" />
      <image href="../images/640_13.png" x="0" y="0" width="280" height="200" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow08)" />
      <text x="140" y="220" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" textLength="106.7" lengthAdjust="spacingAndGlyphs">Lovesickness gray · color of imagination</text>
    </g>

    <g transform="translate(310,0)">
      <rect x="0" y="0" width="240" height="200" rx="4" fill="#A69E98" />
      <rect x="10" y="10" width="220" height="180" fill="none" stroke="#F7F2E8" stroke-width="1" stroke-opacity="0.6" />
      <text x="120" y="80" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="33.60" font-weight="bold" fill="#F7F2E8" letter-spacing="4" textLength="96.0" lengthAdjust="spacingAndGlyphs">Lovesickness</text>
      <text x="120" y="128" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="33.60" font-weight="bold" fill="#F7F2E8" letter-spacing="4" textLength="48.0" lengthAdjust="spacingAndGlyphs">Gray</text>
      <text x="120" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#F7F2E8" letter-spacing="3">#A69E98</text>
    </g>

    <g transform="translate(0,260)">
      <use data-icon="tabler-filled/heart" x="0" y="0" width="24" height="24" fill="#B04A5C" />
      <text x="34" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">Let not the spring heart vie with flowers in bloom</text>
      <text x="34" y="46" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold" textLength="133.0" lengthAdjust="spacingAndGlyphs">An inch of longing, an inch of ash</text>
      <text x="34" y="74" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#9B948B" font-style="italic">— Tang · Li Shangyin · Coined the name for lovesick gray</text>
    </g>

    <g transform="translate(0,370)">
      <rect x="0" y="0" width="550" height="78" rx="6" fill="#EDE5D3" />
      <g transform="translate(20,20)">
        <use data-icon="tabler-filled/palette" x="0" y="0" width="20" height="20" fill="#7A7068" />
        <text x="30" y="16" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A3530" font-weight="bold" textLength="122.6" lengthAdjust="spacingAndGlyphs">Recipe · Dye to light gray</text>
      </g>
      <text x="20" y="64" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068" letter-spacing="1">Tea leaves / pomegranate peel as the dye, with a small amount of ferrous sulfate as the mordant</text>
    </g>
  </g>

  <g id="bottom-strip" transform="translate(60,660)">
    <rect x="0" y="0" width="1160" height="32" rx="16" fill="#EDE5D3" />
    <text x="30" y="21" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">If Colors Have Feelings · Lovesickness Gray Feels the Deepest</text>
    <text x="1130" y="21" text-anchor="end" font-family="Georgia, Georgia, Georgia, serif" font-size="13" fill="#9B948B">08 / 12</text>
  </g>
</svg>
