<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentBar11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99E62" />
      <stop offset="100%" stop-color="#E49AA5" />
    </linearGradient>
    <filter id="imgShadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="0" dy="4" />
      <feComponentTransfer><feFuncA type="linear" slope="0.22" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F7F2E8" />

  <g id="header">
    <text x="60" y="50" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9B948B" letter-spacing="3" textLength="160.9" lengthAdjust="spacingAndGlyphs">CHAPTER 04 · Recreating Refined Elegance</text>
    <line x1="60" y1="62" x2="290" y2="62" stroke="#C99E62" stroke-width="2" />
    <text x="60" y="108" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="28.00" font-weight="bold" fill="#3A3530" letter-spacing="3">Xue Tao Paper · A Thousand Years of Elegance, Recreated</text>
    <rect x="60" y="120" width="120" height="3" fill="url(#accentBar11)" />
    <text x="60" y="156" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#7A7068" letter-spacing="2">A hibiscus-red sheet of paper · Its spirit endures for a thousand years</text>
  </g>

  <g id="left-image" transform="translate(60,190)">
    <rect x="-6" y="-6" width="392" height="392" fill="#EDE5D3" stroke="#C99E62" stroke-width="1" />
    <image href="../images/640_17.png" x="0" y="0" width="380" height="380" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow11)" />
    <rect x="-6" y="380" width="392" height="30" fill="#3A3530" />
    <text x="190" y="400" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#F7F2E8" letter-spacing="2">The Dream of Splendor · The imagery of Xue Tao stationery</text>
  </g>

  <g id="middle-content" transform="translate(500,190)">
    <rect x="0" y="0" width="440" height="400" rx="12" fill="#FFFFFF" stroke="#D7CEB9" stroke-width="1" />

    <g transform="translate(30,30)">
      <use data-icon="tabler-filled/flower" x="0" y="0" width="28" height="28" fill="#E49AA5" />
      <text x="42" y="22" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="bold" fill="#3A3530" textLength="202.6" lengthAdjust="spacingAndGlyphs">Furong Red · Handmade by Tang Cai'nü</text>
    </g>

    <line x1="30" y1="80" x2="410" y2="80" stroke="#D7CEB9" stroke-width="1" />

    <text x="30" y="118" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" letter-spacing="1">Legend has it that the Tang-dynasty poet Xue Tao</text>
    <text x="30" y="150" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" letter-spacing="1" textLength="144.0" lengthAdjust="spacingAndGlyphs">Drawing on the waters of Huanhua Creek</text>
    <text x="30" y="182" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" letter-spacing="1" textLength="162.0" lengthAdjust="spacingAndGlyphs">Derived from cotton rose bark and flowers</text>
    <text x="30" y="214" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530" letter-spacing="1" textLength="153.9" lengthAdjust="spacingAndGlyphs">Pound it into pulp, dye it into letter paper</text>

    <g transform="translate(30,240)">
      <rect x="0" y="0" width="380" height="70" rx="6" fill="#EDE5D3" />
      <text x="20" y="28" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A3530" font-weight="bold">Juice squeezed from fresh flowers can be used as dye</text>
      <text x="20" y="54" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068">Small-scale and labor-intensive · For experiential use only</text>
    </g>

    <g transform="translate(30,325)">
      <use data-icon="tabler-filled/sparkles" x="0" y="0" width="22" height="22" fill="#B04A5C" />
      <text x="34" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#B04A5C" font-weight="bold" textLength="119.0" lengthAdjust="spacingAndGlyphs">Recommended Huang Ronghua reproductions</text>
      <text x="0" y="54" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.92" fill="#7A7068">Sappanwood dye · Alum mordant · Best results</text>
    </g>
  </g>

  <g id="right-image" transform="translate(980,190)">
    <rect x="-6" y="-6" width="252" height="192" fill="#EDE5D3" stroke="#E49AA5" stroke-width="1" />
    <image href="../images/640_18.png" x="0" y="0" width="240" height="180" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow11)" />
    <text x="120" y="210" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" textLength="119.7" lengthAdjust="spacingAndGlyphs">Furong Red Letter Paper · Reproduced Edition</text>

    <g transform="translate(0,240)">
      <rect x="0" y="0" width="240" height="160" rx="8" fill="#EDE5D3" />
      <text x="120" y="32" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#3A3530" textLength="90.0" lengthAdjust="spacingAndGlyphs">Uncontrollable beauty.</text>
      <line x1="50" y1="48" x2="190" y2="48" stroke="#C99E62" stroke-width="1" />
      <text x="20" y="78" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">Handcrafted effects with varying depths and tones</text>
      <text x="20" y="102" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="136.5" lengthAdjust="spacingAndGlyphs">A few “imperfections,” every time</text>
      <text x="20" y="126" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068" textLength="75.0" lengthAdjust="spacingAndGlyphs">Each one is unique</text>
      <text x="120" y="150" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#B04A5C" font-style="italic" textLength="117.0" lengthAdjust="spacingAndGlyphs">Beyond the reach of industrial dyeing methods</text>
    </g>
  </g>

  <g id="bottom-card" transform="translate(60,620)">
    <rect x="0" y="0" width="1160" height="60" rx="30" fill="#3A3530" />
    <use data-icon="tabler-filled/book" x="30" y="18" width="24" height="24" fill="#C99E62" />
    <text x="70" y="38" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#F7F2E8" letter-spacing="2">From the colors of plants created by heaven and earth · to the splendor of silk unfolding across millennia · traditional Chinese colors are a window into Eastern aesthetics</text>
    <text x="1130" y="38" text-anchor="end" font-family="Georgia, Georgia, Georgia, serif" font-size="13" fill="#9B948B">11 / 12</text>
  </g>
</svg>
