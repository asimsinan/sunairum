<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="imgShadow06" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope="0.2" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F7F2E8" />

  <g id="header">
    <text x="60" y="50" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.01" fill="#9B948B" letter-spacing="3">CHAPTER 02 · Botanical Hues (Part 2)</text>
    <line x1="60" y1="62" x2="290" y2="62" stroke="#C99E62" stroke-width="2" />
    <text x="60" y="108" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26.60" font-weight="bold" fill="#3A3530" letter-spacing="3" textLength="350.0" lengthAdjust="spacingAndGlyphs">Dusk clouds · dew-tinted blue-green</text>
    <text x="60" y="140" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#7A7068" letter-spacing="2">A ray of sunset · Overnight dew · All can inspire a color name</text>
  </g>

  <line x1="640" y1="180" x2="640" y2="660" stroke="#D7CEB9" stroke-width="1" stroke-dasharray="4,4" />

  <g id="color-muyun" transform="translate(60,180)">
    <g transform="translate(0,0)">
      <rect x="-4" y="-4" width="288" height="208" fill="#EDE5D3" stroke="#7D6E74" stroke-width="1" />
      <image href="../images/640_7.png" x="0" y="0" width="280" height="200" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow06)" />
      <text x="140" y="220" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B">Twilight Cloud Gray · Gray with dark purple-red undertones</text>
    </g>

    <g transform="translate(310,0)">
      <rect x="0" y="0" width="260" height="200" rx="4" fill="#7D6E74" />
      <rect x="10" y="10" width="240" height="180" fill="none" stroke="#F7F2E8" stroke-width="1" stroke-opacity="0.6" />
      <text x="130" y="78" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="bold" fill="#F7F2E8" letter-spacing="6" textLength="88.0" lengthAdjust="spacingAndGlyphs">Twilight clouds</text>
      <text x="130" y="128" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="bold" fill="#F7F2E8" letter-spacing="6" textLength="44.0" lengthAdjust="spacingAndGlyphs">Gray</text>
      <text x="130" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#F7F2E8" letter-spacing="3">#7D6E74</text>
    </g>

    <g transform="translate(0,260)">
      <use data-icon="tabler-filled/moon" x="0" y="0" width="24" height="24" fill="#7D6E74" />
      <text x="34" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold" textLength="175.0" lengthAdjust="spacingAndGlyphs">Sunset Melting Gold · Evening Clouds in Harmony</text>
      <text x="34" y="46" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">Misty waters stretching for miles · Thick dusk settling in</text>
      <text x="34" y="74" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#9B948B" font-style="italic">— Li Qingzhao · Liu Yong · Writing the Emotions of Twilight and Clouds</text>
    </g>

    <g transform="translate(0,370)">
      <rect x="0" y="0" width="570" height="78" rx="6" fill="#EDE5D3" />
      <g transform="translate(20,20)">
        <use data-icon="tabler-filled/palette" x="0" y="0" width="20" height="20" fill="#7D6E74" />
        <text x="30" y="16" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A3530" font-weight="bold" textLength="122.6" lengthAdjust="spacingAndGlyphs">Recipe · One-step dyeing</text>
      </g>
      <text x="20" y="64" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068" letter-spacing="1">Sappanwood as the dye, with copper sulfate and a small amount of ferrous sulfate as mordants</text>
    </g>
  </g>

  <g id="color-tianshui" transform="translate(670,180)">
    <g transform="translate(0,0)">
      <rect x="-4" y="-4" width="288" height="208" fill="#EDE5D3" stroke="#8FB09A" stroke-width="1" />
      <image href="../images/640_8.png" x="0" y="0" width="280" height="200" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow06)" />
      <text x="140" y="220" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" textLength="106.7" lengthAdjust="spacingAndGlyphs">Tianshui jade · dew-dyed blue-green</text>
    </g>

    <g transform="translate(310,0)">
      <rect x="0" y="0" width="240" height="200" rx="4" fill="#8FB09A" />
      <rect x="10" y="10" width="220" height="180" fill="none" stroke="#F7F2E8" stroke-width="1" stroke-opacity="0.6" />
      <text x="120" y="80" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="39.20" font-weight="bold" fill="#F7F2E8" letter-spacing="4" textLength="112.0" lengthAdjust="spacingAndGlyphs">Tianshui</text>
      <text x="120" y="140" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="39.20" font-weight="bold" fill="#F7F2E8" letter-spacing="4" textLength="56.0" lengthAdjust="spacingAndGlyphs">Jade</text>
      <text x="120" y="175" text-anchor="middle" font-family="Arial" font-size="13" fill="#F7F2E8" letter-spacing="3">#8FB09A</text>
    </g>

    <g transform="translate(0,260)">
      <use data-icon="tabler-filled/droplet" x="0" y="0" width="24" height="24" fill="#6F8F75" />
      <text x="34" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">Consort of the last ruler of Southern Tang · Sleeping outdoors on silk</text>
      <text x="34" y="46" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">Colors revealed overnight · Lush and glistening with dew</text>
      <text x="34" y="74" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#9B948B" font-style="italic">— The History of Song · Hereditary Houses of Southern Tang · Named by Li Yu</text>
    </g>

    <g transform="translate(0,370)">
      <rect x="0" y="0" width="550" height="78" rx="6" fill="#EDE5D3" />
      <g transform="translate(20,20)">
        <use data-icon="tabler-filled/sparkles" x="0" y="0" width="20" height="20" fill="#6F8F75" />
        <text x="30" y="16" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A3530" font-weight="bold" textLength="122.6" lengthAdjust="spacingAndGlyphs">Recipe · Subtle yellow and cyan</text>
      </g>
      <text x="20" y="64" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068" letter-spacing="1">Indigo-dye to moon white or sky blue, then overdye with a minimal amount of plant-based yellow</text>
    </g>
  </g>

  <g id="bottom-strip" transform="translate(60,660)">
    <rect x="0" y="0" width="1160" height="32" rx="16" fill="#EDE5D3" />
    <text x="30" y="21" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">In the eyes of the ancients · Wind and rain · Sun and moon · Seasonal plants · All could become colors</text>
    <text x="1130" y="21" text-anchor="end" font-family="Georgia, Georgia, Georgia, serif" font-size="13" fill="#9B948B">06 / 12</text>
  </g>
</svg>
