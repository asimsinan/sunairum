<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="scrollOverlay04" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F2E8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F7F2E8" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="timelineGrad04" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1190" y2="0">
      <stop offset="0%" stop-color="#C99E62" />
      <stop offset="50%" stop-color="#6B9AAE" />
      <stop offset="100%" stop-color="#6F8F75" />
    </linearGradient>
    <filter id="nodeShadow04" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" />
      <feComponentTransfer><feFuncA type="linear" slope="0.25" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F7F2E8" />

  <g id="scroll-decor" transform="translate(0,60)">
    <image href="../images/640_1.png" x="0" y="0" width="1280" height="180" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="180" fill="url(#scrollOverlay04)" />
  </g>

  <g id="header">
    <text x="60" y="42" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9B948B" letter-spacing="3" textLength="146.9" lengthAdjust="spacingAndGlyphs">CHAPTER 01 · Millennia-Old Dyeing Techniques</text>
    <line x1="60" y1="54" x2="240" y2="54" stroke="#C99E62" stroke-width="2" />
  </g>

  <g id="title-overlay" transform="translate(60,190)">
    <text x="0" y="0" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="28.00" font-weight="bold" fill="#3A3530" letter-spacing="3">The art of dyeing · Dating back to the time of the Yellow Emperor</text>
    <text x="0" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#7A7068" letter-spacing="2">Historical records state: "The Yellow Emperor established black caps and yellow robes, using the juice of plants to dye decorative patterns."</text>
  </g>

  <g id="scroll-caption">
    <text x="1220" y="236" text-anchor="end" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" font-style="italic">Tang dynasty · Zhang Xuan, Court Ladies Preparing Newly Woven Silk (detail) · Museum of Fine Arts, Boston</text>
  </g>

  <g id="timeline-main" transform="translate(0,460)">
    <line x1="90" y1="0" x2="1190" y2="0" stroke="url(#timelineGrad04)" stroke-width="4" stroke-linecap="round" />

    <g transform="translate(140,0)">
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#C99E62" stroke-width="3" filter="url(#nodeShadow04)" />
      <circle cx="0" cy="0" r="9" fill="#C99E62" />
      <rect x="-90" y="-120" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#D7CEB9" stroke-width="1" filter="url(#nodeShadow04)" />
      <text x="0" y="-96" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#C99E62" textLength="72.0" lengthAdjust="spacingAndGlyphs">The Age of Xuanyuan</text>
      <text x="0" y="-72" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#3A3530" textLength="30.0" lengthAdjust="spacingAndGlyphs">The Yellow Emperor</text>
      <text x="0" y="-52" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#3A3530" textLength="75.0" lengthAdjust="spacingAndGlyphs">Made a black cap and yellow robes</text>
      <line x1="0" y1="-20" x2="0" y2="-30" stroke="#C99E62" stroke-width="2" stroke-dasharray="3,3" />
      <text x="0" y="56" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7A7068" letter-spacing="2">Origin</text>
    </g>

    <g transform="translate(400,0)">
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#C99E62" stroke-width="3" filter="url(#nodeShadow04)" />
      <circle cx="0" cy="0" r="9" fill="#C99E62" />
      <rect x="-90" y="34" width="180" height="100" rx="8" fill="#FFFFFF" stroke="#D7CEB9" stroke-width="1" filter="url(#nodeShadow04)" />
      <text x="0" y="58" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#C99E62" textLength="36.0" lengthAdjust="spacingAndGlyphs">Western Zhou</text>
      <text x="0" y="86" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#3A3530" textLength="91.5" lengthAdjust="spacingAndGlyphs">Appoint dedicated “dyers”</text>
      <text x="0" y="108" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B">The dyeing official · The first division of duties</text>
      <line x1="0" y1="20" x2="0" y2="34" stroke="#C99E62" stroke-width="2" stroke-dasharray="3,3" />
      <text x="0" y="-34" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7A7068" letter-spacing="2" textLength="42.0" lengthAdjust="spacingAndGlyphs">Institutionalized</text>
    </g>

    <g transform="translate(660,0)">
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#6B9AAE" stroke-width="3" filter="url(#nodeShadow04)" />
      <circle cx="0" cy="0" r="9" fill="#6B9AAE" />
      <rect x="-90" y="-120" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#D7CEB9" stroke-width="1" filter="url(#nodeShadow04)" />
      <text x="0" y="-96" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#6B9AAE" textLength="36.0" lengthAdjust="spacingAndGlyphs">Qin Dynasty</text>
      <text x="0" y="-72" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#3A3530" textLength="76.5" lengthAdjust="spacingAndGlyphs">Establish the “Dyeing Bureau”</text>
      <text x="0" y="-52" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" textLength="119.7" lengthAdjust="spacingAndGlyphs">National Institutions · Unified Regulations</text>
      <line x1="0" y1="-20" x2="0" y2="-30" stroke="#6B9AAE" stroke-width="2" stroke-dasharray="3,3" />
      <text x="0" y="56" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7A7068" letter-spacing="2" textLength="28.0" lengthAdjust="spacingAndGlyphs">State-run</text>
    </g>

    <g transform="translate(920,0)">
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#6F8F75" stroke-width="3" filter="url(#nodeShadow04)" />
      <circle cx="0" cy="0" r="9" fill="#6F8F75" />
      <rect x="-90" y="34" width="180" height="100" rx="8" fill="#FFFFFF" stroke="#D7CEB9" stroke-width="1" filter="url(#nodeShadow04)" />
      <text x="0" y="58" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#6F8F75" textLength="36.0" lengthAdjust="spacingAndGlyphs">Tang and Song dynasties</text>
      <text x="0" y="86" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#3A3530" textLength="61.5" lengthAdjust="spacingAndGlyphs">Establish the “Dyeing Institute”</text>
      <text x="0" y="108" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B">Song Huizong's imperial inscription · Clear blue after rain</text>
      <line x1="0" y1="20" x2="0" y2="34" stroke="#6F8F75" stroke-width="2" stroke-dasharray="3,3" />
      <text x="0" y="-34" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7A7068" letter-spacing="2" textLength="28.0" lengthAdjust="spacingAndGlyphs">Pinnacle</text>
    </g>

    <g transform="translate(1150,0)">
      <circle cx="-10" cy="0" r="20" fill="#FFFFFF" stroke="#B04A5C" stroke-width="3" filter="url(#nodeShadow04)" />
      <circle cx="-10" cy="0" r="9" fill="#B04A5C" />
      <rect x="-100" y="-120" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#D7CEB9" stroke-width="1" filter="url(#nodeShadow04)" />
      <text x="-10" y="-96" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" font-weight="bold" fill="#B04A5C" textLength="36.0" lengthAdjust="spacingAndGlyphs">Ming and Qing dynasties</text>
      <text x="-10" y="-72" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#3A3530" textLength="61.5" lengthAdjust="spacingAndGlyphs">“Indigo Studio”</text>
      <text x="-10" y="-52" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B">《The Exploitation of the Works of Nature》 systematically documents</text>
      <line x1="-10" y1="-20" x2="-10" y2="-30" stroke="#B04A5C" stroke-width="2" stroke-dasharray="3,3" />
      <text x="-10" y="56" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#7A7068" letter-spacing="2" textLength="28.0" lengthAdjust="spacingAndGlyphs">Integration</text>
    </g>
  </g>

  <g id="bottom-quote" transform="translate(60,620)">
    <use data-icon="tabler-filled/book" x="0" y="0" width="28" height="28" fill="#C99E62" />
    <text x="44" y="22" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#3A3530">Classical heritage · 《Essential Techniques for the People’s Welfare》 《The Exploitation of the Works of Nature》 《The Artificers’ Record》 《Collected Statutes of the Great Ming》</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="1220" y2="690" stroke="#D7CEB9" stroke-width="1" />
    <text x="60" y="710" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#9B948B">Cutting Clouds, Weaving Moonlight · Plants and Trees Become Poetry</text>
    <text x="1220" y="710" text-anchor="end" font-family="Georgia, Georgia, Georgia, serif" font-size="12" fill="#9B948B">04 / 12</text>
  </g>
</svg>
