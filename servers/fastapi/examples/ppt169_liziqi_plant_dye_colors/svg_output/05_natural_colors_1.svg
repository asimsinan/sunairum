<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="imgShadow05" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope="0.2" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F7F2E8" />

  <g id="header">
    <text x="60" y="50" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.01" fill="#9B948B" letter-spacing="3">CHAPTER 02 · Botanical Hues (Part 1)</text>
    <line x1="60" y1="62" x2="290" y2="62" stroke="#C99E62" stroke-width="2" />
    <text x="60" y="108" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26.60" font-weight="bold" fill="#3A3530" letter-spacing="3">Dyeing the natural world · Daylight and primroses</text>
    <text x="60" y="140" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#7A7068" letter-spacing="2">Ancient people looked to nature · Naming colors after wind and rain, the sun and moon, seasonal plants, flowers, birds, fish, and insects</text>
  </g>

  <line x1="640" y1="180" x2="640" y2="660" stroke="#D7CEB9" stroke-width="1" stroke-dasharray="4,4" />

  <g id="color-yuguo" transform="translate(60,180)">
    <g transform="translate(0,0)">
      <rect x="-4" y="-4" width="288" height="208" fill="#EDE5D3" stroke="#7AA4B6" stroke-width="1" />
      <image href="../images/640_5.png" x="0" y="0" width="280" height="200" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow05)" />
      <text x="140" y="220" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" textLength="119.7" lengthAdjust="spacingAndGlyphs">Song · Ru ware, sky-blue-glazed round washer</text>
    </g>

    <g transform="translate(310,0)">
      <rect x="0" y="0" width="260" height="200" rx="4" fill="#7AA4B6" />
      <rect x="10" y="10" width="240" height="180" fill="none" stroke="#F7F2E8" stroke-width="1" stroke-opacity="0.6" />
      <text x="130" y="78" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="bold" fill="#F7F2E8" letter-spacing="6" textLength="88.0" lengthAdjust="spacingAndGlyphs">After the rain</text>
      <text x="130" y="128" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="bold" fill="#F7F2E8" letter-spacing="6" textLength="88.0" lengthAdjust="spacingAndGlyphs">Azure blue</text>
      <text x="130" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#F7F2E8" letter-spacing="3">#7AA4B6</text>
    </g>

    <g transform="translate(0,260)">
      <use data-icon="tabler-filled/quote" x="0" y="0" width="24" height="24" fill="#6B9AAE" />
      <text x="34" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">After the rain, the sky clears where the clouds break</text>
      <text x="34" y="46" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold" textLength="133.0" lengthAdjust="spacingAndGlyphs">Such colors for the future</text>
      <text x="34" y="74" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#9B948B" font-style="italic">— Emperor Huizong of Song · Imperial Blue-and-White Porcelain Color</text>
    </g>

    <g transform="translate(0,370)">
      <rect x="0" y="0" width="570" height="78" rx="6" fill="#EDE5D3" />
      <g transform="translate(20,20)">
        <use data-icon="tabler-filled/droplet" x="0" y="0" width="20" height="20" fill="#6B9AAE" />
        <text x="30" y="16" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A3530" font-weight="bold" textLength="122.6" lengthAdjust="spacingAndGlyphs">Recipe · Blue-yellow overdyeing</text>
      </g>
      <text x="20" y="64" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068" letter-spacing="1">95% earth indigo + 5% scutellaria, clear and translucent with a hazy poetic quality</text>
    </g>
  </g>

  <g id="color-canghuang" transform="translate(670,180)">
    <g transform="translate(0,0)">
      <rect x="-4" y="-4" width="288" height="208" fill="#EDE5D3" stroke="#B29A55" stroke-width="1" />
      <image href="../images/640_6.png" x="0" y="0" width="280" height="200" preserveAspectRatio="xMidYMid slice" filter="url(#imgShadow05)" />
      <text x="140" y="220" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9B948B" textLength="93.7" lengthAdjust="spacingAndGlyphs">Pale Yellow · The Color of Spring’s Arrival</text>
    </g>

    <g transform="translate(310,0)">
      <rect x="0" y="0" width="240" height="200" rx="4" fill="#B29A55" />
      <rect x="10" y="10" width="220" height="180" fill="none" stroke="#F7F2E8" stroke-width="1" stroke-opacity="0.6" />
      <text x="120" y="105" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="50.40" font-weight="bold" fill="#F7F2E8" letter-spacing="4" textLength="144.0" lengthAdjust="spacingAndGlyphs">Pale Yellow</text>
      <text x="120" y="160" text-anchor="middle" font-family="Arial" font-size="13" fill="#F7F2E8" letter-spacing="3">#B29A55</text>
    </g>

    <g transform="translate(0,260)">
      <use data-icon="tabler-filled/quote" x="0" y="0" width="24" height="24" fill="#C99E62" />
      <text x="34" y="18" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold" textLength="152.0" lengthAdjust="spacingAndGlyphs">In the Gu Zhu Mountains, birds resemble mynas</text>
      <text x="34" y="46" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="13.30" fill="#3A3530" font-weight="bold">Pale Yellow · Said to Mean “The Beginning of Spring”</text>
      <text x="34" y="74" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#9B948B" font-style="italic">— Li Fang of Song, Taiping Guangji · Bird Heralding Spring</text>
    </g>

    <g transform="translate(0,370)">
      <rect x="0" y="0" width="550" height="78" rx="6" fill="#EDE5D3" />
      <g transform="translate(20,20)">
        <use data-icon="tabler-filled/leaf" x="0" y="0" width="20" height="20" fill="#C99E62" />
        <text x="30" y="16" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" fill="#3A3530" font-weight="bold" textLength="122.6" lengthAdjust="spacingAndGlyphs">Recipe · Two methods yield the same result</text>
      </g>
      <text x="20" y="64" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#7A7068" letter-spacing="1">Rhubarb + sappanwood, mordanted with blue vitriol; or pre-dye with ochre + overdye with black tea</text>
    </g>
  </g>

  <g id="bottom-strip" transform="translate(60,660)">
    <rect x="0" y="0" width="1160" height="32" rx="16" fill="#EDE5D3" />
    <text x="30" y="21" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#7A7068">Ancient people gathered flowers, fruits, leaves, and stems · steeped and dyed cotton yarn to weave cloth · every color originates from the earth</text>
    <text x="1130" y="21" text-anchor="end" font-family="Georgia, Georgia, Georgia, serif" font-size="13" fill="#9B948B">05 / 12</text>
  </g>
</svg>
