<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <clipPath id="p13ImgBJ"><rect x="60" y="256" width="580" height="240" rx="6" /></clipPath>
    <clipPath id="p13ImgZJL"><rect x="660" y="256" width="280" height="170" rx="6" /></clipPath>
    <clipPath id="p13ImgZJR"><rect x="940" y="256" width="280" height="170" rx="6" /></clipPath>
    <linearGradient id="p13TopBJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#8B7355" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="p13TopZJL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A6B7A" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#5A6B7A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="p13TopZJR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#C2410C" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="p13BottomFadeBJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#F5F2EC" />
  </g>

  <g id="header">
    <rect x="60" y="60" width="3" height="32" fill="#C2410C" />
    <text x="76" y="84" font-family="Georgia, serif" font-size="10.65" font-weight="700" fill="#5A6B7A" letter-spacing="3">IV · Predicament · PILOT CASES</text>
    <text x="1220" y="84" text-anchor="end" font-family="Georgia, serif" font-size="9.34" fill="#5A6B7A">Existing attempts · CHINA</text>
  </g>

  <g id="page-title">
    <text x="60" y="148" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="25.20" font-weight="700" fill="#2B3A4A" textLength="235.8" lengthAdjust="spacingAndGlyphs">Existing attempts: from<tspan fill="#8B7355">Functional reinvention</tspan>To<tspan fill="#C2410C">Demolish and rebuild in its original form</tspan></text>
    <line x1="60" y1="172" x2="160" y2="172" stroke="#C2410C" stroke-width="2" />
  </g>

  <g id="case-bj">
    <rect x="60" y="210" width="580" height="478" rx="6" fill="#FFFFFF" stroke="#D6CFC0" stroke-width="1" />

    <g id="bj-tag">
      <rect x="80" y="228" width="3" height="22" fill="#8B7355" />
      <text x="92" y="245" font-family="Georgia, serif" font-size="8.40" font-weight="700" fill="#8B7355" letter-spacing="3">CASE A · Tiantongyuan, Beijing</text>
      <text x="620" y="245" text-anchor="end" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-style="italic" fill="#8B7355" textLength="71.4" lengthAdjust="spacingAndGlyphs">"Office Ring Orange"</text>
    </g>

    <image href="../images/640_16.png" x="60" y="256" width="580" height="240" preserveAspectRatio="xMidYMid slice" clip-path="url(#p13ImgBJ)" />
    <rect x="60" y="256" width="580" height="100" fill="url(#p13TopBJ)" />
    <rect x="60" y="436" width="580" height="60" fill="url(#p13BottomFadeBJ)" />

    <text x="80" y="540" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="700" fill="#2B3A4A" textLength="180.6" lengthAdjust="spacingAndGlyphs">High-rise residence → office building</text>
    <text x="80" y="572" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#5A6B7A">Alleviating the Challenges in the Tiantongyuan Area<tspan fill="#8B7355" font-weight="700">"Separation of work and residence"</tspan>Question</text>
    <text x="80" y="596" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#5A6B7A">Partial Reinforcement of the Existing Beams and Columns</text>
    <text x="80" y="620" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#5A6B7A">Expanding the Residential Floor Plan into an Office Layout</text>
    <text x="80" y="660" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" font-style="italic" fill="#8B7355">— Meeting the Needs of Different Small and Medium-Sized Enterprises</text>
    <text x="620" y="678" text-anchor="end" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="7.70" fill="#8A8275">Photography: Jin Weiqi · Image source: People’s Architecture Office</text>
  </g>

  <g id="case-zj">
    <rect x="660" y="210" width="560" height="478" rx="6" fill="#FFFFFF" stroke="#D6CFC0" stroke-width="1" />

    <g id="zj-tag">
      <rect x="680" y="228" width="3" height="22" fill="#C2410C" />
      <text x="692" y="245" font-family="Georgia, serif" font-size="8.72" font-weight="700" fill="#C2410C" letter-spacing="3">CASE B · Downtown Hangzhou</text>
      <text x="1200" y="245" text-anchor="end" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" font-style="italic" fill="#C2410C" textLength="71.4" lengthAdjust="spacingAndGlyphs">"Zhejiang University of Technology New Village"</text>
    </g>

    <image href="../images/640_19.png" x="660" y="256" width="280" height="170" preserveAspectRatio="xMidYMid slice" clip-path="url(#p13ImgZJL)" />
    <rect x="660" y="256" width="280" height="60" fill="url(#p13TopZJL)" />
    <g id="bf-zj">
      <rect x="676" y="272" width="10" height="10" fill="#F5F2EC" />
      <text x="694" y="282" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#F5F2EC" letter-spacing="3">BEFORE · 80s</text>
    </g>

    <image href="../images/640_20.png" x="940" y="256" width="280" height="170" preserveAspectRatio="xMidYMid slice" clip-path="url(#p13ImgZJR)" />
    <rect x="940" y="256" width="280" height="60" fill="url(#p13TopZJR)" />
    <g id="af-zj">
      <rect x="956" y="272" width="10" height="10" fill="#F5F2EC" />
      <text x="974" y="282" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#F5F2EC" letter-spacing="3">AFTER · NEW</text>
    </g>

    <text x="680" y="466" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" font-weight="700" fill="#2B3A4A">The first old residential compound to be demolished and rebuilt on its original footprint</text>
    <text x="680" y="498" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#5A6B7A" textLength="107.0" lengthAdjust="spacingAndGlyphs">Demolish 13 buildings, build new ones <tspan fill="#C2410C" font-weight="700">7 11-story mid-rise buildings</tspan></text>

    <line x1="680" y1="520" x2="1200" y2="520" stroke="#D6CFC0" stroke-width="1" />

    <g id="cost-grid" transform="translate(680, 540)">
      <text x="0" y="20" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#C2410C">5.3<tspan font-size="9.80" fill="#5A6B7A" dx="4" textLength="28.0" lengthAdjust="spacingAndGlyphs">100 million yuan</tspan></text>
      <text x="0" y="44" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#5A6B7A" textLength="60.0" lengthAdjust="spacingAndGlyphs">Total reconstruction cost</text>

      <text x="180" y="20" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#C2410C">4.7<tspan font-size="9.80" fill="#5A6B7A" dx="4" textLength="28.0" lengthAdjust="spacingAndGlyphs">100 million yuan</tspan></text>
      <text x="180" y="44" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#5A6B7A" textLength="48.0" lengthAdjust="spacingAndGlyphs">Resident-funded</text>

      <text x="360" y="20" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#2B3A4A">10–100<tspan font-size="9.80" fill="#5A6B7A" dx="4" textLength="49.7" lengthAdjust="spacingAndGlyphs">¥10,000/household</tspan></text>
      <text x="360" y="44" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#5A6B7A" textLength="72.0" lengthAdjust="spacingAndGlyphs">Per-household contribution range</text>
    </g>
    <text x="680" y="676" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" font-style="italic" fill="#5A6B7A">— State Council 2025.08: Steadily advance the renovation of hazardous and dilapidated housing, supporting owner-led renewal and rebuilds in place</text>
  </g>

  <g id="footer">
    <text x="1220" y="710" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#8A8275">13 / 15</text>
  </g>
</svg>
