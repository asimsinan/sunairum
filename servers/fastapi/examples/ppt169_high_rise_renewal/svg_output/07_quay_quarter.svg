<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <clipPath id="p07ImgL"><rect x="60" y="210" width="320" height="430" rx="6" /></clipPath>
    <clipPath id="p07ImgR"><rect x="480" y="210" width="240" height="430" rx="6" /></clipPath>
    <linearGradient id="p07TopL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A6B7A" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#5A6B7A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="p07TopR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#8B7355" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="p07BottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F2EC" stop-opacity="0" />
      <stop offset="100%" stop-color="#F5F2EC" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#F5F2EC" />
  </g>

  <g id="header">
    <rect x="60" y="60" width="3" height="32" fill="#8B7355" />
    <text x="76" y="84" font-family="Georgia, serif" font-size="11.58" font-weight="700" fill="#5A6B7A" letter-spacing="3">II · Archetype · REGENERATION</text>
    <text x="1220" y="84" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#5A6B7A">QUAY QUARTER TOWER · SYDNEY</text>
  </g>

  <g id="page-title">
    <text x="60" y="150" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="25.20" font-weight="700" fill="#2B3A4A" textLength="180.0" lengthAdjust="spacingAndGlyphs">The world's first<tspan fill="#8B7355">"Comprehensive upgrading and renovation"</tspan>skyscrapers</text>
    <line x1="60" y1="174" x2="160" y2="174" stroke="#8B7355" stroke-width="2" />
  </g>

  <g id="img-before">
    <image href="../images/640_4.png" x="60" y="210" width="320" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#p07ImgL)" />
    <rect x="60" y="210" width="320" height="120" fill="url(#p07TopL)" />
    <rect x="60" y="560" width="320" height="80" fill="url(#p07BottomFade)" />
    <g id="badge-before">
      <rect x="80" y="230" width="12" height="12" fill="#F5F2EC" />
      <text x="100" y="241" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#F5F2EC" letter-spacing="3">BEFORE</text>
    </g>
    <text x="60" y="668" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.09" fill="#5A6B7A">Former AMP Center · 1976 · 206 m · 49 floors</text>
  </g>

  <g id="arrow-mid">
    <text x="430" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#8B7355" letter-spacing="2">RE</text>
    <line x1="410" y1="445" x2="450" y2="445" stroke="#8B7355" stroke-width="2" />
    <text x="430" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#8B7355" letter-spacing="2">USE</text>
    <polygon points="430,495 420,510 440,510" fill="#8B7355" />
  </g>

  <g id="img-after">
    <image href="../images/640_5.png" x="480" y="210" width="240" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#p07ImgR)" />
    <rect x="480" y="210" width="240" height="120" fill="url(#p07TopR)" />
    <rect x="480" y="560" width="240" height="80" fill="url(#p07BottomFade)" />
    <g id="badge-after">
      <rect x="500" y="230" width="12" height="12" fill="#8B7355" />
      <text x="520" y="241" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#F5F2EC" letter-spacing="3">AFTER</text>
    </g>
    <text x="480" y="668" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.85" fill="#5A6B7A">Quay Quarter Tower · Multifunctional Complex</text>
  </g>

  <g id="key-data">
    <rect x="760" y="210" width="460" height="200" rx="6" fill="#EBE6DC" />
    <text x="784" y="248" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" font-weight="700" fill="#8B7355" letter-spacing="2" textLength="78.0" lengthAdjust="spacingAndGlyphs">Core renovation principles</text>
    <text x="784" y="288" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="18.20" font-weight="700" fill="#2B3A4A" textLength="320.1" lengthAdjust="spacingAndGlyphs">"Maximize preservation · upgrade with quality"</text>
    <line x1="784" y1="308" x2="850" y2="308" stroke="#C2410C" stroke-width="2" />
    <text x="784" y="350" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#8B7355">65<tspan font-size="22" fill="#5A6B7A" dx="4">%</tspan></text>
    <text x="784" y="380" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#5A6B7A" textLength="78.0" lengthAdjust="spacingAndGlyphs">Retain the main structure</text>
    <text x="900" y="392" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#5A6B7A" textLength="86.4" lengthAdjust="spacingAndGlyphs">(Beams, columns, and floor slabs)</text>
    <text x="1020" y="350" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#8B7355">95<tspan font-size="22" fill="#5A6B7A" dx="4">%</tspan></text>
    <text x="1020" y="380" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#5A6B7A" textLength="91.0" lengthAdjust="spacingAndGlyphs">Retain the existing core tube</text>
  </g>

  <g id="design-firm">
    <rect x="760" y="430" width="460" height="210" rx="6" fill="#FFFFFF" stroke="#D6CFC0" stroke-width="1" />
    <text x="784" y="468" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.63" font-weight="700" fill="#8B7355" letter-spacing="2">Designed · 3XN Architects</text>
    <text x="784" y="510" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#2B3A4A">"Skyscrapers built in the mid-to-late 20th century"</text>
    <text x="784" y="534" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#2B3A4A">"It is gradually reaching the end of its design life."</text>
    <text x="784" y="572" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#5A6B7A">"We must extend the life of existing buildings,"</text>
    <text x="784" y="596" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#5A6B7A" textLength="129.8" lengthAdjust="spacingAndGlyphs">"Unlock its potential value."</text>
    <text x="784" y="624" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" font-style="italic" fill="#C2410C">— This is the most fundamental definition of architectural sustainability</text>
  </g>

  <g id="footer">
    <text x="60" y="710" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#8A8275">Image source: Archdaily</text>
    <text x="1220" y="710" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#8A8275">07 / 15</text>
  </g>
</svg>
