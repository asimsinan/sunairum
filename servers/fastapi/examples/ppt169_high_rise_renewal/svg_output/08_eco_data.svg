<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ecoOverlay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F2A1F" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#1F2A1F" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#1F2A1F" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g id="bg-image">
    <rect width="1280" height="720" fill="#1F2A1F" />
    <image href="../images/640_8.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#ecoOverlay)" />
  </g>

  <g id="header">
    <rect x="60" y="60" width="3" height="32" fill="#6B7A4F" />
    <text x="76" y="84" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#F5F2EC" letter-spacing="3">II · Archetype · EARTHSHOT FINALIST 2025</text>
  </g>

  <g id="page-title">
    <text x="60" y="170" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="700" fill="#F5F2EC">Shortlisted for the "Fighting for the Earth Award"</text>
    <text x="60" y="216" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="700" fill="#F5F2EC" textLength="132.0" lengthAdjust="spacingAndGlyphs">of the finals<tspan fill="#A8C575">True weight</tspan></text>
    <line x1="60" y1="240" x2="160" y2="240" stroke="#A8C575" stroke-width="2" />
    <text x="60" y="278" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.01" fill="#D6CFC0" font-style="italic">The first building ever nominated for the award</text>
  </g>

  <g id="kpi-1">
    <text x="60" y="430" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#A8C575">−80<tspan font-size="56" fill="#F5F2EC" dx="4">%</tspan></text>
    <line x1="60" y1="460" x2="120" y2="460" stroke="#F5F2EC" stroke-width="1" />
    <text x="60" y="492" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" font-weight="700" fill="#F5F2EC" textLength="68.0" lengthAdjust="spacingAndGlyphs">Construction waste</text>
    <text x="60" y="516" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#D6CFC0">Through structural reuse, avoiding the costs of tearing down and rebuilding</text>
    <text x="60" y="536" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#D6CFC0" textLength="91.0" lengthAdjust="spacingAndGlyphs">Waste significantly reduced</text>
  </g>

  <g id="kpi-2">
    <text x="460" y="430" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#A8C575">−40<tspan font-size="56" fill="#F5F2EC" dx="4">%</tspan></text>
    <line x1="460" y1="460" x2="520" y2="460" stroke="#F5F2EC" stroke-width="1" />
    <text x="460" y="492" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" font-weight="700" fill="#F5F2EC" textLength="51.0" lengthAdjust="spacingAndGlyphs">Carbon emissions</text>
    <text x="460" y="516" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#D6CFC0" textLength="117.0" lengthAdjust="spacingAndGlyphs">Compared with the teardown-and-rebuild model</text>
    <text x="460" y="536" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#D6CFC0">Significantly reduce the carbon footprint across the full lifecycle</text>
  </g>

  <g id="kpi-3">
    <text x="860" y="430" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#A8C575">−30<tspan font-size="56" fill="#F5F2EC" dx="4">%</tspan></text>
    <line x1="860" y1="460" x2="920" y2="460" stroke="#F5F2EC" stroke-width="1" />
    <text x="860" y="492" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.90" font-weight="700" fill="#F5F2EC" textLength="68.0" lengthAdjust="spacingAndGlyphs">Energy consumption</text>
    <text x="860" y="516" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#D6CFC0">Smart ventilation system · Photovoltaic curtain wall</text>
    <text x="860" y="536" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#D6CFC0">Working in tandem with a rainwater collection system</text>
  </g>

  <g id="footer">
    <line x1="60" y1="650" x2="1220" y2="650" stroke="#F5F2EC" stroke-opacity="0.2" stroke-width="1" />
    <text x="60" y="694" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#A8B0B8">Old supertall buildings are not necessarily a “burden” — with scientific renovation, they can be completely revitalized and even become new urban landmarks.</text>
    <text x="1220" y="694" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#A8B0B8">08 / 15</text>
  </g>
</svg>
