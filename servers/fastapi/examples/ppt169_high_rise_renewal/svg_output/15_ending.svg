<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="endingOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2530" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#1A2530" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#1A2530" stop-opacity="0.92" />
    </linearGradient>
    <marker id="stepArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#A8C575" />
    </marker>
  </defs>

  <g id="bg-image">
    <rect width="1280" height="720" fill="#1A2530" />
    <image href="../images/640_23.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#endingOverlay)" />
  </g>

  <g id="header">
    <rect x="60" y="60" width="3" height="32" fill="#A8C575" />
    <text x="76" y="84" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#F5F2EC" letter-spacing="3">CONCLUSION  ·  ENDING</text>
    <text x="1220" y="84" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#D6CFC0">CHINA · 297 CITIES · 150+ COUNTIES</text>
  </g>

  <g id="page-title">
    <text x="60" y="170" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="700" fill="#F5F2EC" textLength="132.0" lengthAdjust="spacingAndGlyphs">From the pursuit<tspan fill="#D6CFC0">Height</tspan>, to settling<tspan fill="#A8C575">Thickness</tspan></text>
    <line x1="60" y1="200" x2="160" y2="200" stroke="#A8C575" stroke-width="2" />
    <text x="60" y="234" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" fill="#D6CFC0" font-style="italic">The country is vigorously promoting the urban renewal concept of “health check first, renewal afterward.”</text>
  </g>

  <g id="step-flow">
    <line x1="220" y1="430" x2="320" y2="430" stroke="#A8C575" stroke-width="2" marker-end="url(#stepArrow)" stroke-opacity="0.7" />
    <line x1="490" y1="430" x2="590" y2="430" stroke="#A8C575" stroke-width="2" marker-end="url(#stepArrow)" stroke-opacity="0.7" />
    <line x1="760" y1="430" x2="860" y2="430" stroke="#A8C575" stroke-width="2" marker-end="url(#stepArrow)" stroke-opacity="0.7" />

    <g id="step-1">
      <circle cx="160" cy="430" r="44" fill="#F5F2EC" />
      <use data-icon="tabler-outline/clipboard-check" x="138" y="408" width="44" height="44" fill="#C2410C" />
      <text x="160" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="10.29" font-weight="700" fill="#A8C575" letter-spacing="3">01 · Checkup</text>
      <text x="160" y="540" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" font-weight="700" fill="#F5F2EC" textLength="60.0" lengthAdjust="spacingAndGlyphs">Urban health check</text>
      <text x="160" y="566" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12" fill="#D6CFC0">As of 2025.11</text>
      <text x="160" y="586" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D6CFC0" textLength="140.6" lengthAdjust="spacingAndGlyphs">297 Prefecture-Level + 150+ County-Level Cities</text>
    </g>

    <g id="step-2">
      <circle cx="430" cy="430" r="44" fill="#F5F2EC" />
      <use data-icon="tabler-outline/tool" x="408" y="408" width="44" height="44" fill="#8B7355" />
      <text x="430" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="11.29" font-weight="700" fill="#A8C575" letter-spacing="3">02 · Design</text>
      <text x="430" y="540" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" font-weight="700" fill="#F5F2EC" textLength="60.0" lengthAdjust="spacingAndGlyphs">Professional solution</text>
      <text x="430" y="566" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D6CFC0" textLength="72.0" lengthAdjust="spacingAndGlyphs">Provided by professional institutions</text>
      <text x="430" y="586" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D6CFC0" textLength="120.0" lengthAdjust="spacingAndGlyphs">Safe and Reliable Design and Technology</text>
    </g>

    <g id="step-3">
      <circle cx="700" cy="430" r="44" fill="#F5F2EC" />
      <use data-icon="tabler-outline/users" x="678" y="408" width="44" height="44" fill="#6B7A4F" />
      <text x="700" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="9.80" font-weight="700" fill="#A8C575" letter-spacing="3" textLength="60.3" lengthAdjust="spacingAndGlyphs">03 · Coordination</text>
      <text x="700" y="540" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" font-weight="700" fill="#F5F2EC" textLength="60.0" lengthAdjust="spacingAndGlyphs">Co-construction and co-governance</text>
      <text x="700" y="566" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D6CFC0" textLength="72.0" lengthAdjust="spacingAndGlyphs">Government-built platform</text>
      <text x="700" y="586" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D6CFC0">Coordination and leadership by grassroots community organizations</text>
    </g>

    <g id="step-4">
      <circle cx="970" cy="430" r="48" fill="#A8C575" />
      <use data-icon="tabler-outline/refresh" x="946" y="406" width="48" height="48" fill="#2B3A4A" />
      <text x="970" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="9.80" font-weight="700" fill="#A8C575" letter-spacing="3" textLength="60.3" lengthAdjust="spacingAndGlyphs">04 · Regeneration</text>
      <text x="970" y="540" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="10.50" font-weight="700" fill="#F5F2EC" textLength="60.0" lengthAdjust="spacingAndGlyphs">Reinvigorated</text>
      <text x="970" y="566" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D6CFC0">Joint efforts from multiple parties · Safety and environmental protection as prerequisites</text>
      <text x="970" y="586" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#D6CFC0" textLength="132.0" lengthAdjust="spacingAndGlyphs">Contributing unique value to urban development</text>
    </g>
  </g>

  <g id="closing">
    <line x1="60" y1="640" x2="200" y2="640" stroke="#A8C575" stroke-width="1" />
    <text x="60" y="675" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-style="italic" fill="#F5F2EC" textLength="222.0" lengthAdjust="spacingAndGlyphs">The future of supertall buildings lies in"<tspan fill="#A8C575" font-weight="700">Meticulous craftsmanship</tspan>"A stylistic transformation</text>
    <text x="1220" y="700" text-anchor="end" font-family="Georgia, serif" font-size="8.40" fill="#A8B0B8" textLength="114.0" lengthAdjust="spacingAndGlyphs">— Thank You for Watching · 15 / 15</text>
  </g>
</svg>
