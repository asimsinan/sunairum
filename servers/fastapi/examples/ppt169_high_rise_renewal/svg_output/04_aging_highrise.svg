<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="imgFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B3A4A" stop-opacity="0" />
      <stop offset="100%" stop-color="#2B3A4A" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#F5F2EC" />
  </g>

  <g id="left-image">
    <image href="../images/640_18.png" x="0" y="0" width="440" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="440" height="720" fill="url(#imgFade)" />
    <text x="32" y="690" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="7.70" fill="#F5F2EC" fill-opacity="0.7">Image source: unsplash</text>
  </g>

  <g id="header">
    <rect x="500" y="60" width="3" height="32" fill="#C2410C" />
    <text x="516" y="84" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5A6B7A" letter-spacing="3">I · Alarm · AGING</text>
  </g>

  <g id="page-title">
    <text x="500" y="170" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="28.00" font-weight="700" fill="#2B3A4A" textLength="280.0" lengthAdjust="spacingAndGlyphs">A Symbol of Prosperity in Those Days</text>
    <text x="500" y="218" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="28.00" font-weight="700" fill="#2B3A4A" textLength="280.0" lengthAdjust="spacingAndGlyphs">Turning into something heavy<tspan fill="#C2410C">Maintenance Burden</tspan></text>
    <line x1="500" y1="248" x2="600" y2="248" stroke="#C2410C" stroke-width="2" />
  </g>

  <g id="point-1">
    <use data-icon="tabler-outline/clock" x="500" y="296" width="28" height="28" fill="#8B7355" />
    <text x="540" y="318" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="700" fill="#2B3A4A" textLength="135.2" lengthAdjust="spacingAndGlyphs">More than 10 years after completion</text>
    <text x="540" y="350" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5A6B7A">Structure, fire protection, elevators, façade, plumbing and drainage…</text>
    <text x="540" y="376" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5A6B7A">Various risks begin<tspan fill="#C2410C" font-weight="700">Dense Manifestation</tspan></text>
  </g>

  <g id="point-2">
    <use data-icon="tabler-outline/tool" x="500" y="416" width="28" height="28" fill="#8B7355" />
    <text x="540" y="438" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-weight="700" fill="#2B3A4A">Maintenance costs rise sharply with building age</text>
    <text x="540" y="470" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5A6B7A">Repair funds are being depleted faster, while owners’ contributions continue to rise</text>
    <text x="540" y="496" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5A6B7A" textLength="120.8" lengthAdjust="spacingAndGlyphs">People willing to live in high-rises,<tspan fill="#C2410C" font-weight="700">Becoming fewer</tspan></text>
  </g>

  <g id="quote">
    <rect x="500" y="540" width="700" height="100" rx="4" fill="#EBE6DC" />
    <rect x="500" y="540" width="4" height="100" fill="#C2410C" />
    <use data-icon="tabler-outline/quote" x="520" y="556" width="22" height="22" fill="#C2410C" />
    <text x="552" y="582" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" font-style="italic" fill="#2B3A4A" textLength="242.0" lengthAdjust="spacingAndGlyphs">"High-rise housing is the slum of the future"</text>
    <text x="552" y="612" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#5A6B7A">— Corresponding lessons have already been learned in some developed Western countries</text>
  </g>

  <g id="footer">
    <text x="500" y="694" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="8.40" fill="#8A8275">High-rise completed over a decade ago · Period of concentrated risk emergence</text>
    <text x="1220" y="694" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#8A8275">04 / 15</text>
  </g>
</svg>
