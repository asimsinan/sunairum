<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F1E8" />

  
  <text x="60" y="80" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="700" fill="#1A1A1A" letter-spacing="3" textLength="268.4" lengthAdjust="spacingAndGlyphs">Turn “clumsiness” into a shield</text>
  <line x1="60" y1="100" x2="160" y2="100" stroke="#A52A2A" stroke-width="3" />
  <text x="60" y="135" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852" letter-spacing="2">Showing too much invites pressure from every side</text>

  
  <use data-icon="tabler-outline/shield" x="1080" y="60" width="120" height="120" fill="#A52A2A" fill-opacity="0.1" stroke-width="1.5" />

  
  <g transform="translate(60, 200)">
    <line x1="0" y1="0" x2="1160" y2="0" stroke="#1A1A1A" stroke-width="2" />
    <text x="20" y="40" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1A1A1A" letter-spacing="3" textLength="88.0" lengthAdjust="spacingAndGlyphs">Your Performance</text>
    <text x="540" y="40" font-family="Georgia, Georgia, serif" font-size="22" fill="#A52A2A" letter-spacing="6">→</text>
    <text x="640" y="40" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1A1A1A" letter-spacing="3" textLength="88.0" lengthAdjust="spacingAndGlyphs">Others’ reactions</text>
    <text x="990" y="40" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.97" fill="#8B8680" letter-spacing="3">Actual cost</text>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#C8C0AE" stroke-width="1" />
  </g>

  
  <g transform="translate(60, 280)">
    <text x="20" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="23.29" font-weight="700" fill="#1A1A1A" letter-spacing="3">Too clever</text>
    <text x="540" y="32" text-anchor="middle" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="22" fill="#A52A2A">⟶</text>
    <text x="640" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="19.60" fill="#1A1A1A" letter-spacing="3" textLength="65.2" lengthAdjust="spacingAndGlyphs">Defend against him</text>
    <text x="990" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5C5852" textLength="112.0" lengthAdjust="spacingAndGlyphs">Skirting key information</text>
    <line x1="0" y1="56" x2="1160" y2="56" stroke="#C8C0AE" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  
  <g transform="translate(60, 360)">
    <text x="20" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="700" fill="#1A1A1A" letter-spacing="3" textLength="117.1" lengthAdjust="spacingAndGlyphs">Too dominant</text>
    <text x="540" y="32" text-anchor="middle" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="22" fill="#A52A2A">⟶</text>
    <text x="640" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="19.60" fill="#1A1A1A" letter-spacing="3" textLength="65.2" lengthAdjust="spacingAndGlyphs">Hide from him</text>
    <text x="990" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5C5852" textLength="128.0" lengthAdjust="spacingAndGlyphs">No one is willing to approach proactively</text>
    <line x1="0" y1="56" x2="1160" y2="56" stroke="#C8C0AE" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  
  <g transform="translate(60, 440)">
    <text x="20" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="700" fill="#1A1A1A" letter-spacing="3" textLength="117.1" lengthAdjust="spacingAndGlyphs">Too impatient</text>
    <text x="540" y="32" text-anchor="middle" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="22" fill="#A52A2A">⟶</text>
    <text x="640" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="19.60" fill="#1A1A1A" letter-spacing="3" textLength="65.2" lengthAdjust="spacingAndGlyphs">Drive down prices</text>
    <text x="990" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5C5852" textLength="144.0" lengthAdjust="spacingAndGlyphs">Resource providers know you have to accept it</text>
    <line x1="0" y1="56" x2="1160" y2="56" stroke="#C8C0AE" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  
  <g transform="translate(60, 520)">
    <text x="20" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="700" fill="#1A1A1A" letter-spacing="3" textLength="117.1" lengthAdjust="spacingAndGlyphs">Too eager to win</text>
    <text x="540" y="32" text-anchor="middle" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="22" fill="#A52A2A">⟶</text>
    <text x="640" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="19.60" fill="#1A1A1A" letter-spacing="3" textLength="102.5" lengthAdjust="spacingAndGlyphs">Drag into the mix</text>
    <text x="990" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5C5852">Your Opponent Uses Your Desire to Win to Control You</text>
    <line x1="0" y1="56" x2="1160" y2="56" stroke="#1A1A1A" stroke-width="2" />
  </g>

  
  <text x="640" y="660" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#5C5852" letter-spacing="4">Slower · duller · lighter — and, paradoxically, less unnecessary consumption</text>

  <text x="60" y="700" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#8B8680" textLength="58.9" lengthAdjust="spacingAndGlyphs">Concealing One’s Brilliance · Seven</text>
  <text x="1220" y="700" text-anchor="end" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="14" fill="#8B8680">09</text>
</svg>
