<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F1E8" />

  
  <text x="60" y="80" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="700" fill="#1A1A1A" letter-spacing="3" textLength="220.0" lengthAdjust="spacingAndGlyphs">What Is Cangzhuo?</text>
  <line x1="60" y1="100" x2="160" y2="100" stroke="#A52A2A" stroke-width="3" />
  <text x="60" y="135" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852" letter-spacing="2" textLength="199.8" lengthAdjust="spacingAndGlyphs">First, clarify three things it is "not"</text>

  
  <g transform="translate(60, 180)">
    <text x="0" y="30" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#5C5852" letter-spacing="2" textLength="44.0" lengthAdjust="spacingAndGlyphs">Keep a Low Profile</text>
    <text x="80" y="30" font-family="Georgia, Georgia, serif" font-size="22" fill="#A52A2A" letter-spacing="2">≠</text>
    <text x="115" y="30" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#5C5852" letter-spacing="2" textLength="44.0" lengthAdjust="spacingAndGlyphs">Playing dumb</text>
    <text x="220" y="30" font-family="Georgia, Georgia, serif" font-size="22" fill="#A52A2A" letter-spacing="2">≠</text>
    <text x="255" y="30" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#5C5852" letter-spacing="2" textLength="44.0" lengthAdjust="spacingAndGlyphs">Knowing When to Back Down</text>
    <text x="360" y="30" font-family="Georgia, Georgia, serif" font-size="22" fill="#A52A2A" letter-spacing="2">≠</text>
    <text x="395" y="30" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#5C5852" letter-spacing="2" textLength="44.0" lengthAdjust="spacingAndGlyphs">Passive</text>
  </g>

  
  <text x="60" y="265" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="19.60" font-weight="700" fill="#1A1A1A" letter-spacing="2" textLength="224.0" lengthAdjust="spacingAndGlyphs">But rather, three core actions</text>

  
  
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="370" height="320" fill="#EFEAD9" />
    <rect x="0" y="0" width="370" height="6" fill="#1A1A1A" />
    <text x="30" y="60" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="44.80" font-weight="700" fill="#A52A2A" fill-opacity="0.45">One</text>
    <use data-icon="tabler-outline/sword" x="270" y="30" width="60" height="60" fill="#1A1A1A" stroke-width="1.5" />
    <text x="30" y="160" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="25.20" font-weight="700" fill="#1A1A1A" letter-spacing="4" textLength="131.8" lengthAdjust="spacingAndGlyphs">Sheathe Your Edge</text>
    <line x1="30" y1="180" x2="100" y2="180" stroke="#A52A2A" stroke-width="2" />
    <text x="30" y="225" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852">When his strength is insufficient for self-preservation</text>
    <text x="30" y="255" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852" textLength="162.0" lengthAdjust="spacingAndGlyphs">The cutting edge is the blade you extend</text>
    <text x="30" y="295" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#1A1A1A" letter-spacing="2">Only by knowing how to hide can you avoid being watched</text>
  </g>

  
  <g transform="translate(455, 310)">
    <rect x="0" y="0" width="370" height="320" fill="#EFEAD9" />
    <rect x="0" y="0" width="370" height="6" fill="#1A1A1A" />
    <text x="30" y="60" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="44.80" font-weight="700" fill="#A52A2A" fill-opacity="0.45">Two</text>
    <use data-icon="tabler-outline/eye-off" x="270" y="30" width="60" height="60" fill="#1A1A1A" stroke-width="1.5" />
    <text x="30" y="160" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="25.20" font-weight="700" fill="#1A1A1A" letter-spacing="4" textLength="131.8" lengthAdjust="spacingAndGlyphs">Curb desires</text>
    <line x1="30" y1="180" x2="100" y2="180" stroke="#A52A2A" stroke-width="2" />
    <text x="30" y="225" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852">In a hurry to be recognized, in a hurry to prove themselves</text>
    <text x="30" y="255" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852" textLength="198.0" lengthAdjust="spacingAndGlyphs">It means submitting oneself to others’ judgment</text>
    <text x="30" y="295" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#1A1A1A" letter-spacing="2">Only by withstanding pressure can you leave room to turn around</text>
  </g>

  
  <g transform="translate(850, 310)">
    <rect x="0" y="0" width="370" height="320" fill="#1A1A1A" />
    <rect x="0" y="0" width="370" height="6" fill="#A52A2A" />
    <text x="30" y="60" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="44.80" font-weight="700" fill="#A52A2A" fill-opacity="0.55" textLength="64.0" lengthAdjust="spacingAndGlyphs">Three</text>
    <use data-icon="tabler-outline/shield" x="270" y="30" width="60" height="60" fill="#F5F1E8" stroke-width="1.5" />
    <text x="30" y="160" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="25.20" font-weight="700" fill="#F5F1E8" letter-spacing="4" textLength="131.8" lengthAdjust="spacingAndGlyphs">Shift the gaze</text>
    <line x1="30" y1="180" x2="100" y2="180" stroke="#A52A2A" stroke-width="2" />
    <text x="30" y="225" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#C8C0AE" textLength="144.0" lengthAdjust="spacingAndGlyphs">Step Back from Center Stage</text>
    <text x="30" y="255" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#C8C0AE" textLength="180.0" lengthAdjust="spacingAndGlyphs">Step out of other people’s line of sight</text>
    <text x="30" y="295" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#F5F1E8" letter-spacing="2">Only by staying mobile can you avoid being set up in advance</text>
  </g>

  
  <text x="60" y="690" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#8B8680" textLength="58.9" lengthAdjust="spacingAndGlyphs">Concealing One’s Brilliance · Two</text>
  <text x="1220" y="690" text-anchor="end" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="14" fill="#8B8680">04</text>
</svg>
