<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F1E8" />

  
  <image href="../images/hanxin_bridge.png" x="560" y="0" width="720" height="720" preserveAspectRatio="xMidYMid slice" />

  
  <defs>
    <linearGradient id="hanxin_scrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F1E8" stop-opacity="1" />
      <stop offset="40%" stop-color="#F5F1E8" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#F5F1E8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F5F1E8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="720" fill="url(#hanxin_scrim)" />

  
  <text x="60" y="90" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#8B8680" letter-spacing="12" textLength="73.6" lengthAdjust="spacingAndGlyphs">— Lessons from History —</text>

  
  <text x="60" y="180" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" fill="#5C5852" letter-spacing="3" textLength="229.2" lengthAdjust="spacingAndGlyphs">Han · Marquis of Huaiyin</text>
  <text x="60" y="280" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="84.00" font-weight="700" fill="#1A1A1A" letter-spacing="20">Han Xin</text>

  
  <rect x="320" y="200" width="60" height="60" fill="#A52A2A" />
  <text x="350" y="246" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="700" fill="#F5F1E8" textLength="32.0" lengthAdjust="spacingAndGlyphs">Endure</text>

  
  <text x="60" y="340" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="18.20" fill="#1A1A1A" letter-spacing="3">The humiliation of crawling between someone's legs</text>
  <line x1="60" y1="358" x2="160" y2="358" stroke="#A52A2A" stroke-width="2" />

  
  <g transform="translate(60, 400)">
    <use data-icon="tabler-outline/point" x="0" y="0" width="20" height="20" fill="#A52A2A" stroke-width="1.5" />
    <text x="32" y="16" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1A1A1A" textLength="176.0" lengthAdjust="spacingAndGlyphs">Not to glorify humiliation.</text>

    <use data-icon="tabler-outline/point" x="0" y="50" width="20" height="20" fill="#A52A2A" stroke-width="1.5" />
    <text x="32" y="66" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1A1A1A">But rather, she did not stake her life on street confrontations</text>

    <use data-icon="tabler-outline/point" x="0" y="100" width="20" height="20" fill="#A52A2A" stroke-width="1.5" />
    <text x="32" y="116" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#1A1A1A" textLength="210.1" lengthAdjust="spacingAndGlyphs">Winning a Small Round Is Just a Way to Vent</text>
  </g>

  
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="540" height="70" fill="#1A1A1A" />
    <rect x="0" y="0" width="6" height="70" fill="#A52A2A" />
    <text x="28" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.31" fill="#C8C0AE" letter-spacing="3">The Real Win</text>
    <text x="28" y="58" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#F5F1E8" letter-spacing="2">Win the bigger picture · then earn the right to turn things around</text>
  </g>

  
  <text x="60" y="700" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#8B8680" textLength="58.9" lengthAdjust="spacingAndGlyphs">Concealing One’s Brilliance · Six</text>
  <text x="1220" y="700" text-anchor="end" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="14" fill="#8B8680">08</text>
</svg>
