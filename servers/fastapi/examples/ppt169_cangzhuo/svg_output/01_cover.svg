  <defs>
    <linearGradient id="cover_scrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F1E8" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#F5F1E8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F5F1E8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#cover_scrim)" />

  
  <text x="1200" y="80" text-anchor="end" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#5C5852" letter-spacing="6" textLength="73.2" lengthAdjust="spacingAndGlyphs">The Art of Accomplishing Things</text>
  <line x1="1100" y1="100" x2="1220" y2="100" stroke="#C8C0AE" stroke-width="1" />

  
  <text x="120" y="240" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" fill="#5C5852" letter-spacing="10" textLength="256.0" lengthAdjust="spacingAndGlyphs">The highest level of a man's self-possession</text>

  <text x="120" y="360" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="126.00" font-weight="700" fill="#1A1A1A" letter-spacing="20" textLength="478.8" lengthAdjust="spacingAndGlyphs">Keep a Low Profile</text>

  
  <rect x="120" y="395" width="78" height="78" fill="none" stroke="#A52A2A" stroke-width="3" />
  <text x="159" y="448" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="29.40" font-weight="700" fill="#A52A2A" textLength="42.0" lengthAdjust="spacingAndGlyphs">Conceal</text>

  
  <line x1="220" y1="430" x2="320" y2="430" stroke="#A52A2A" stroke-width="2" />
  <text x="340" y="437" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="19.60" fill="#1A1A1A" letter-spacing="4">Stay composed · Stay hidden · Be willing to wait</text>

  
  <line x1="120" y1="640" x2="220" y2="640" stroke="#1A1A1A" stroke-width="1.5" />
  <text x="120" y="675" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852">The Art of Accomplishing Things · A Complete Theory of Getting Things Done</text>
  <text x="1200" y="675" text-anchor="end" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="14" fill="#8B8680">2026</text>
