<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <image href="../images/qianlong_pool.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />

  
  <defs>
    <radialGradient id="qianlong_vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F5F1E8" stop-opacity="0.1" />
      <stop offset="55%" stop-color="#F5F1E8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.25" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#qianlong_vignette)" />

  
  <text x="640" y="100" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#5C5852" letter-spacing="12" textLength="137.3" lengthAdjust="spacingAndGlyphs">— I Ching · Qian Hexagram —</text>

  
  <text x="640" y="290" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="98.00" font-weight="700" fill="#1A1A1A" letter-spacing="40" textLength="560.0" lengthAdjust="spacingAndGlyphs">The hidden dragon bides its time</text>

  
  <line x1="580" y1="350" x2="700" y2="350" stroke="#A52A2A" stroke-width="2" />

  
  <g transform="translate(605, 380)">
    <rect x="0" y="0" width="70" height="70" fill="#A52A2A" />
    <text x="35" y="52" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="25.20" font-weight="700" fill="#F5F1E8" textLength="36.0" lengthAdjust="spacingAndGlyphs">Potential</text>
  </g>

  
  <text x="640" y="540" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" fill="#1A1A1A" letter-spacing="4" textLength="358.7" lengthAdjust="spacingAndGlyphs">Dragon in the abyss · Not without power</text>
  <text x="640" y="590" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" fill="#1A1A1A" letter-spacing="4" textLength="192.0" lengthAdjust="spacingAndGlyphs">But rather, the time was not yet right</text>

  
  <text x="640" y="650" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#5C5852" letter-spacing="2">Before dawn, forcing yourself into the air will only crash into an invisible net</text>

  <text x="60" y="700" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#5C5852" textLength="58.9" lengthAdjust="spacingAndGlyphs">Concealing One’s Brilliance · Eight</text>
  <text x="1220" y="700" text-anchor="end" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="14" fill="#5C5852">10</text>
</svg>
