<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F1E8" />

  
  <text x="60" y="80" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30.80" font-weight="700" fill="#1A1A1A" letter-spacing="3" textLength="396.0" lengthAdjust="spacingAndGlyphs">The mistake young people make most often</text>
  <line x1="60" y1="100" x2="160" y2="100" stroke="#A52A2A" stroke-width="3" />

  
  <text x="60" y="150" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="18.20" fill="#A52A2A" letter-spacing="2" textLength="334.4" lengthAdjust="spacingAndGlyphs">Mistaking “being seen” for “being respected”</text>

  
  
  <g transform="translate(60, 200)">
    <line x1="0" y1="0" x2="0" y2="160" stroke="#A52A2A" stroke-width="3" />
    <text x="22" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="16.80" fill="#8B8680" letter-spacing="2">First</text>
    <text x="22" y="78" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="700" fill="#1A1A1A" letter-spacing="2" textLength="160.0" lengthAdjust="spacingAndGlyphs">Just starting to see some results</text>
    <text x="22" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.69" fill="#5C5852" letter-spacing="1">You want everyone to know</text>
    <text x="22" y="150" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#8B8680" letter-spacing="1">Said over and over among friends, at gatherings, and over drinks</text>
  </g>

  
  <g transform="translate(680, 200)">
    <line x1="0" y1="0" x2="0" y2="160" stroke="#A52A2A" stroke-width="3" />
    <text x="22" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#8B8680" letter-spacing="2">Second</text>
    <text x="22" y="78" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="700" fill="#1A1A1A" letter-spacing="2" textLength="160.0" lengthAdjust="spacingAndGlyphs">Just starting to build some resources</text>
    <text x="22" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#5C5852" letter-spacing="1">You can't help but put it on display for everyone to see</text>
    <text x="22" y="150" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#8B8680" letter-spacing="1">Business cards, connections, partners—name-dropped at every turn</text>
  </g>

  
  <line x1="60" y1="395" x2="1220" y2="395" stroke="#C8C0AE" stroke-width="1" stroke-dasharray="4 4" />

  
  <g transform="translate(60, 420)">
    <line x1="0" y1="0" x2="0" y2="160" stroke="#A52A2A" stroke-width="3" />
    <text x="22" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="16.80" fill="#8B8680" letter-spacing="2">Third</text>
    <text x="22" y="78" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22.40" font-weight="700" fill="#1A1A1A" letter-spacing="2" textLength="224.0" lengthAdjust="spacingAndGlyphs">Just starting to see through human nature</text>
    <text x="22" y="120" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#5C5852" letter-spacing="1" textLength="231.0" lengthAdjust="spacingAndGlyphs">You rush to expose it, rush to lecture others</text>
    <text x="22" y="150" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="11.20" fill="#8B8680" letter-spacing="1">Treat knowledge as ammunition and fire it at everyone you meet</text>
  </g>

  
  <g transform="translate(680, 420)">
    <rect x="0" y="0" width="540" height="160" fill="#1A1A1A" />
    <text x="22" y="32" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22" fill="#A52A2A" letter-spacing="2">COST</text>
    <line x1="22" y1="48" x2="92" y2="48" stroke="#A52A2A" stroke-width="2" />
    <text x="22" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="15.40" fill="#F5F1E8" letter-spacing="2" textLength="176.0" lengthAdjust="spacingAndGlyphs">Those in the light have no cover</text>
    <text x="22" y="122" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#C8C0AE">All the probing, jealousy, leveraging, and undermining</text>
    <text x="22" y="148" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12.60" fill="#C8C0AE" textLength="108.0" lengthAdjust="spacingAndGlyphs">They all come for him first</text>
  </g>

  
  <text x="640" y="640" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="14.00" fill="#5C5852" letter-spacing="4">Thinking you're wide awake · when you've merely stepped into the light</text>

  
  <text x="60" y="690" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#8B8680" textLength="58.9" lengthAdjust="spacingAndGlyphs">Concealing One’s Brilliance · Four</text>
  <text x="1220" y="690" text-anchor="end" font-family="&quot;Georgia&quot;, &quot;Georgia SC&quot;, Arial, sans-serif" font-size="14" fill="#8B8680">06</text>
</svg>
