    <tspan x="50" dy="26">Several exquisitely crafted gowns debuted at the Coachella Music Festival,</tspan>
    <tspan x="50" dy="26">Heritage and transformation converge in the interplay of light and shadow.</tspan>
  </text>

  
  <rect x="630" y="120" width="1" height="530" fill="#2A2520" />

  
  
