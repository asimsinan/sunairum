  <rect width="1280" height="720" fill="#0A0A0A" />

  
  <text x="50" y="35" font-family="Georgia, Georgia, serif" font-size="11" fill="#C9A96E" fill-opacity="0.7" letter-spacing="3">NEWS CAFÉ</text>
  <rect x="50" y="45" width="1180" height="1" fill="#2A2520" />

  
  <text x="640" y="85" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" fill="#F5F0EB" font-weight="bold" text-anchor="middle" textLength="195.9" lengthAdjust="spacingAndGlyphs">Dior’s Two-Sided Charm</text>
  <text x="640" y="105" font-family="Georgia, Georgia, serif" font-size="14" fill="#C9A96E" text-anchor="middle" letter-spacing="2">HAUTE COUTURE · HAUTE HORLOGERIE</text>

  
  
  <rect x="50" y="120" width="280" height="280" rx="10" fill="#1A1A1A" />
  <image href="../images/dior_fashion.jpg" x="50" y="120" width="280" height="280" preserveAspectRatio="xMidYMid slice" clip-path="url(#leftImg)" />

  
  <use data-icon="phosphor-duotone/dress" x="50" y="420" width="28" height="28" fill="#C9A96E" />
  <text x="86" y="442" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="17.12" fill="#E8D5B5" font-weight="bold">Fashion · Coachella</text>

