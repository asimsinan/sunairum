    <tspan x="670" dy="26">Limited-edition fine pieces. A striking red second hand, paying tribute to Monsieur Dior</tspan>
    <tspan x="670" dy="26">The searing, intense color of life within.</tspan>
  </text>

  
  <rect x="670" y="580" width="560" height="44" rx="6" fill="#1A1A1A" />
