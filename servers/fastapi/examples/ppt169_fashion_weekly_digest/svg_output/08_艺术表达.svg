<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <clipPath id="leftImg">
      <rect x="50" y="120" width="270" height="380" rx="10" />
    </clipPath>
    <clipPath id="rightImg">
      <rect x="670" y="120" width="560" height="300" rx="10" />
    </clipPath>
  </defs>

  
  <rect width="1280" height="720" fill="#0A0A0A" />

  
  <text x="50" y="35" font-family="Georgia, Georgia, serif" font-size="11" fill="#C9A96E" fill-opacity="0.7" letter-spacing="3">NEWS CAFÉ</text>
  <rect x="50" y="45" width="1180" height="1" fill="#2A2520" />

  
  <text x="640" y="85" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" fill="#F5F0EB" font-weight="bold" text-anchor="middle">Two Expressions of Art</text>
  <text x="640" y="105" font-family="Georgia, Georgia, serif" font-size="14" fill="#C9A96E" text-anchor="middle" letter-spacing="2">BOTTEGA VENETA × McQUEEN</text>

  
  <rect x="635" y="120" width="1" height="530" fill="#2A2520" />

  
  <rect x="50" y="120" width="270" height="380" rx="10" fill="#1A1A1A" />
  <image href="../images/bv_arts.jpg" x="50" y="120" width="270" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#leftImg)" />

  
  <use data-icon="phosphor-duotone/camera" x="340" y="130" width="26" height="26" fill="#C9A96E" />
  <text x="340" y="185" font-family="Georgia, Georgia, serif" font-size="20" fill="#E8D5B5" font-weight="bold">Bottega Veneta</text>
  <text x="340" y="210" font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="14" fill="#9E9690">for the Arts</text>

  <rect x="340" y="222" width="280" height="1" fill="#2A2520" />

  <text font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="15" fill="#F5F0EB">
    <tspan x="340" y="250">Art photography books, in collaboration with British photography</tspan>
    <tspan x="340" dy="24">Peter Fraser.</tspan>
    <tspan x="340" dy="30">With Venice as its inspirational setting,</tspan>
    <tspan x="340" dy="24">27 Images Focusing on Texture and Form</tspan>
    <tspan x="340" dy="24">and color.</tspan>
    <tspan x="340" dy="30">Interpreting the brand’s signature woven aesthetic,</tspan>
    <tspan x="340" dy="24">A tribute to its birthplace, Veneto.</tspan>
  </text>

  
  <rect x="670" y="120" width="560" height="300" rx="10" fill="#1A1A1A" />
  <image href="../images/mcqueen_exhibition.jpg" x="670" y="120" width="560" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#rightImg)" />

  <use data-icon="phosphor-duotone/palette" x="670" y="440" width="26" height="26" fill="#C9A96E" />
  <text x="704" y="460" font-family="Georgia, Georgia, serif" font-size="20" fill="#E8D5B5" font-weight="bold">McQueen</text>
  <text x="820" y="460" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9E9690" textLength="56.0" lengthAdjust="spacingAndGlyphs">Beneath the Surface</text>

  <rect x="670" y="475" width="560" height="1" fill="#2A2520" />

  <text font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="15" fill="#F5F0EB">
    <tspan x="670" y="505">Immersive exhibition at Fotografiska Shanghai</tspan>
    <tspan x="670" dy="24">Explore the brand’s artistic roots and dual aesthetics</tspan>
    <tspan x="670" dy="24">The Manta bag revives a 2010 classic, inspired by the manta ray</tspan>
  </text>

  <rect x="670" y="590" width="560" height="40" rx="6" fill="#1A1A1A" />
  <rect x="670" y="590" width="3" height="40" fill="#C9A96E" />
  <text x="690" y="615" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9E9690">Creative Director Seán McGirr’s Shanghai debut · Guo Caijie, Qu Chuxiao, and Zhou Yutong in attendance</text>

  
  <rect x="50" y="670" width="1180" height="1" fill="#2A2520" />
  <text x="50" y="695" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="7.70" fill="#9E9690" textLength="109.3" lengthAdjust="spacingAndGlyphs">NEWS Café · Weekly aesthetic digest</text>
  <text x="1230" y="695" font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="11" fill="#9E9690" text-anchor="end">08 / 16</text>
</svg>
