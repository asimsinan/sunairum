  <rect x="50" y="45" width="1180" height="1" fill="#2A2520" />

  <text x="640" y="85" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" fill="#F5F0EB" font-weight="bold" text-anchor="middle" textLength="120.0" lengthAdjust="spacingAndGlyphs">A New Cross-Disciplinary Wave</text>
  <text x="640" y="105" font-family="Georgia, Georgia, serif" font-size="14" fill="#C9A96E" text-anchor="middle" letter-spacing="2">JORYA × ARKET</text>

  <rect x="635" y="120" width="1" height="530" fill="#2A2520" />

  
