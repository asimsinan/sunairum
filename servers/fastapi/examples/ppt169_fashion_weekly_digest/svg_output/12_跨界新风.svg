  <rect x="670" y="120" width="560" height="290" rx="10" fill="#1A1A1A" />
  <image href="../images/arket_gohar.jpg" x="670" y="120" width="560" height="290" preserveAspectRatio="xMidYMid slice" clip-path="url(#rightImg)" />

