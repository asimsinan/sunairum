  <text x="690" y="603" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#E8D5B5" font-style="italic">Blending Eastern philosophy with youthful vitality to carry forward the aesthetics of natural skincare</text>

  <rect x="50" y="670" width="1180" height="1" fill="#2A2520" />
