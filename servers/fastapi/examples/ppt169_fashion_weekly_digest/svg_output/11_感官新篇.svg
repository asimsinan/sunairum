  <rect x="50" y="45" width="1180" height="1" fill="#2A2520" />

  <text x="640" y="85" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" fill="#F5F0EB" font-weight="bold" text-anchor="middle" textLength="120.0" lengthAdjust="spacingAndGlyphs">A new sensory chapter</text>
  <text x="640" y="105" font-family="Georgia, Georgia, serif" font-size="14" fill="#C9A96E" text-anchor="middle" letter-spacing="2">BOSS × FRESH</text>

  <rect x="635" y="120" width="1" height="530" fill="#2A2520" />

  
  <rect x="50" y="120" width="270" height="380" rx="10" fill="#1A1A1A" />
  <image href="../images/boss_fragrance.jpg" x="50" y="120" width="270" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#leftImg)" />

  <use data-icon="phosphor-duotone/flower" x="340" y="130" width="26" height="26" fill="#C9A96E" />
  <text x="340" y="185" font-family="Georgia, Georgia, serif" font-size="20" fill="#E8D5B5" font-weight="bold">BOSS</text>
