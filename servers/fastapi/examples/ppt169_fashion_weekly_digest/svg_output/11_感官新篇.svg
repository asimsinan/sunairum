    <tspan x="340" dy="24">Dual-pole fragrance released simultaneously</tspan>
    <tspan x="340" dy="24">Wooden vitality and leather elegance</tspan>
    <tspan x="340" dy="30">Gradient bottle + double-B logo</tspan>
    <tspan x="340" dy="24">Now available at Sephora</tspan>
  </text>

  <text x="340" y="420" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.10" fill="#9E9690">Wang Tianchen · Jiao Maiqi · Li Sirong in attendance</text>

  
  <rect x="670" y="120" width="560" height="290" rx="10" fill="#1A1A1A" />
  <image href="../images/fresh_event.jpg" x="670" y="120" width="560" height="290" preserveAspectRatio="xMidYMid slice" clip-path="url(#rightImg)" />

  <use data-icon="phosphor-duotone/sparkle" x="670" y="430" width="26" height="26" fill="#C9A96E" />
  <text x="704" y="450" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="20" fill="#E8D5B5" font-weight="bold">fresh Fresh</text>
  <text x="860" y="450" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9E9690">“Yeast, go wild”</text>

  <rect x="670" y="465" width="560" height="1" fill="#2A2520" />

  <text font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="15" fill="#F5F0EB">
