<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <clipPath id="leftImg">
      <rect x="50" y="120" width="560" height="280" rx="10" />
    </clipPath>
    <clipPath id="rightImg">
      <rect x="670" y="120" width="280" height="400" rx="10" />
    </clipPath>
  </defs>

  
  <rect width="1280" height="720" fill="#0A0A0A" />

  
  <text x="50" y="35" font-family="Georgia, Georgia, serif" font-size="11" fill="#C9A96E" fill-opacity="0.7" letter-spacing="3">NEWS CAFÉ</text>
  <rect x="50" y="45" width="1180" height="1" fill="#2A2520" />

  
  <text x="640" y="85" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="21.00" fill="#F5F0EB" font-weight="bold" text-anchor="middle" textLength="120.0" lengthAdjust="spacingAndGlyphs">A New Chapter of Heritage</text>
  <text x="640" y="105" font-family="Georgia, Georgia, serif" font-size="14" fill="#C9A96E" text-anchor="middle" letter-spacing="2">MAX MARA × CHLOÉ</text>

  
  <rect x="635" y="120" width="1" height="530" fill="#2A2520" />

  
  <rect x="50" y="120" width="560" height="280" rx="10" fill="#1A1A1A" />
  <image href="../images/maxmara_show.jpg" x="50" y="120" width="560" height="280" preserveAspectRatio="xMidYMid slice" clip-path="url(#leftImg)" />

  <use data-icon="phosphor-duotone/scissors" x="50" y="420" width="26" height="26" fill="#C9A96E" />
  <text x="84" y="440" font-family="Georgia, Georgia, serif" font-size="20" fill="#E8D5B5" font-weight="bold">Max Mara</text>
  <text x="210" y="440" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9E9690" textLength="48.0" lengthAdjust="spacingAndGlyphs">75th anniversary</text>

  <rect x="50" y="455" width="560" height="1" fill="#2A2520" />

  <text font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="15" fill="#F5F0EB">
    <tspan x="50" y="485">Global Debut of the 2027 Early Spring Collection</tspan>
    <tspan x="50" dy="24">June 16, 2026 · Shanghai Long Museum</tspan>
  </text>

  <text font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="15" fill="#F5F0EB">
    <tspan x="50" y="550">"THE MAX!" 75th Anniversary Brand Archive Exhibition</tspan>
    <tspan x="50" dy="24">Curator Olivier Saillard · Open to the public June 17</tspan>
  </text>

  
  <rect x="670" y="120" width="280" height="400" rx="10" fill="#1A1A1A" />
  <image href="../images/chloe_tomato.jpg" x="670" y="120" width="280" height="400" preserveAspectRatio="xMidYMid slice" clip-path="url(#rightImg)" />

  <use data-icon="phosphor-duotone/sparkle" x="970" y="130" width="26" height="26" fill="#C9A96E" />
  <text x="970" y="185" font-family="Georgia, Georgia, serif" font-size="20" fill="#E8D5B5" font-weight="bold">Chloé</text>
  <text x="970" y="210" font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="14" fill="#9E9690">× Poltronova</text>

  <rect x="970" y="225" width="260" height="1" fill="#2A2520" />

  <text font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="15" fill="#F5F0EB">
