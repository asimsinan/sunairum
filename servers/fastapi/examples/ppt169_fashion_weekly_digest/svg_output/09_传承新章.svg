    <tspan x="970" dy="24">Limited-edition reissue</tspan>
    <tspan x="970" dy="30">1970 Christian Adam</tspan>
    <tspan x="970" dy="24">Design’s Signature Collection</tspan>
    <tspan x="970" dy="30">The Italian Radical Design movement</tspan>
    <tspan x="970" dy="24">historical witness</tspan>
  </text>

  <text x="970" y="440" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.19" fill="#9E9690">Cream white · Light taupe · Sand · Black</text>

  
  <rect x="50" y="670" width="1180" height="1" fill="#2A2520" />
  <text x="50" y="695" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="7.70" fill="#9E9690" textLength="109.3" lengthAdjust="spacingAndGlyphs">NEWS Café · Weekly aesthetic digest</text>
  <text x="1230" y="695" font-family="'Georgia', 'Georgia SC', Arial, sans-serif" font-size="11" fill="#9E9690" text-anchor="end">09 / 16</text>
