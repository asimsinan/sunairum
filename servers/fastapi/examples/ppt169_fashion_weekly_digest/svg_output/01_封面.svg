  <rect x="50" y="45" width="1180" height="1" fill="url(#goldLine)" fill-opacity="0.4" />

  
  <text x="50" y="35" font-family="Georgia, Georgia, serif" font-size="11" fill="#C9A96E" fill-opacity="0.7" letter-spacing="3">NEWS CAFÉ</text>

  
  <text x="1230" y="35" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.81" fill="#9E9690" text-anchor="end">April 2026 · Issue 16</text>

  
  <use data-icon="phosphor-duotone/crown" x="580" y="390" width="40" height="40" fill="#C9A96E" />

  
  <text x="640" y="480" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="42.00" fill="#F5F0EB" text-anchor="middle" font-weight="bold" textLength="240.0" lengthAdjust="spacingAndGlyphs">The Aesthetic Weekly</text>

  
  <rect x="440" y="500" width="400" height="1.5" fill="url(#goldLine)" />

  
