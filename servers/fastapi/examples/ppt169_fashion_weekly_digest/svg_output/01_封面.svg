  <text x="640" y="580" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="9.80" fill="#9E9690" text-anchor="middle">This week's fashion hotspots are here—enjoy the beautiful roundup with peace of mind</text>

  
